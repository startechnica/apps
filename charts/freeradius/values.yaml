## @section Container parameters
## -----------------------------------------------------------------------------
## Anything that lives on the FreeRADIUS container spec: command/args overrides,
## ports, security context, resources, probes, lifecycle hooks, extra volumes,
## and sidecars / init containers.
## =============================================================================

## @param command Override the default container command (useful when the bundled image's entrypoint isn't what you want). Ignored when `diagnosticMode.enabled` is true.
##
command: []
## @param args Override the default container args. Ignored when `diagnosticMode.enabled` is true.
##
args: []
## @param lifecycleHooks lifecycleHooks for the FreeRADIUS container(s) to automate configuration before or after startup
##
lifecycleHooks: {}
## @param containerPorts.auth FreeRADIUS Auth container port (UDP)
## @param containerPorts.acct FreeRADIUS Accounting container port (UDP)
## @param containerPorts.coa FreeRADIUS CoA container port (UDP)
## @param containerPorts.radsec FreeRADIUS RADSEC container port (TCP, TLS)
## @param containerPorts.status FreeRADIUS Status container port (UDP). Cluster-reachable when `metrics.enabled` so the standalone exporter Deployment can scrape it. Locked down to RADIUS pods + the metrics exporter via NetworkPolicy.
## @param containerPorts.metrics Prometheus exporter container port (TCP). Lives on the standalone exporter pod (`templates/metrics/Deployment.yaml`), NOT the FreeRADIUS container.
##
containerPorts:
  auth: 1812
  acct: 1813
  coa: 3799
  radsec: 2083
  status: 18121
  metrics: 9812
## @param extraPorts Extra ports for container deployment
##
extraPorts: []
## FreeRADIUS Pod security context. Defaults are friendly to the upstream
## `freeradius/freeradius-server` image which runs as UID/GID 101.
##
## @param podSecurityContext.enabled Enable security context for FreeRADIUS pods
## @param podSecurityContext.fsGroup Group ID for the mounted volumes' filesystem
## @param podSecurityContext.runAsUser User ID for the FreeRADIUS pod
##
podSecurityContext:
  enabled: true
  fsGroupChangePolicy: Always
  sysctls: []
  supplementalGroups: []
  fsGroup: 101
## FreeRADIUS container security context. Defaults follow the Pod Security
## Standard "restricted" profile (allowPrivilegeEscalation: false, drop ALL
## capabilities, runAsNonRoot, seccomp RuntimeDefault) — flipping `enabled: true`
## immediately yields a hardened container. `SYS_PTRACE` is added because the
## upstream image's `radiusd -fxx` exec mode uses ptrace for debug output.
##
## @param containerSecurityContext.enabled FreeRADIUS container securityContext
## @param containerSecurityContext.capabilities Linux capabilities to add/drop on the FreeRADIUS container
## @param containerSecurityContext.runAsUser User ID for the FreeRADIUS container
## @param containerSecurityContext.runAsNonRoot Set FreeRADIUS container's Security Context runAsNonRoot
## @param containerSecurityContext.readOnlyRootFilesystem Mount the container's root filesystem as read-only. The chart already provides a writable emptyDir mount at `/startechnica/freeradius/tmp`, so this is generally safe.
## @param containerSecurityContext.allowPrivilegeEscalation Block child processes from gaining more privileges than the parent (required by PSS "restricted")
## @param containerSecurityContext.seccompProfile Seccomp profile applied to the container
##
containerSecurityContext:
  enabled: true
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - SYS_PTRACE
    drop: ["ALL"]
  privileged: false
  runAsUser: 101
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  seLinuxOptions: {}

## FreeRADIUS containers' resource requests and limits
## ref: https://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
## @param resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). Ignored if `resources` is set.
##
resourcesPreset: "g-2xsmall"
## @param resources Set container requests and limits for different resources like CPU or memory (essential for production workloads)
##
resources: {}

## Configure extra options for FreeRADIUS containers' liveness, readiness and
## startup probes. The chart's probes use `radclient status` against the
## `status` virtual server (`sites.status.enabled`). Disable that block
## or supply `customLivenessProbe` / `customReadinessProbe` if you need
## different checks.
##
## @param startupProbe.enabled Enable startupProbe
## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
## @param startupProbe.periodSeconds Period seconds for startupProbe
## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
## @param startupProbe.failureThreshold Failure threshold for startupProbe
## @param startupProbe.successThreshold Success threshold for startupProbe
##
startupProbe:
  enabled: false
  exec:
    command:
      - sh
      - /scripts/startup.sh
  initialDelaySeconds: 120
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 10
  successThreshold: 1
## @param livenessProbe.enabled Enable livenessProbe
## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
## @param livenessProbe.periodSeconds Period seconds for livenessProbe
## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
## @param livenessProbe.successThreshold Success threshold for livenessProbe
##
livenessProbe:
  enabled: true
  exec:
    command:
      - sh
      - /scripts/healthcheck.sh
  initialDelaySeconds: 120
  periodSeconds: 60
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1
## @param readinessProbe.enabled Enable readinessProbe
## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
## @param readinessProbe.periodSeconds Period seconds for readinessProbe
## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
## @param readinessProbe.successThreshold Success threshold for readinessProbe
##
readinessProbe:
  enabled: true
  exec:
    command:
      - sh
      - /scripts/healthcheck.sh
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1
## @param customStartupProbe Override default startup probe for FreeRADIUS containers
##
customStartupProbe: {}
## @param customLivenessProbe Override default liveness probe for FreeRADIUS containers
##
customLivenessProbe: {}
## @param customReadinessProbe Override default readiness probe for FreeRADIUS containers
##
customReadinessProbe: {}
## @param startupWaitOptions Override default builtin startup wait check options for FreeRADIUS containers
##
startupWaitOptions: {}

## @param extraVolumes Additional volumes attached to the FreeRADIUS pod. Pair with `extraVolumeMounts` below.
## extraVolumes:
##  - name: my-volume
##    configMap:
##      name: my-configmap
##
extraVolumes: []
## @param extraVolumeMounts Additional volume mounts attached to the FreeRADIUS container.
##
extraVolumeMounts: []
## @param extraModules [array] Mount additional FreeRADIUS module files from ConfigMaps you provide (the chart does NOT render the content). Each entry: `name` is the on-disk filename + pod volume name, mounted at `mods-enabled/<name>` via `subPath` (valid DNS-1123 label; must not collide with a built-in volume name such as `data`/`temp`/`freeradius-sites` or a built-in module name `sql`/`rest`/`json`/`pam`/`pap`/`eap`); `existingConfigMap` is the ConfigMap to mount; `key` is the data key within it (defaults to `name`).
## extraModules:
##   - name: ldap
##     existingConfigMap: my-ldap-module
##     key: ldap
##
extraModules: []
## @param extraSites [array] Mount additional FreeRADIUS virtual-server (site) files from ConfigMaps you provide (projected into the shared sites volume; the chart does NOT render the content). Each entry: `name` is the on-disk filename at `sites-enabled/<name>` (valid DNS-1123 label, no collision with built-in volume names); `existingConfigMap` is the ConfigMap to mount; `key` is the data key within it (defaults to `name`).
## extraSites:
##   - name: my-vhost
##     existingConfigMap: my-vhost-site
##     key: my-vhost
##
extraSites: []
## Custom `mods-config` data projected into the container under
## `/etc/freeradius/mods-config/<subdir>/`. Each top-level key is a subdirectory
## name; its value is a map of `filename: content` (content is rendered with
## `tpl`). These are DATA files only — REST body templates, policy snippets,
## attribute maps, a `files`-style user list — referenced via `$INCLUDE`/xlat
## from a module instance in `mods-enabled/` or a policy. Dropping a file here
## does NOT load a module on its own; the module instance still lives in
## `mods-enabled/` (e.g. a custom `rest` or `sql` instance).
##
## @param modsConfig [object] Map of mods-config subdirectories to their files (`modsConfig.<subdir>.<filename>`).
## modsConfig:
##   files:
##     authorize: |
##       # mods-config/files/authorize -- rlm_files user entries
##       alice  Cleartext-Password := "s3cret"
##              Reply-Message := "Hello %{User-Name}"
##
modsConfig: {}
## Keycloak integration — authenticate RADIUS users against Keycloak's OIDC
## token endpoint (ROPC password grant). ROPC only works for cleartext-password
## flows (PAP, or EAP-TTLS/PAP inner) — PEAP/MSCHAPv2 cannot authenticate
## against Keycloak. Enable "Direct Access Grants" on the Keycloak client.
##
## Multi-instance: configure one or more Keycloak backends under
## `keycloak.instances.<name>`, then bind each NAS to a backend via
## `clients.<x>.keycloak: <name>`. Direction is NAS → instance, never the
## reverse. The chart renders an if/elsif dispatch chain in the shared
## default virtual server, matching `Packet-Src-IP-Address` against each
## bound client's `ipv4addr` and calling the matching instance's
## `keycloak_<name>_authorize` policy. A `default` instance (when present
## with `wireDefaultSite: true`) is wired as the `else` branch — unmatched
## NAS fall through to it.
##
## Two backends per instance, selected by `instances.<name>.mode`:
##   - `python`: rlm_python3 script doing ROPC + JWT-claims flow using only
##     the Py3 stdlib. Renders into a per-instance ConfigMap key
##     `keycloak_<name>.py` (Python module name — underscores only;
##     instance names with hyphens are rejected). rlm_python3 IS bundled in
##     the default `freeradius/freeradius-server:3.2.8` image — no rebuild
##     needed. Recommended.
##   - `lua`: rlm_lua script doing the same flow. Renders into a
##     per-instance ConfigMap key `keycloak_<name>.lua`. rlm_lua is NOT
##     bundled — needs a custom image with `freeradius-lua`, `lua-cjson`,
##     `luasec`, and `luasocket`.
##
## All modes store `clientSecret` (when set) in a per-instance Secret and
## inject it via `$ENV{FREERADIUS_KEYCLOAK_<NAME>_CLIENT_SECRET}`. The
## implicit `default` instance keeps the legacy unprefixed env-var name
## (`FREERADIUS_KEYCLOAK_CLIENT_SECRET`) and the legacy Secret name
## (`<fullname>-keycloak`) for backwards compatibility.
##
## Deprecation: top-level fields (`keycloak.mode`, `keycloak.url`,
## `keycloak.realm`, …) are DEPRECATED. When set and `keycloak.instances`
## has no `default` entry, the chart synthesises one from them and emits a
## warning via NOTES.txt. Migrate to `keycloak.instances.default: { … }`
## at your convenience.
##
## @param keycloak.enabled Render the Keycloak auth configs + Secrets and mount them into the pod. Acts as the master feature gate; renders nothing when `false`.
## @param keycloak.wireDefaultSite Auto-wire the `default` instance's `keycloak_authorize` as the `else` branch of the dispatch chain in `sites/default` (catches NAS that aren't bound to a named instance via `clients.<x>.keycloak`). No-op when no `default` instance is configured.
## @param keycloak.unmatchedReject When `true` AND no `default` instance is wired, the dispatch chain's `else` branch rejects unmatched NAS instead of falling through to `pap`. Off by default.
##
## --- Legacy top-level fields (DEPRECATED) -----------------------------
## Setting any of these auto-synthesises `keycloak.instances.default` with
## the values below. Prefer `keycloak.instances.default: { … }` in new
## values files. The shim will be removed in the next major.
##
## @param keycloak.mode [DEPRECATED — use `keycloak.instances.default.mode`] Auth backend: `lua` / `python`.
## @param keycloak.url [DEPRECATED — use `keycloak.instances.default.url`] Base URL of the Keycloak server.
## @param keycloak.realm [DEPRECATED — use `keycloak.instances.default.realm`] Keycloak realm holding the users.
## @param keycloak.clientId [DEPRECATED — use `keycloak.instances.default.clientId`] OIDC client_id with Direct Access Grants enabled.
## @param keycloak.clientSecret [DEPRECATED — use `keycloak.instances.default.clientSecret`] Confidential-client secret. Stored in a Secret and injected via `$ENV`.
## @param keycloak.scope [DEPRECATED — use `keycloak.instances.default.scope`] OAuth scope (space-separated).
## @param keycloak.connectTimeout [DEPRECATED — use `keycloak.instances.default.connectTimeout`] Socket timeout (seconds).
## @param keycloak.roleAttribute [DEPRECATED — use `keycloak.instances.default.roleAttribute`] Control attribute the mapper populates with role names.
## @param keycloak.roleMapper [DEPRECATED — use `keycloak.instances.default.roleMapper`] Source of role names: `client` or `realm`.
## @param keycloak.denyWithoutRole [DEPRECATED — use `keycloak.instances.default.denyWithoutRole`] Reject when no role matches.
## @param keycloak.roleMappings [DEPRECATED — use `keycloak.instances.default.roleMappings`] Ordered role→reply map (first match wins).
## @param keycloak.tls.caCert [DEPRECATED — use `keycloak.instances.default.tls.caCert`] Inline PEM CA bundle.
## @param keycloak.tls.existingSecret [DEPRECATED — use `keycloak.instances.default.tls.existingSecret`] BYO Secret with CA bundle.
## @param keycloak.tls.existingSecretCaKey [DEPRECATED — use `keycloak.instances.default.tls.existingSecretCaKey`] Key inside `existingSecret`.
## @param keycloak.tls.insecure [DEPRECATED — use `keycloak.instances.default.tls.insecure`] Skip TLS verification (dev only).
## @param keycloak.cache.enabled [DEPRECATED — use `keycloak.instances.default.cache.enabled`] Render a `keycloak_default_cache` rlm_cache instance and wire it into the policy.
## @param keycloak.cache.ttl [DEPRECATED — use `keycloak.instances.default.cache.ttl`] Cache TTL (seconds).
##
## Note: the deprecation shim does NOT mirror the newer per-instance keys
## (`groupAttribute`, `groupMappings`, `require`, `attributeMappings`,
## `introspect`, `refreshTokenCache`). To use any of those, migrate to
## `keycloak.instances.default: { ... }`.
##
## --- Per-instance schema ----------------------------------------------
##
## Each top-level key under `keycloak.instances` is a FreeRADIUS module
## instance name (used as `keycloak_<name>` in unlang, must match
## `^[a-z][a-z0-9_]*$`). The chart renders, per instance:
##   * one `keycloak_<name>` module block (`mods-enabled/keycloak_<name>`)
##     of type `lua` / `python3` / `rest` per `mode`
##   * one `keycloak_<name>_authorize` policy + (lua/python) one
##     `keycloak_<name>_roles` policy (`policy.d/keycloak_<name>`)
##   * (lua/python) one mapper-script file at
##     `/etc/freeradius/scripts/{keycloak_<name>.lua, keycloak_<name>.py}` —
##     a per-instance wrapper with config baked in by Helm at chart-render
##     time that delegates to the shared `keycloak_common.{lua,py}` library
##   * one Opaque Secret `<fullname>-keycloak-<name>` holding the
##     `client-secret` (when `clientSecret` is non-empty and
##     `existingSecret` empty)
##   * (when TLS CA configured) one Opaque Secret
##     `<fullname>-keycloak-<name>-ca` mounted at
##     `/etc/freeradius/certs-keycloak-<name>/ca.crt`
##   * (when `cache.enabled`) one `cache keycloak_<name>_cache` rlm_cache
##     block in `mods-enabled/cache`, Redis-backed, with the cache key
##     hard-coded to `keycloak:<name>:%{User-Name}` (non-overridable —
##     namespacing prevents cross-instance cache hits on common usernames)
##
## The implicit `default` instance keeps the legacy resource names for
## backwards compatibility: module instance `keycloak_lua` / `keycloak_python`
## / `keycloak_rest`; policy `keycloak_authorize`; Secret `<fullname>-keycloak`
## with key `client-secret`; `_CLIENT_SECRET` env var unprefixed
## (`FREERADIUS_KEYCLOAK_CLIENT_SECRET`); CA mount `/etc/freeradius/certs-keycloak/`;
## script filenames `keycloak.lua` / `keycloak.py`.
##
## Per-instance extras (also available on the legacy top-level when
## migrated to `keycloak.instances.default`):
##
##   groupAttribute / groupMappings — mirror of role mapping, but reads
##     the Keycloak `groups` claim (emitted by the "Group Membership" client
##     mapper, e.g. `["/branch-a", "/branch-a/hotspot"]`) and matches each
##     value against `groupMappings[*].group`. First match wins; same reply
##     shape as `roleMappings`. The group list lands in
##     `&control:<groupAttribute>` (default `Class` — collides with the role
##     default, validator rejects that combination).
##
##   require — list of JWT claim names that must be truthy after decode (or
##     introspection). Rejects early when any guard fails — e.g.
##     `require: [email_verified]` blocks unverified-email logins even when
##     ROPC itself succeeded. Cheap defence against
##     "user authenticated but admin-disabled-since-issuance".
##
##   attributeMappings — generic `[{claim, reply}]` engine that copies any
##     JWT claim verbatim to a reply attribute. `claim` is the JWT key
##     (top-level only; dotted-path is NOT supported); `reply` is a
##     FreeRADIUS reply-attribute name. Lower-level than role/group mapping
##     (no per-value translation table) — use when you want
##     `preferred_username` → `User-Name`, `sub` → `Class`, custom user
##     attribute → `Filter-Id`, etc. Caches the chosen reply attrs so
##     resumption after a cache hit preserves them.
##
##   introspect — switch from local JWT decode to RFC 7662
##     `/realms/<realm>/protocol/openid-connect/token/introspect`. Catches
##     token revocation, admin-disabled-since-issuance, realm key rotation
##     at the cost of one extra HTTPS call per auth (or per cache miss).
##     Requires `clientSecret` (introspection is Basic-Auth-authenticated).
##
##   refreshTokenCache — only meaningful when `cache.enabled`. Stores the
##     `refresh_token` in `&control:Tmp-String-9` and renders a second
##     module instance `keycloak_<name>_validate` (rlm_python3 / rlm_lua
##     with `func_authorize = "validate"`). The policy calls it on cache
##     hit: it attempts `grant_type=refresh_token` against Keycloak; if
##     Keycloak rejects (user disabled, password changed, session
##     revoked) the cache entry is invalidated and the request is
##     rejected. Cuts the cost of role re-evaluation while keeping
##     invalidation honest. Adds one HTTPS round-trip on every cache hit.
##
## @param keycloak.instances [object] Named Keycloak backends. Map key = FreeRADIUS module instance name (matching `^[a-z][a-z0-9_]*$`); value = backend config dict (mirrors the legacy top-level keys). Bind a NAS to one with `clients.<name>.keycloak: <instance-name>`. The `default` instance, when present, is also the auto-wired fallback (see `wireDefaultSite`).
## instances:
##   default:
##     mode: python
##     url: https://auth.example.com
##     realm: "master"
##     clientId: freeradius
##     clientSecret: ""
##   nas1:
##     mode: python
##     url: https://kc.corp.example.com
##     realm: corp
##     clientId: nas-corp
##     clientSecret: "..."
##     cache:
##       enabled: true
##       ttl: 300
##     tls:
##       existingSecret: corp-keycloak-ca
##     require:
##       - email_verified
##     roleMappings:
##       - role: network-admin
##         reply:
##           - 'Service-Type := Administrative-User'
##     groupAttribute: Filter-Id
##     groupMappings:
##       - group: "/branch-a"
##         reply:
##           - 'Tunnel-Private-Group-Id:0 := "10"'
##     attributeMappings:
##       - claim: preferred_username
##         reply: User-Name
##     introspect: true
##     refreshTokenCache: true
##   nas2:
##     mode: lua
##     url: https://kc.branch.example.com
##     realm: branch
##     clientId: nas-branch
##
keycloak:
  enabled: false
  wireDefaultSite: true
  unmatchedReject: false

  ## Legacy top-level fields — see deprecation notes above. Leave at defaults
  ## (empty `realm`) to disable the implicit-default shim. Setting any of
  ## these auto-creates `keycloak.instances.default` at render time.
  ##
  mode: python
  url: https://auth.example.com
  realm: ""
  clientId: freeradius
  clientSecret: ""
  scope: ""                      # e.g. "openid profile email"
  connectTimeout: "4.0"
  roleAttribute: Class
  roleMapper: client
  denyWithoutRole: false
  cache:
    enabled: false
    ttl: 300
  tls:
    caCert: ""
    existingSecret: ""
    existingSecretCaKey: "ca.crt"
    insecure: false
  roleMappings: []
  #   - role: network-admin
  #     reply:
  #       - 'Service-Type := Administrative-User'
  #       - 'Filter-Id := "network-admin-policy"'
  #       - 'Cisco-AVPair := "shell:priv-lvl=15"'
  #   - role: wifi-user
  #     reply:
  #       - 'Tunnel-Type:0 := VLAN'
  #       - 'Tunnel-Medium-Type:0 := IEEE-802'
  #       - 'Tunnel-Private-Group-Id:0 := "10"'
  #       - 'Filter-Id := "wifi-user-policy"'
  #   - role: wifi-guest
  #     reply:
  #       - 'Tunnel-Type:0 := VLAN'
  #       - 'Tunnel-Medium-Type:0 := IEEE-802'
  #       - 'Tunnel-Private-Group-Id:0 := "99"'
  #       - 'Session-Timeout := 3600'

  ## Newer per-instance fields are NOT mirrored by the legacy top-level
  ## shim. Set them on `keycloak.instances.<name>` directly.
  ##
  instances: {}
## @param initContainers Add additional init containers for the FreeRADIUS pod(s)
##
initContainers: []
## @param sidecars Additional sidecar containers added to the FreeRADIUS pod
##
sidecars: []


## =============================================================================
## @section Persistence parameters
## -----------------------------------------------------------------------------
## PersistentVolumeClaim consumed by `templates/PersistentVolumeClaim.yaml` and
## auto-mounted into the FreeRADIUS container at `persistence.mountPath`.
## When disabled, the chart falls back to an `emptyDir`. The FreeRADIUS image
## runs as UID/GID 101 — make sure the volume is writable by that user
## (or enable `bootstrap.volumePermissions.enabled` to chown it via an init container).
## =============================================================================

## @param persistence.enabled Render a PersistentVolumeClaim AND mount it into the FreeRADIUS container at `persistence.mountPath`.
## @param persistence.existingClaim Name of an externally-managed PVC to reference instead of creating one.
## @param persistence.storageClass StorageClass for the PVC. Defaults to `global.storageClass` when both are empty. Set to `-` to disable dynamic provisioning.
## @param persistence.accessModes List of access modes requested on the PVC.
## @param persistence.size Storage capacity requested on the PVC.
## @param persistence.mountPath Path inside the FreeRADIUS container where the PVC is mounted. Defaults match the upstream image's data path.
## @param persistence.subPath Sub-path within the volume mounted at `mountPath`.
## @param persistence.annotations Extra annotations applied to the PVC. Merged with `commonAnnotations`.
## @param persistence.selector Label selector for binding to a specific pre-provisioned PV.
## @param persistence.dataSource Source the PVC clones from (Snapshot or another PVC).
##
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  mountPath: /startechnica/freeradius
  subPath: ""
  annotations: {}
  selector: {}
  dataSource: {}


## =============================================================================
## @section Metrics parameters
## -----------------------------------------------------------------------------
## Standalone `bvantagelimited/freeradius_exporter` Deployment. When
## `metrics.enabled: true` the chart renders the exporter as a **separate
## Deployment** (`templates/metrics/Deployment.yaml`) — NOT a sidecar on the
## FreeRADIUS pod. The exporter pod talks to the FreeRADIUS `status` virtual
## server over the in-cluster Service, then exposes Prometheus metrics on
## its own Service (`<release>-freeradius-metrics`) at `service.ports.metrics`.
##
## **Requires `sites.status.enabled: true`** AND `status` reachable on
## the Service (the chart's defaults handle both: `sites.status.listen`
## defaults to `0.0.0.0` and `service.ports.status` is auto-published).
##
## ServiceMonitor / PrometheusRule are only rendered when both `metrics.enabled`
## and the matching sub-block flag are true (and the Prometheus Operator CRDs
## are present). Manifests live under `templates/metrics/`.
## =============================================================================

metrics:
  ## @param metrics.enabled Render the standalone `bvantagelimited/freeradius_exporter` Deployment and Service. Requires `sites.status.enabled: true`.
  ##
  enabled: false
  ## @param metrics.replicaCount Number of exporter pods.
  ##
  replicaCount: 1
  ## FreeRADIUS Prometheus exporter image.
  ## ref: https://github.com/bvantagelimited/freeradius_exporter
  ##
  ## @param metrics.image.registry FreeRADIUS exporter image registry
  ## @param metrics.image.repository FreeRADIUS exporter image repository
  ## @param metrics.image.tag FreeRADIUS exporter image tag
  ## @param metrics.image.digest FreeRADIUS exporter image digest (overrides `tag` when set)
  ## @param metrics.image.pullPolicy FreeRADIUS exporter image pull policy
  ## @param metrics.image.pullSecrets FreeRADIUS exporter image pull secrets
  ##
  image:
    registry: ghcr.io
    repository: bvantagelimited/freeradius_exporter
    tag: "1.4.4"
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
  ## @param metrics.extraArgs Extra command-line flags passed to the exporter (e.g. `--freeradius.timeout=5s`, `--log.level=debug`).
  ##
  extraArgs: []
  ## @param metrics.extraEnvVars Extra environment variables for the exporter container. Use this for `RADIUS_*` overrides that aren't covered by the defaults below.
  ## E.g.
  ## extraEnvVars:
  ##   - name: RADIUS_USERNAME
  ##     value: monitor
  ##
  extraEnvVars: []
  ## @param metrics.resources Set container requests and limits for the exporter container.
  ##
  resources:
    limits: {}
    requests: {}
  ## Exporter container security context. Defaults to the PSS "restricted"
  ## profile — the bvantagelimited image is a static Go binary and works fine
  ## with `readOnlyRootFilesystem: true` and dropping all capabilities.
  ##
  ## @param metrics.containerSecurityContext.enabled Apply the security context to the exporter container.
  ## @param metrics.containerSecurityContext.runAsUser UID for the exporter container.
  ## @param metrics.containerSecurityContext.runAsNonRoot Reject containers that try to run as root.
  ## @param metrics.containerSecurityContext.allowPrivilegeEscalation Block child processes from gaining more privileges than the parent.
  ## @param metrics.containerSecurityContext.readOnlyRootFilesystem Mount the container's root filesystem as read-only.
  ## @param metrics.containerSecurityContext.capabilities Linux capabilities to add/drop on the exporter container.
  ## @param metrics.containerSecurityContext.seccompProfile Seccomp profile applied to the exporter container.
  ##
  containerSecurityContext:
    enabled: true
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions: {}
  ## Exporter probes (HTTP GET against the `/metrics` endpoint).
  ##
  ## @param metrics.livenessProbe.enabled Enable livenessProbe on the exporter container.
  ## @param metrics.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe.
  ## @param metrics.livenessProbe.periodSeconds Period seconds for livenessProbe.
  ## @param metrics.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe.
  ## @param metrics.livenessProbe.failureThreshold Failure threshold for livenessProbe.
  ## @param metrics.livenessProbe.successThreshold Success threshold for livenessProbe.
  ##
  livenessProbe:
    enabled: true
    exec:
      command:
        - sh
        - /health/healthcheck.sh
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  ## @param metrics.readinessProbe.enabled Enable readinessProbe on the exporter container.
  ## @param metrics.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe.
  ## @param metrics.readinessProbe.periodSeconds Period seconds for readinessProbe.
  ## @param metrics.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe.
  ## @param metrics.readinessProbe.failureThreshold Failure threshold for readinessProbe.
  ## @param metrics.readinessProbe.successThreshold Success threshold for readinessProbe.
  ##
  readinessProbe:
    enabled: true
    exec:
      command:
        - sh
        - /health/healthcheck.sh
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  ## @param metrics.customLivenessProbe Verbatim override of the exporter livenessProbe.
  ##
  customLivenessProbe: {}
  ## @param metrics.customReadinessProbe Verbatim override of the exporter readinessProbe.
  ##
  customReadinessProbe: {}
  ## @param metrics.podAnnotations Annotations applied to the exporter pod.
  ##
  podAnnotations: {}
  ## @param metrics.podLabels Extra labels applied to the exporter pod.
  ##
  podLabels: {}
  ## @param metrics.nodeSelector Node labels for exporter pod assignment.
  ##
  nodeSelector: {}
  ## @param metrics.tolerations Tolerations for exporter pod assignment.
  ##
  tolerations: []
  ## @param metrics.affinity Affinity for exporter pod assignment.
  ##
  affinity: {}
  ## @param metrics.priorityClassName Priority class name for the exporter pod.
  ##
  priorityClassName: ""
  ## Exporter Service (chart-rendered as `<fullname>-metrics`, separate from
  ## the main FreeRADIUS Service). Port number is sourced from the top-level
  ## `service.ports.metrics` / `service.nodePorts.metrics` so the chart has a
  ## single ports inventory; this block only carries the Service-type knobs.
  ##
  service:
    ## @param metrics.service.type Kubernetes service type for the exporter.
    ##
    type: ClusterIP
    ## @param metrics.service.clusterIP Explicit clusterIP for the exporter Service.
    ##
    clusterIP: ""
    ## @param metrics.service.loadBalancerIP `loadBalancerIP` when `type` is `LoadBalancer`.
    ##
    loadBalancerIP: ""
    ## @param metrics.service.loadBalancerSourceRanges Allowed CIDRs when `type` is `LoadBalancer`.
    ##
    loadBalancerSourceRanges: []
    ## @param metrics.service.annotations Extra annotations merged into the exporter Service. Use this for Prometheus scrape annotations on clusters not running the Prometheus Operator.
    ##
    annotations: {}
  ## ServiceMonitor (Prometheus Operator) configuration.
  ##
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled Create a ServiceMonitor resource for the Prometheus Operator
    ##
    enabled: false
    ## @param metrics.serviceMonitor.namespace Namespace in which to create the ServiceMonitor (defaults to the release namespace)
    ##
    namespace: ""
    ## @param metrics.serviceMonitor.jobLabel The label on the target Service used by Prometheus as the job name
    ##
    jobLabel: ""
    ## @param metrics.serviceMonitor.port Service port the ServiceMonitor scrapes
    ##
    port: metrics
    ## @param metrics.serviceMonitor.endpoints [array] Endpoint configuration of the ServiceMonitor. Path is mandatory.
    ##
    endpoints:
      - path: /metrics
    ## @param metrics.serviceMonitor.path HTTP path the exporter exposes
    ##
    path: /metrics
    ## @param metrics.serviceMonitor.interval Scrape interval
    ##
    interval: ""
    ## @param metrics.serviceMonitor.scrapeTimeout Per-scrape timeout
    ##
    scrapeTimeout: ""
    ## @param metrics.serviceMonitor.honorLabels Honor labels coming from the scraped target
    ##
    honorLabels: false
    ## @param metrics.serviceMonitor.labels Extra labels for the ServiceMonitor resource
    ##
    labels: {}
    ## @param metrics.serviceMonitor.annotations Extra annotations for the ServiceMonitor resource
    ##
    annotations: {}
    ## @param metrics.serviceMonitor.selector Selector to filter which Services this ServiceMonitor matches (merged with chart defaults)
    ##
    selector: {}
    ## @param metrics.serviceMonitor.relabelings RelabelConfigs to apply before scraping
    ##
    relabelings: []
    ## @param metrics.serviceMonitor.metricRelabelings MetricRelabelConfigs to apply on collected samples
    ##
    metricRelabelings: []
    ## @param metrics.serviceMonitor.tlsConfig TLS configuration for the scrape endpoint
    ##
    tlsConfig: {}
  ## Prometheus Operator PrometheusRule configuration. The default rule set
  ## targets `bvantagelimited/freeradius_exporter` metric names — the most
  ## common FreeRADIUS exporter (`freeradius_up`, `freeradius_total_*`,
  ## `freeradius_queue_use_percentage`). Override `rules` (or set it to `[]`)
  ## when running a different exporter.
  ##
  prometheusRule:
    ## @param metrics.prometheusRule.enabled If `true`, creates a Prometheus Operator PrometheusRule (also requires `metrics.enabled`, and makes little sense without `metrics.serviceMonitor.enabled`).
    ##
    enabled: false
    ## @param metrics.prometheusRule.namespace Namespace in which to create the PrometheusRule. Defaults to the release namespace; set this when your Prometheus instance's `ruleNamespaceSelector` only watches a specific namespace.
    ##
    namespace: ""
    ## @param metrics.prometheusRule.additionalLabels Extra labels merged onto the PrometheusRule resource so the Prometheus Operator's `ruleSelector` picks it up. Defaults to the kube-prometheus-stack selector labels (`app: prometheus-operator` / `release: prometheus`) — adjust to match your operator install.
    ##
    additionalLabels:
      app: prometheus-operator
      release: prometheus
    ## @param metrics.prometheusRule.groups Verbatim `spec.groups` list passthrough. When non-empty, these groups are rendered alongside the chart's default group built from `rules` (the two are additive, not mutually exclusive). Use this when you need multiple groups with different `interval` / `partial_response_strategy` settings instead of the flat-`rules` shape.
    ##
    groups: []
    ## @param metrics.prometheusRule.rules PrometheusRule alert/recording rules rendered under a single group named after the chart fullname. The list is evaluated as a template, so `{{ include "st-common.names.fullname" . }}` and `{{ `{{` }} $labels.instance {{ `}}` }}`-style placeholders work. The default set targets `bvantagelimited/freeradius_exporter` metric names — override or set to `[]` on other exporters.
    ##
    rules:
      - alert: FreeRADIUSDown
        expr: up{job=~".*{{ include "st-common.names.fullname" . }}.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: FreeRADIUS instance is down
          description: |
            The FreeRADIUS metrics endpoint on {{ `{{` }} $labels.instance {{ `}}` }} has been unreachable for the last 5 minutes.
            AAA traffic is likely affected — verify the pod is running and the exporter sidecar is healthy.
      - alert: FreeRADIUSAbsent
        expr: absent(up{job=~".*{{ include "st-common.names.fullname" . }}.*"} == 1)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: FreeRADIUS scrape target has disappeared
          description: |
            Prometheus has not seen any scrape target matching the FreeRADIUS Service for 10 minutes.
            Check the ServiceMonitor selector, the metrics Service, and that the exporter sidecar is listening on `containerPorts.metrics`.
      - alert: FreeRADIUSAuthRejectRateHigh
        ## Metric source: bvantagelimited/freeradius_exporter
        expr: |
          sum by (instance) (rate(freeradius_total_responses_access_reject[5m]))
            /
          clamp_min(sum by (instance) (rate(freeradius_total_requests[5m])), 1)
            > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: FreeRADIUS Access-Reject rate above 50%
          description: |
            More than half of the authentication requests on {{ `{{` }} $labels.instance {{ `}}` }} have been rejected over the last 5 minutes.
            Investigate `clients.conf`, user credentials, or backend SQL/LDAP availability.
      - alert: FreeRADIUSAuthRequestsDropped
        ## Metric source: bvantagelimited/freeradius_exporter
        expr: rate(freeradius_total_auth_responses_dropped_requests[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: FreeRADIUS is dropping authentication requests
          description: |
            FreeRADIUS on {{ `{{` }} $labels.instance {{ `}}` }} has been dropping auth requests for the last 5 minutes — the server is overloaded or the worker queue is saturated.
            Consider raising the replica count (or HPA bounds) and tuning thread/worker counts in `radiusd.conf`.
      - alert: FreeRADIUSQueueSaturated
        ## Metric source: bvantagelimited/freeradius_exporter
        expr: freeradius_queue_use_percentage > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: FreeRADIUS internal queue >80% utilised
          description: |
            The FreeRADIUS worker queue on {{ `{{` }} $labels.instance {{ `}}` }} has been above 80% utilisation for 5 minutes — requests are queueing up.
            Capacity is close to exhaustion; scale out or tune the thread pool before drops start.


## =============================================================================
## @section Traffic Exposure parameters
## -----------------------------------------------------------------------------
## How traffic reaches FreeRADIUS from outside the pod: the Service (UDP
## auth/acct/coa/status + TCP RADSEC) and optional Pod Disruption Budget. The
## Gateway API / Istio integration lives further down. There is intentionally
## no `ingress:` block — RADIUS is not HTTP and Ingress controllers cannot
## carry UDP traffic.
## =============================================================================

## FreeRADIUS service parameters
##
service:
  ## @param service.type FreeRADIUS Kubernetes service type
  ##
  type: ClusterIP
  ## @param service.ports.auth FreeRADIUS Authentication service port (UDP)
  ## @param service.ports.acct FreeRADIUS Accounting service port (UDP)
  ## @param service.ports.coa FreeRADIUS CoA service port (UDP)
  ## @param service.ports.radsec FreeRADIUS RADSEC service port (TCP, TLS)
  ## @param service.ports.status FreeRADIUS Status service port (UDP). Only published when the metrics exporter Deployment needs to reach it (`metrics.enabled: true`); restrict external access via NetworkPolicy.
  ## @param service.ports.metrics Prometheus exporter service port (TCP). Published on the standalone exporter Service (`<fullname>-metrics`), NOT the main FreeRADIUS Service.
  ##
  ports:
    auth: 1812
    acct: 1813
    coa: 3799
    radsec: 2083
    status: 18121
    metrics: 9812
  ## @param service.nodePorts.auth NodePort for the Auth port (LoadBalancer / NodePort types only)
  ## @param service.nodePorts.acct NodePort for the Accounting port
  ## @param service.nodePorts.coa NodePort for the CoA port
  ## @param service.nodePorts.radsec NodePort for the RADSEC port
  ## @param service.nodePorts.status NodePort for the Status port (rarely needed — exporter reaches the status site through the in-cluster Service)
  ## @param service.nodePorts.metrics NodePort for the exporter Service (when `metrics.service.type` is `NodePort` or `LoadBalancer`)
  ##
  nodePorts:
    auth: ""
    acct: ""
