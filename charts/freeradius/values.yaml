sidecars: []


## =============================================================================
## @section Persistence parameters
## -----------------------------------------------------------------------------
## PersistentVolumeClaim consumed by `templates/PersistentVolumeClaim.yaml` and
## auto-mounted into the FreeRADIUS container at `persistence.mountPath`.
## When disabled, the chart falls back to an `emptyDir`. The FreeRADIUS image
## runs as UID/GID 101 — make sure the volume is writable by that user
## (or enable `volumePermissions.enabled` to chown it via an init container).
## =============================================================================

## @param persistence.enabled Render a PersistentVolumeClaim AND mount it into the FreeRADIUS container at `persistence.mountPath`.
## @param persistence.existingClaim Name of an externally-managed PVC to reference instead of creating one.
## @param persistence.storageClass StorageClass for the PVC. Defaults to `global.storageClass` when both are empty. Set to `-` to disable dynamic provisioning.
## @param persistence.accessModes List of access modes requested on the PVC.
## @param persistence.size Storage capacity requested on the PVC.
## @param persistence.mountPath Path inside the FreeRADIUS container where the PVC is mounted. Defaults match the upstream image's data path.
## @param persistence.subPath Sub-path within the volume mounted at `mountPath`.
## @param persistence.annotations Extra annotations applied to the PVC. Merged with `commonAnnotations`.
## @param persistence.selector Label selector for binding to a specific pre-provisioned PV.
## @param persistence.dataSource Source the PVC clones from (Snapshot or another PVC).
##
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  mountPath: /startechnica/freeradius
  subPath: ""
  annotations: {}
  selector: {}
  dataSource: {}

## `volumePermissions` init container — runs as root to chown the PVC mount
## point to `containerSecurityContext.runAsUser:podSecurityContext.fsGroup`.
## Only needed when the storage class doesn't honor `fsGroup` or you're
## bringing a pre-existing volume.
##
volumePermissions:
  ## @param volumePermissions.enabled Enable the init container that chowns the PV mount point
  ##
  enabled: false
  ## @param volumePermissions.image.registry Image registry for the init container
  ## @param volumePermissions.image.repository Image repository
  ## @param volumePermissions.image.tag Image tag
  ## @param volumePermissions.image.pullPolicy Image pull policy
  ## @param volumePermissions.image.pullSecrets Image pull secrets
  ##
  image:
    registry: public.ecr.aws
    repository: bitnami/os-shell
    tag: "12"
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
  ## @param volumePermissions.resources.limits Resource limits for the init container
  ## @param volumePermissions.resources.requests Requested resources for the init container
  ##
  resources:
    limits: {}
    requests: {}
  ## @param volumePermissions.securityContext.runAsUser UID for the init container. Use `0` (root) so chown actually works; or `auto` for OpenShift's dynamic SCC.
  ##
  securityContext:
    runAsUser: 0


## =============================================================================
## @section Metrics parameters
## -----------------------------------------------------------------------------
## Standalone `bvantagelimited/freeradius_exporter` Deployment. When
## `metrics.enabled: true` the chart renders the exporter as a **separate
## Deployment** (`templates/metrics/Deployment.yaml`) — NOT a sidecar on the
## FreeRADIUS pod. The exporter pod talks to the FreeRADIUS `status` virtual
## server over the in-cluster Service, then exposes Prometheus metrics on
## its own Service (`<release>-freeradius-metrics`) at `service.ports.metrics`.
##
## **Requires `sites.status.enabled: true`** AND `status` reachable on
## the Service (the chart's defaults handle both: `sites.status.listen`
## defaults to `0.0.0.0` and `service.ports.status` is auto-published).
##
## ServiceMonitor / PrometheusRule are only rendered when both `metrics.enabled`
## and the matching sub-block flag are true (and the Prometheus Operator CRDs
## are present). Manifests live under `templates/metrics/`.
## =============================================================================

metrics:
  ## @param metrics.enabled Render the standalone `bvantagelimited/freeradius_exporter` Deployment and Service. Requires `sites.status.enabled: true`.
  ##
  enabled: false
  ## @param metrics.replicaCount Number of exporter pods.
  ##
  replicaCount: 1
  ## FreeRADIUS Prometheus exporter image.
  ## ref: https://github.com/bvantagelimited/freeradius_exporter
  ##
  ## @param metrics.image.registry FreeRADIUS exporter image registry
  ## @param metrics.image.repository FreeRADIUS exporter image repository
  ## @param metrics.image.tag FreeRADIUS exporter image tag
  ## @param metrics.image.digest FreeRADIUS exporter image digest (overrides `tag` when set)
  ## @param metrics.image.pullPolicy FreeRADIUS exporter image pull policy
  ## @param metrics.image.pullSecrets FreeRADIUS exporter image pull secrets
  ##
  image:
    registry: ghcr.io
    repository: bvantagelimited/freeradius_exporter
    tag: "1.4.4"
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
  ## @param metrics.extraArgs Extra command-line flags passed to the exporter (e.g. `--freeradius.timeout=5s`, `--log.level=debug`).
  ##
  extraArgs: []
  ## @param metrics.extraEnvVars Extra environment variables for the exporter container. Use this for `RADIUS_*` overrides that aren't covered by the defaults below.
  ## E.g.
  ## extraEnvVars:
  ##   - name: RADIUS_USERNAME
  ##     value: monitor
  ##
  extraEnvVars: []
  ## @param metrics.resources Set container requests and limits for the exporter container.
  ##
  resources:
    limits: {}
    requests: {}
  ## Exporter container security context. Defaults to the PSS "restricted"
  ## profile — the bvantagelimited image is a static Go binary and works fine
  ## with `readOnlyRootFilesystem: true` and dropping all capabilities.
  ##
  ## @param metrics.containerSecurityContext.enabled Apply the security context to the exporter container.
  ## @param metrics.containerSecurityContext.runAsUser UID for the exporter container.
  ## @param metrics.containerSecurityContext.runAsNonRoot Reject containers that try to run as root.
  ## @param metrics.containerSecurityContext.allowPrivilegeEscalation Block child processes from gaining more privileges than the parent.
  ## @param metrics.containerSecurityContext.readOnlyRootFilesystem Mount the container's root filesystem as read-only.
  ## @param metrics.containerSecurityContext.capabilities Linux capabilities to add/drop on the exporter container.
  ## @param metrics.containerSecurityContext.seccompProfile Seccomp profile applied to the exporter container.
  ##
  containerSecurityContext:
    enabled: true
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions: {}
  ## Exporter probes (HTTP GET against the `/metrics` endpoint).
  ##
  ## @param metrics.livenessProbe.enabled Enable livenessProbe on the exporter container.
  ## @param metrics.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe.
  ## @param metrics.livenessProbe.periodSeconds Period seconds for livenessProbe.
  ## @param metrics.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe.
  ## @param metrics.livenessProbe.failureThreshold Failure threshold for livenessProbe.
  ## @param metrics.livenessProbe.successThreshold Success threshold for livenessProbe.
  ##
  livenessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  ## @param metrics.readinessProbe.enabled Enable readinessProbe on the exporter container.
  ## @param metrics.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe.
  ## @param metrics.readinessProbe.periodSeconds Period seconds for readinessProbe.
  ## @param metrics.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe.
  ## @param metrics.readinessProbe.failureThreshold Failure threshold for readinessProbe.
  ## @param metrics.readinessProbe.successThreshold Success threshold for readinessProbe.
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  ## @param metrics.customLivenessProbe Verbatim override of the exporter livenessProbe.
  ##
  customLivenessProbe: {}
  ## @param metrics.customReadinessProbe Verbatim override of the exporter readinessProbe.
  ##
  customReadinessProbe: {}
  ## @param metrics.podAnnotations Annotations applied to the exporter pod.
  ##
  podAnnotations: {}
  ## @param metrics.podLabels Extra labels applied to the exporter pod.
  ##
  podLabels: {}
  ## @param metrics.nodeSelector Node labels for exporter pod assignment.
  ##
  nodeSelector: {}
  ## @param metrics.tolerations Tolerations for exporter pod assignment.
  ##
  tolerations: []
  ## @param metrics.affinity Affinity for exporter pod assignment.
  ##
  affinity: {}
  ## @param metrics.priorityClassName Priority class name for the exporter pod.
  ##
  priorityClassName: ""
  ## Exporter Service (chart-rendered as `<fullname>-metrics`, separate from
  ## the main FreeRADIUS Service). Port number is sourced from the top-level
  ## `service.ports.metrics` / `service.nodePorts.metrics` so the chart has a
  ## single ports inventory; this block only carries the Service-type knobs.
  ##
  service:
    ## @param metrics.service.type Kubernetes service type for the exporter.
    ##
    type: ClusterIP
    ## @param metrics.service.clusterIP Explicit clusterIP for the exporter Service.
    ##
    clusterIP: ""
    ## @param metrics.service.loadBalancerIP `loadBalancerIP` when `type` is `LoadBalancer`.
    ##
    loadBalancerIP: ""
    ## @param metrics.service.loadBalancerSourceRanges Allowed CIDRs when `type` is `LoadBalancer`.
    ##
    loadBalancerSourceRanges: []
    ## @param metrics.service.annotations Extra annotations merged into the exporter Service. Use this for Prometheus scrape annotations on clusters not running the Prometheus Operator.
    ##
    annotations: {}
  ## ServiceMonitor (Prometheus Operator) configuration.
  ##
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled Create a ServiceMonitor resource for the Prometheus Operator
    ##
    enabled: false
    ## @param metrics.serviceMonitor.namespace Namespace in which to create the ServiceMonitor (defaults to the release namespace)
    ##
    namespace: ""
    ## @param metrics.serviceMonitor.jobLabel The label on the target Service used by Prometheus as the job name
    ##
    jobLabel: ""
    ## @param metrics.serviceMonitor.port Service port the ServiceMonitor scrapes
    ##
    port: metrics
    ## @param metrics.serviceMonitor.endpoints [array] Endpoint configuration of the ServiceMonitor. Path is mandatory.
    ##
    endpoints:
      - path: /metrics
    ## @param metrics.serviceMonitor.path HTTP path the exporter exposes
    ##
    path: /metrics
    ## @param metrics.serviceMonitor.interval Scrape interval
    ##
    interval: ""
    ## @param metrics.serviceMonitor.scrapeTimeout Per-scrape timeout
    ##
    scrapeTimeout: ""
    ## @param metrics.serviceMonitor.honorLabels Honor labels coming from the scraped target
    ##
    honorLabels: false
    ## @param metrics.serviceMonitor.labels Extra labels for the ServiceMonitor resource
    ##
    labels: {}
    ## @param metrics.serviceMonitor.annotations Extra annotations for the ServiceMonitor resource
    ##
    annotations: {}
    ## @param metrics.serviceMonitor.selector Selector to filter which Services this ServiceMonitor matches (merged with chart defaults)
    ##
    selector: {}
    ## @param metrics.serviceMonitor.relabelings RelabelConfigs to apply before scraping
    ##
    relabelings: []
    ## @param metrics.serviceMonitor.metricRelabelings MetricRelabelConfigs to apply on collected samples
    ##
    metricRelabelings: []
    ## @param metrics.serviceMonitor.tlsConfig TLS configuration for the scrape endpoint
    ##
    tlsConfig: {}
  ## Prometheus Operator PrometheusRule configuration. The default rule set
  ## targets `bvantagelimited/freeradius_exporter` metric names — the most
  ## common FreeRADIUS exporter (`freeradius_up`, `freeradius_total_*`,
  ## `freeradius_queue_use_percentage`). Override `rules` (or set it to `[]`)
  ## when running a different exporter.
  ##
  prometheusRule:
    ## @param metrics.prometheusRule.enabled If `true`, creates a Prometheus Operator PrometheusRule (also requires `metrics.enabled`, and makes little sense without `metrics.serviceMonitor.enabled`).
    ##
    enabled: false
    ## @param metrics.prometheusRule.namespace Namespace in which to create the PrometheusRule. Defaults to the release namespace; set this when your Prometheus instance's `ruleNamespaceSelector` only watches a specific namespace.
    ##
    namespace: ""
    ## @param metrics.prometheusRule.additionalLabels Extra labels merged onto the PrometheusRule resource so the Prometheus Operator's `ruleSelector` picks it up. Defaults to the kube-prometheus-stack selector labels (`app: prometheus-operator` / `release: prometheus`) — adjust to match your operator install.
    ##
    additionalLabels:
      app: prometheus-operator
      release: prometheus
    ## @param metrics.prometheusRule.groups Verbatim `spec.groups` list passthrough. When non-empty, these groups are rendered alongside the chart's default group built from `rules` (the two are additive, not mutually exclusive). Use this when you need multiple groups with different `interval` / `partial_response_strategy` settings instead of the flat-`rules` shape.
    ##
    groups: []
    ## @param metrics.prometheusRule.rules PrometheusRule alert/recording rules rendered under a single group named after the chart fullname. The list is evaluated as a template, so `{{ include "st-common.names.fullname" . }}` and `{{ `{{` }} $labels.instance {{ `}}` }}`-style placeholders work. The default set targets `bvantagelimited/freeradius_exporter` metric names — override or set to `[]` on other exporters.
    ##
    rules:
      - alert: FreeRADIUSDown
        expr: up{job=~".*{{ include "st-common.names.fullname" . }}.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: FreeRADIUS instance is down
          description: |
            The FreeRADIUS metrics endpoint on {{ `{{` }} $labels.instance {{ `}}` }} has been unreachable for the last 5 minutes.
            AAA traffic is likely affected — verify the pod is running and the exporter sidecar is healthy.
      - alert: FreeRADIUSAbsent
        expr: absent(up{job=~".*{{ include "st-common.names.fullname" . }}.*"} == 1)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: FreeRADIUS scrape target has disappeared
          description: |
            Prometheus has not seen any scrape target matching the FreeRADIUS Service for 10 minutes.
            Check the ServiceMonitor selector, the metrics Service, and that the exporter sidecar is listening on `containerPorts.metrics`.
      - alert: FreeRADIUSAuthRejectRateHigh
        ## Metric source: bvantagelimited/freeradius_exporter
        expr: |
          sum by (instance) (rate(freeradius_total_responses_access_reject[5m]))
            /
          clamp_min(sum by (instance) (rate(freeradius_total_requests[5m])), 1)
            > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: FreeRADIUS Access-Reject rate above 50%
          description: |
            More than half of the authentication requests on {{ `{{` }} $labels.instance {{ `}}` }} have been rejected over the last 5 minutes.
            Investigate `clients.conf`, user credentials, or backend SQL/LDAP availability.
      - alert: FreeRADIUSAuthRequestsDropped
        ## Metric source: bvantagelimited/freeradius_exporter
        expr: rate(freeradius_total_auth_responses_dropped_requests[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: FreeRADIUS is dropping authentication requests
          description: |
            FreeRADIUS on {{ `{{` }} $labels.instance {{ `}}` }} has been dropping auth requests for the last 5 minutes — the server is overloaded or the worker queue is saturated.
            Consider raising the replica count (or HPA bounds) and tuning thread/worker counts in `radiusd.conf`.
      - alert: FreeRADIUSQueueSaturated
        ## Metric source: bvantagelimited/freeradius_exporter
        expr: freeradius_queue_use_percentage > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: FreeRADIUS internal queue >80% utilised
          description: |
            The FreeRADIUS worker queue on {{ `{{` }} $labels.instance {{ `}}` }} has been above 80% utilisation for 5 minutes — requests are queueing up.
            Capacity is close to exhaustion; scale out or tune the thread pool before drops start.


## =============================================================================
## @section Traffic Exposure parameters
## -----------------------------------------------------------------------------
## How traffic reaches FreeRADIUS from outside the pod: the Service (UDP
## auth/acct/coa/status + TCP RADSEC) and optional Pod Disruption Budget. The
## Gateway API / Istio integration lives further down. There is intentionally
## no `ingress:` block — RADIUS is not HTTP and Ingress controllers cannot
## carry UDP traffic.
## =============================================================================

## FreeRADIUS service parameters
##
service:
  ## @param service.type FreeRADIUS Kubernetes service type
  ##
  type: ClusterIP
  ## @param service.ports.auth FreeRADIUS Authentication service port (UDP)
  ## @param service.ports.acct FreeRADIUS Accounting service port (UDP)
  ## @param service.ports.coa FreeRADIUS CoA service port (UDP)
  ## @param service.ports.radsec FreeRADIUS RADSEC service port (TCP, TLS)
  ## @param service.ports.status FreeRADIUS Status service port (UDP). Only published when the metrics exporter Deployment needs to reach it (`metrics.enabled: true`); restrict external access via NetworkPolicy.
  ## @param service.ports.metrics Prometheus exporter service port (TCP). Published on the standalone exporter Service (`<fullname>-metrics`), NOT the main FreeRADIUS Service.
  ##
  ports:
    auth: 1812
    acct: 1813
    coa: 3799
    radsec: 2083
    status: 18121
    metrics: 9812
  ## @param service.nodePorts.auth NodePort for the Auth port (LoadBalancer / NodePort types only)
  ## @param service.nodePorts.acct NodePort for the Accounting port
  ## @param service.nodePorts.coa NodePort for the CoA port
  ## @param service.nodePorts.radsec NodePort for the RADSEC port
  ## @param service.nodePorts.status NodePort for the Status port (rarely needed — exporter reaches the status site through the in-cluster Service)
  ## @param service.nodePorts.metrics NodePort for the exporter Service (when `metrics.service.type` is `NodePort` or `LoadBalancer`)
  ##
  nodePorts:
    auth: ""
    acct: ""
    coa: ""
    radsec: ""
    status: ""
    metrics: ""
  ## @param service.clusterIP FreeRADIUS Kubernetes service clusterIP IP
  ##
  clusterIP: ""
  ## @param service.loadBalancerIP FreeRADIUS loadBalancerIP if service type is `LoadBalancer`
  ##
  loadBalancerIP: ""
  ## @param service.ipFamilyPolicy FreeRADIUS Kubernetes service ipFamilyPolicy policy
  ##
  ipFamilyPolicy: SingleStack
  ## @param service.externalTrafficPolicy Enable client source IP preservation
  ##
  externalTrafficPolicy: Cluster
  ## @param service.allocateLoadBalancerNodePorts Allow users to disable node ports for Service Type=LoadBalancer.
  ##
  allocateLoadBalancerNodePorts: "false"
  ## @param service.loadBalancerClass Enables to use a load balancer implementation other than the cloud provider default.
  ##
  loadBalancerClass: ""
  ## @param service.loadBalancerSourceRanges Addresses allowed when FreeRADIUS service is `LoadBalancer`
  ##
  loadBalancerSourceRanges: []
  ## @param service.extraPorts Extra ports to expose (normally used with the `sidecars` value)
  ##
  extraPorts: []
  ## @param service.annotations Additional Service annotations
  ##
  annotations: {}
  ## @param service.sessionAffinity Session Affinity for Kubernetes service, can be "None" or "ClientIP"
  ##
  sessionAffinity: None
  ## @param service.sessionAffinityConfig Additional settings for the sessionAffinity
  ##
  sessionAffinityConfig: {}

## Pod disruption budget configuration
##
podDisruptionBudget:
  ## @param podDisruptionBudget.create Specifies whether a Pod disruption budget should be created
  ##
  create: false
  ## @param podDisruptionBudget.minAvailable Minimum number / percentage of pods that should remain scheduled
  ##
  minAvailable: 1
  ## @param podDisruptionBudget.maxUnavailable Maximum number / percentage of pods that may be made unavailable
  ##
  maxUnavailable: ""


## =============================================================================
## @section TLS configuration
## -----------------------------------------------------------------------------
## In-pod TLS for the RADSEC server. Independent of `modules.sql.tls.*`
## (which is TLS for the SQL backend connection) and of `gateway.tls.*` (which
## terminates at the Gateway). Setting `tls.enabled: true` here enables the
## RADSEC port on the container/Service AND mounts the leaf certificate so
## FreeRADIUS itself serves RADSEC.
##
## Cert-manager-driven issuance is configured under `tls.certManager.*` — a
## single canonical location consumed by both the in-pod RADSEC `Certificate`
## and the gateway-namespace `Certificate` (when `gateway.tls.enabled`).
## =============================================================================

tls:
  ## @param tls.enabled Enable RADSEC (TLS over TCP RADIUS). Opens `containerPorts.radsec` / `service.ports.radsec` on the pod and the Service, mounts the leaf cert via `templates/secret/tls.yaml`, and (when `gateway.enabled`) wires the istio/gateway-api TLS-passthrough listener.
  ##
  enabled: false
  ## @param tls.autoGenerated Render `templates/secret/tls.yaml` with a chart-generated self-signed leaf certificate. Skipped when `certificatesSecret`, `existingSecretName`, or `tls.certManager.create` are set.
  ##
  autoGenerated: false
  ## @param tls.certificatesMountPath Path inside the container where the RADSEC TLS material is mounted
  ##
  certificatesMountPath: /opt/startechnica/freeradius/certs
  ## @param tls.certificatesSecret Name of an existing Secret holding `tls.crt`/`tls.key`/`ca.crt` for RADSEC. Overrides chart-managed Secret rendering.
  ##
  certificatesSecret: ""
  ## @param tls.certFilename Filename of the leaf certificate inside the mounted Secret (defaults to `tls.crt`)
  ##
  certFilename: ""
  ## @param tls.certKeyFilename Filename of the leaf key inside the mounted Secret (defaults to `tls.key`)
  ##
  certKeyFilename: ""
  ## @param tls.certCAFilename Filename of the CA certificate inside the mounted Secret (defaults to `ca.crt`)
  ##
  certCAFilename: ""
  ## @param tls.existingSecretName [DEPRECATED — use `tls.certificatesSecret`] Legacy alias retained for backwards compatibility. Slated for removal in the next major bump.
  ##
  existingSecretName: ""
  ## Cert-manager driven TLS certificate issuance. Single canonical location
  ## consumed by `templates/Certificate.yaml` for both the in-pod RADSEC
  ## certificate (release-namespace block) and the gateway-namespace cert
  ## (when `gateway.enabled && gateway.tls.enabled`).
  ##
  certManager:
    ## @param tls.certManager.create Render cert-manager `Certificate` resources for any TLS-enabled exposure (RADSEC and/or gateway).
    ##
    create: false
    ## @param tls.certManager.issuerRef Reference to the cert-manager Issuer / ClusterIssuer that signs the certificate(s).
    ##
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: selfsigned-issuer


## =============================================================================
## @section RBAC parameters
## -----------------------------------------------------------------------------
## ServiceAccount and Role/RoleBinding generation for the FreeRADIUS pod, plus
## the NetworkPolicy controlling who can reach the auth/acct/coa/radsec ports.
## =============================================================================

## ServiceAccount used by the FreeRADIUS pod
##
serviceAccount:
  ## @param serviceAccount.create Enable the creation of a ServiceAccount for FreeRADIUS pods
  ##
  create: true
  ## @param serviceAccount.name Name of the created ServiceAccount
  ##
  name: ""
  ## @param serviceAccount.automountServiceAccountToken Auto-mount the service account token in the pod
  ##
  automountServiceAccountToken: false
  ## @param serviceAccount.annotations Additional custom annotations for the ServiceAccount
  ##
  annotations: {}

## Role / RoleBinding for the FreeRADIUS ServiceAccount. Off by default — the
## upstream image doesn't need to read cluster state, but some sidecars do.
##
rbac:
  ## @param rbac.create Specify whether Role / RoleBinding resources should be created and used
  ##
  create: false
  ## @param rbac.rules Custom RBAC rules (when empty the chart uses a minimal `get/list/watch` on secrets+configmaps)
  ##
  rules: []

## Network Policy. RADIUS is UDP-heavy, so a strict policy is recommended in
## multi-tenant clusters. The chart auto-opens UDP auth/acct (always) and
## conditionally opens UDP coa, UDP status, TCP RADSEC, and TCP metrics based
## on the matching feature flags.
##
networkPolicy:
  ## @param networkPolicy.enabled Render a NetworkPolicy
  ##
  enabled: true
  ## @param networkPolicy.allowExternal When true, allow connections from any source. When false, restrict ingress to pods with the chart's `<fullname>-client: "true"` label and to other FreeRADIUS replicas.
  ##
  allowExternal: true
  ## @param networkPolicy.allowExternalEgress Allow the pod to access any range of port and all destinations.
  ##
  allowExternalEgress: true
  ## @param networkPolicy.extraIngress Add extra ingress rules to the NetworkPolicy
  ##
  extraIngress: []
  ## @param networkPolicy.extraEgress Add extra egress rules to the NetworkPolicy
  ##
  extraEgress: []
  ## @param networkPolicy.ingressNSMatchLabels Labels to match to allow traffic from other namespaces
  ## @param networkPolicy.ingressNSPodMatchLabels Pod labels to match to allow traffic from other namespaces
  ##
  ingressNSMatchLabels: {}
  ingressNSPodMatchLabels: {}
  ## @param networkPolicy.additionalRules Additional NetworkPolicy rules (note: all rules are OR-ed)
  ##
  additionalRules: {}


## =============================================================================
## @section Gateway API parameters
## -----------------------------------------------------------------------------
## Optional Gateway integration. When `gateway.enabled` is true the chart
## renders one of two stacks based on `gateway.implementation`:
##   - "gateway-api" → Kubernetes Gateway API (Gateway + UDPRoute + TLSRoute + ReferenceGrant)
##   - "istio"       → Istio CRDs (networking.istio.io Gateway + VirtualService)
##
## RADIUS traffic shapes that map onto Gateway listeners:
##   - UDP auth (1812) / acct (1813) / coa (3799) → UDPRoute (gateway-api),
##     UDP listener (istio Gateway). UDPRoute support varies by implementation
##     (Cilium / Envoy Gateway support it; Istio currently does not — use the
##     istio path for RADIUS UDP if you're running Istio).
##   - TCP RADSEC (2083, TLS) → TLSRoute passthrough (gateway-api) or
##     `protocol: TLS, mode: PASSTHROUGH` listener (istio Gateway).
## =============================================================================

gateway:
  ## @param gateway.enabled Enable the creation of Gateway resources to manage incoming traffic to FreeRADIUS.
  ##
  enabled: false
  ## @param gateway.implementation Gateway implementation to render. Allowed values: `gateway-api` or `istio`.
  ##
  implementation: gateway-api

  ## ---- Gateway resource -----------------------------------------------------
  ## Configuration for the Gateway resource itself (created here, or referenced
  ## externally via `existingGateway`).
  ##
  gateway:
    ## @param gateway.gateway.create Create a Gateway API Gateway resource. When false the chart expects an existing Gateway to be referenced via `existingGateway` or per-route `parentRefs`.
    ##
    create: false
    ## @param gateway.gateway.name Name of the Gateway resource to create. Defaults to the chart fullname.
    ##
    name: ""
    ## @param gateway.gateway.namespace Namespace for the Gateway resource. Defaults to the release namespace.
    ##
    namespace: ""
  ## @param gateway.clusterDomain Cluster domain used by the VirtualService backend FQDN. Falls back to the top-level `clusterDomain` when empty.
  ##
  clusterDomain: ""
  ## @param gateway.serviceAccountName Service Account name attached to the Gateway data-plane workload (Istio Ambient / gateway-api implementations that respect it)
  ##
  serviceAccountName: ""
  ## @param gateway.selector Gateway instance selector labels (Istio)
  ##
  selector: {}
  ## @param gateway.gatewayClassName Cluster-scoped GatewayClass that backs the Gateway (gateway-api implementations)
  ##
  gatewayClassName: istio
  ## @param gateway.listeners Verbatim `listeners:` list rendered on the chart's Gateway. When non-empty, the chart skips its default UDP auth/acct/coa + TLS-passthrough listener generation.
  ##
  listeners: []
  ## @param gateway.existingGateway Name of an existing Gateway resource to attach the chart's routes to (skips Gateway rendering).
  ##
  existingGateway: ~
  ## @param gateway.hostnames Hostnames (or SNI names for RADSEC) the chart's routes / listeners should match. The first entry seeds the cert-manager `Certificate` for the gateway-namespace cert. Empty means "match all" where the API allows it.
  ##
  hostnames: []

  ## ---- TLS ------------------------------------------------------------------
  ## TLS configuration applied to the default Gateway listener generation and
  ## to the chart-managed TLS Secret rendered by `templates/secret/gateway-tls.yaml`.
  ## The certificate Secret name is computed by the `freeradius.gateway.tlsSecretName`
  ## helper — single source of truth shared by both Gateway templates and the
  ## gateway-tls Secret, so listener and secret can never drift apart.
  ##
  tls:
    ## @param gateway.tls.enabled Render a TLS listener on the default Gateway (Istio: `protocol: TLS, mode: PASSTHROUGH`; gateway-api: TLS passthrough via TLSRoute). Has no effect when `gateway.listeners` is set. The chart auto-derives whether to terminate vs passthrough based on `tls.enabled` (in-pod RADSEC) — when `tls.enabled` is true the listener is passthrough.
    ##
    enabled: false
    ## @param gateway.tls.existingSecret Name of an externally-managed Kubernetes Secret holding the TLS material the Gateway TLS listener references (only relevant when the listener uses `mode: SIMPLE` / Terminate).
    ##
    existingSecret: ""
    ## @param gateway.tls.selfSigned Generate a self-signed TLS Secret in the gateway's namespace via `templates/secret/gateway-tls.yaml`. Skipped when `gateway.tls.existingSecret`, `gateway.tls.secrets`, or `tls.certManager.create` are set.
    ##
    selfSigned: false
    ## @param gateway.tls.secrets Custom TLS certificates rendered as Secrets in the gateway's namespace. 'name' should match what the Gateway listener references.
    ##
    secrets: []

  ## ---- TLSRoute (RADSEC) ----------------------------------------------------
  ## Routing rules for the RADSEC TLS passthrough listener. Only used when
  ## `implementation: gateway-api` AND `tls.enabled` is true.
  ##
  tlsRoute:
    ## @param gateway.tlsRoute.parentRefs Explicit `parentRefs` override for the TLSRoute. When empty, defaults to the chart-rendered ListenerSet (if any) or the chart's Gateway.
    ##
    parentRefs: []

  ## ---- UDPRoute (auth/acct/coa) --------------------------------------------
  ## Routing rules for the UDP RADIUS listeners. Only used when
  ## `implementation: gateway-api` AND the cluster's GatewayClass supports
  ## UDPRoute (Envoy Gateway / Cilium do; Istio does not — fall back to the
  ## istio path on those clusters).
  ##
  udpRoute:
    ## @param gateway.udpRoute.enabled Render UDPRoute resources for auth/acct (and coa when `sites.coa.enabled`).
    ##
    enabled: true
    ## @param gateway.udpRoute.parentRefs Explicit `parentRefs` override for the UDPRoutes. When empty, defaults to the chart-rendered ListenerSet (if any) or the chart's Gateway.
    ##
    parentRefs: []

  ## ---- VirtualService (istio) ----------------------------------------------
  ## Istio VirtualService passthrough overrides. Only used when
  ## `implementation: istio`. The default VirtualService renders a TLS
  ## passthrough rule for RADSEC when `tls.enabled` is true; this block lets
  ## the user override raw TLS/TCP route lists or bring an existing one.
  ##
  virtualService:
    ## @param gateway.virtualService.existingVirtualService Name of an existing VirtualService to use (skips VirtualService rendering)
    ##
    existingVirtualService: ~
    ## @param gateway.virtualService.tls Verbatim `spec.tls` list passthrough. When non-empty, overrides the chart's auto-derived TLS-passthrough rule.
    ##
    tls: []
    ## @param gateway.virtualService.tcp Verbatim `spec.tcp` list passthrough. Useful for non-TLS TCP routes the chart doesn't render by default.
    ##
    tcp: []

  ## ---- ReferenceGrant ------------------------------------------------------
  ## Cross-namespace permission for the gateway-api routes to point at the
  ## FreeRADIUS Service when the Gateway is in a different namespace.
  ##
  referenceGrant:
    ## @param gateway.referenceGrant.enabled Render a ReferenceGrant allowing routes in `gateway.gateway.namespace` to target the chart's Service.
    ##
    enabled: false
    ## @param gateway.referenceGrant.from Verbatim `spec.from` override
    ##
    from: []
    ## @param gateway.referenceGrant.to Verbatim `spec.to` override
    ##
    to: []

  ## ---- ListenerSet ---------------------------------------------------------
  ## Attach extra listeners to the parent Gateway via a ListenerSet
  ## (`gateway.networking.k8s.io` v1 / x-k8s.io v1alpha1 XListenerSet). When
  ## enabled with non-empty `listeners`, the chart's UDPRoute / TLSRoute
  ## default `parentRefs` switch to this ListenerSet automatically.
  ##
  listenerSet:
    ## @param gateway.listenerSet.enabled Render a ListenerSet
    ##
    enabled: false
    ## @param gateway.listenerSet.parentRef Verbatim `spec.parentRef` override
    ##
    parentRef: {}
    ## @param gateway.listenerSet.listeners `listeners:` list rendered on the ListenerSet
    ##
    listeners: []


## =============================================================================
## @section Database parameters
## -----------------------------------------------------------------------------
## Backend storage for the FreeRADIUS SQL module. Pick exactly one of:
##   - `mariadb.enabled: true`     → bundled Bitnami MariaDB subchart (mysql dialect)
##   - `postgresql.enabled: true`  → bundled Bitnami PostgreSQL subchart (postgresql dialect)
##   - `externalDatabase.host: …`  → external database; dialect is whichever
##                                   `modules.sql.dialect` you set
##   - none of the above + `modules.sql.dialect: sqlite` → file-based, no
##                                   network backend (see `modules.sql.sqlite.*`)
##
## The chart's hard validator (`freeradius.validate.sql.backend`) rejects:
##   - both subcharts enabled at once,
##   - a subchart whose wire protocol doesn't match `modules.sql.dialect`,
##   - `dialect: sqlite` with any subchart enabled,
##   - `dialect: mysql|postgresql` with no subchart AND empty `externalDatabase.host`.
##
## Connection details flow into the SQL module via the chart-managed envvars
## ConfigMap, sourced through the `freeradius.sql.{host,port,name,user,
## secretName,secretKey}` helpers — single source of truth for both the SQL
## module env-vars and the `db-bootstrap` init container.
## =============================================================================

## MariaDB chart configuration. Enable for the mysql dialect.
## ref: https://github.com/bitnami/charts/blob/master/bitnami/mariadb/values.yaml
##
## @param mariadb.enabled Switch to enable or disable the bundled MariaDB subchart. Requires `modules.sql.dialect: mysql`.
## @param mariadb.auth.username Name for a custom user to create
## @param mariadb.auth.password Password for the custom user to create
## @param mariadb.auth.database Name for a custom database to create
## @param mariadb.auth.existingSecret Name of existing secret to use for MariaDB credentials
## @param mariadb.architecture MariaDB architecture (`standalone` or `replication`)
##
mariadb:
  enabled: false
  auth:
    username: freeradius_user
    password: ""
    database: freeradius_db
    existingSecret: ""
  architecture: standalone

## PostgreSQL chart configuration. Enable for the postgresql dialect.
## ref: https://github.com/bitnami/charts/blob/master/bitnami/postgresql/values.yaml
##
## @param postgresql.enabled Switch to enable or disable the bundled PostgreSQL subchart. Requires `modules.sql.dialect: postgresql`.
## @param postgresql.auth.username Name for a custom user to create
## @param postgresql.auth.password Password for the custom user to create
## @param postgresql.auth.database Name for a custom database to create
## @param postgresql.auth.existingSecret Name of existing secret to use for PostgreSQL credentials. Must contain the key referenced by `postgresql.auth.secretKeys.userPasswordKey` (default `password`).
## @param postgresql.architecture PostgreSQL architecture (`standalone` or `replication`)
##
postgresql:
  enabled: false
  auth:
    username: freeradius_user
    password: ""
    database: freeradius_db
    existingSecret: ""
  architecture: standalone

## External Database configuration. Used when neither `mariadb.enabled` nor
## `postgresql.enabled` is true. Dialect-agnostic — the same fields cover both
## mysql and postgresql backends; the wire protocol is selected by
## `modules.sql.dialect`.
##
## @param externalDatabase.host Database host. Empty means "no external database" (combine with one of the bundled subcharts or with `modules.sql.dialect: sqlite`).
## @param externalDatabase.port Database port number. Leave empty to let the chart pick a dialect-appropriate default (`3306` for mysql, `5432` for postgresql).
## @param externalDatabase.user Non-root username for FreeRADIUS
## @param externalDatabase.password Password for the non-root username for FreeRADIUS
## @param externalDatabase.database FreeRADIUS database name
## @param externalDatabase.existingSecret Name of an existing secret resource containing the database credentials
## @param externalDatabase.existingSecretPasswordKey Key inside `externalDatabase.existingSecret` that holds the password
##
externalDatabase:
  host: ""
  port: ""
  user: freeradius_user
  database: freeradius_db
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: ""

## Database bootstrap. Loads the rlm_sql schema (`files/schema/<dialect>.sql`)
## into the configured database via an init container on the FreeRADIUS pod
## before the main container starts. Idempotent — every shipped schema uses
## `CREATE TABLE IF NOT EXISTS`, so re-runs on restart are no-ops.
##
## Works with any backend selection: bundled `mariadb.enabled: true` /
## `postgresql.enabled: true` (waits for the subchart's Service to come up) or
## `externalDatabase.*` (assumes the external DB is reachable). Skipped when
## `modules.sql.dialect: sqlite` (the SQLite driver creates the schema at
## first write).
##
bootstrap:
  database:
    ## @param bootstrap.database.enabled Run the schema bootstrap init container before the FreeRADIUS container starts. Disable if your database is managed/bootstrapped out-of-band.
    ##
    enabled: true
    ## @param bootstrap.database.schemaConfigMap Name of an existing ConfigMap (must contain `schema.sql`) used in place of the chart-rendered `<fullname>-db-schema`. Use this to ship a customised schema without forking the chart.
    ##
    schemaConfigMap: ""
    ## Init container image used to apply the bundled `files/schema/<dialect>.sql`
    ## into the configured database. Per-dialect canonical defaults live in
    ## the `freeradius.bootstrap.database.image` helper (currently
    ## `bitnami/mariadb:11` for mysql and `bitnami/postgresql:17` for
    ## postgresql — each ships the matching CLI). Override field-by-field
    ## below: any non-empty value here wins, empty values fall through to
    ## the dialect default. Use this to switch registries (Bitnami mirror,
    ## ECR, etc.), pin a specific tag, or point at a slimmer image
    ## (`postgres:17-alpine`, `mariadb:11-noble`). Sqlite skips bootstrap
    ## entirely so this image is unused in that case.
    ##
    ## @param bootstrap.database.image.registry Image registry (empty = dialect default — `docker.io`)
    ## @param bootstrap.database.image.repository Image repository (empty = dialect default — `bitnami/mariadb` or `bitnami/postgresql`)
    ## @param bootstrap.database.image.tag Image tag (empty = dialect default — `11` or `17`)
    ## @param bootstrap.database.image.digest Image digest, takes precedence over `tag` when set
    ## @param bootstrap.database.image.pullPolicy Image pull policy
    ## @param bootstrap.database.image.pullSecrets Image pull secrets
    ##
    image:
      registry: ""
      repository: ""
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
      pullSecrets: []
    ## @param bootstrap.database.resources Resources requested by the bootstrap init container
    ##
    resources:
      limits: {}
      requests: {}
    ## @param bootstrap.database.waitTimeout Seconds to wait for the database to accept connections before failing. The init container retries every 2s.
    ##
    waitTimeout: 120
