## =============================================================================
## @section Global parameters
## -----------------------------------------------------------------------------
## Global Docker image parameters shared across this chart and any dependencies.
## Currently available: imageRegistry, imagePullSecrets, storageClass, and
## platform compatibility adaptations (OpenShift, SELinux).
## =============================================================================

## @param global.imageRegistry Global Docker image registry
## @param global.imagePullSecrets Global Docker registry secret names as an array
## @param global.storageClass Global StorageClass for Persistent Volume(s)
##
global:
  imageRegistry: ""
  ## E.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  imagePullSecrets: []
  storageClass: ""
  ## Compatibility adaptations for Kubernetes platforms
  ##
  compatibility:
    ## Compatibility adaptations for Openshift
    ##
    openshift:
      ## @param global.compatibility.openshift.adaptSecurityContext Adapt the securityContext sections of the deployment to make them compatible with Openshift restricted-v2 SCC: remove runAsUser, runAsGroup and fsGroup and let the platform use their allowed default IDs. Possible values: auto (apply if the detected running cluster is Openshift), force (perform the adaptation always), disabled (do not perform adaptation)
      ##
      adaptSecurityContext: auto
    ## @param global.compatibility.omitEmptySeLinuxOptions If set to true, removes the seLinuxOptions from the securityContexts when it is set to an empty object
    ##
    omitEmptySeLinuxOptions: false


## =============================================================================
## @section Common parameters
## -----------------------------------------------------------------------------
## Generic chart-wide parameters that affect every rendered resource:
## naming, labels/annotations applied to all objects, cluster domain,
## arbitrary extra manifests, and diagnostic-mode overrides.
## =============================================================================

## @param kubeVersion Force target Kubernetes version (using Helm capabilities if not set)
##
kubeVersion: ""
## @param nameOverride String to partially override freeradius.fullname
##
nameOverride: ""
## @param namespaceOverride String to partially override freeradius.namespace
##
namespaceOverride: ""
## @param fullnameOverride String to fully override freeradius.fullname
##
fullnameOverride: ""
## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param clusterDomain Default Kubernetes cluster domain
##
clusterDomain: cluster.local
## @param extraDeploy Array of extra objects to deploy with the release
##
extraDeploy: []

## Enable diagnostic mode in the deployment
##
diagnosticMode:
  ## @param diagnosticMode.enabled Enable diagnostic mode (all probes will be disabled and the command will be overridden)
  ##
  enabled: false
  ## @param diagnosticMode.command Command to override all containers in the deployment
  ##
  command:
    - sleep
  ## @param diagnosticMode.args Args to override all containers in the deployment
  ##
  args:
    - infinity


## =============================================================================
## @section FreeRADIUS Image parameters
## -----------------------------------------------------------------------------
## The Docker image used to run FreeRADIUS. Override these to pin a specific
## version, point at a private registry, or change the pull policy.
## =============================================================================

## FreeRADIUS image
## ref: https://hub.docker.com/r/freeradius/freeradius-server/tags
## @param image.registry FreeRADIUS image registry
## @param image.repository FreeRADIUS image repository
## @param image.tag FreeRADIUS image tag (immutable tags are recommended)
## @param image.pullPolicy FreeRADIUS image pull policy
## @param image.pullSecrets Specify docker-registry secret names as an array
## @param image.debug Specify if debug logs should be enabled
##
image:
  registry: docker.io
  repository: freeradius/freeradius-server
  tag: "3.2.8"
  ## Specify a imagePullPolicy
  ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
  ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  ##
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets (secrets must be manually created in the namespace)
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## Example:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: []
  ## Set to true if you would like to see extra information on logs
  ##
  debug: false


## =============================================================================
## @section FreeRADIUS Configuration parameters
## -----------------------------------------------------------------------------
## FreeRADIUS application configuration: architecture mode, custom radiusd.conf
## content, init scripts, mods-enabled and sites-enabled module config, RADIUS
## clients map, and extra environment variables / startup flags.
## =============================================================================

## @param architecture FreeRADIUS architecture (`standalone` or `replication`)
##
architecture: standalone

## @param configurations Inline FreeRADIUS configuration (rendered into a ConfigMap and mounted as `/etc/freeradius/radiusd.conf`). Leave empty to use the upstream image defaults.
##
configurations: |
  prefix = /usr
  exec_prefix = /usr
  sysconfdir = /etc
  localstatedir = /var
  sbindir = ${exec_prefix}/sbin
  logdir = /var/log/freeradius
  raddbdir = /etc/freeradius
  radacctdir = ${logdir}/radacct

  name = radiusd

  confdir = ${raddbdir}
  modconfdir = ${confdir}/mods-config
  certdir = ${confdir}/certs
  cadir   = ${confdir}/certs
  run_dir = ${localstatedir}/run/${name}

  db_dir = ${raddbdir}
  libdir = /usr/lib/freeradius
  pidfile = ${run_dir}/${name}.pid
  max_request_time = 30
  cleanup_delay = 5
  max_requests = 16384
  hostname_lookups = no

  unlang {
  }

  log {
    destination = files
    colourise = yes
    file = ${logdir}/radius.log
    syslog_facility = daemon
    stripped_names = no
    auth = no
    auth_badpass = no
    auth_goodpass = no

    msg_denied = "You are already logged in - access denied"
  }

  checkrad = ${sbindir}/checkrad

  ENV {
  }

  security {
    allow_core_dumps = no
    max_attributes = 200
    reject_delay = 1
    status_server = yes
    require_message_authenticator = auto
    limit_proxy_state = auto
    allow_vulnerable_openssl = no
  }

  proxy_requests  = yes
  $INCLUDE proxy.conf
  {{- if or .Values.homeServers .Values.tls.enabled }}
  $INCLUDE /opt/startechnica/freeradius/home-servers.conf
  {{- end }}
  {{- if or .Values.homeServerPools .Values.tls.enabled }}
  $INCLUDE /opt/startechnica/freeradius/home-server-pools.conf
  {{- end }}
  $INCLUDE /opt/startechnica/freeradius/realms.conf
  $INCLUDE {{ .Values.clients.includeFile }}

  thread pool {
    start_servers = 5
    max_servers = 32
    min_spare_servers = 3
    max_spare_servers = 10
    max_requests_per_server = 0
    auto_limit_acct = no
  }

  modules {
    $INCLUDE {{ .Values.modules.includeDir }}/
  }

  instantiate {
  }

  policy {
    $INCLUDE {{ .Values.policies.includeDir }}/
  }

  $INCLUDE {{ .Values.sites.includeDir }}/

## @param configurationsConfigMap Name of an externally-managed ConfigMap supplying FreeRADIUS configuration (Note: Overrides `configurations`). The value is evaluated as a template.
##
configurationsConfigMap: ""
## @param existingConfigmap Name of an existing ConfigMap supplying the chart's standard env-vars (in place of the chart-rendered `<fullname>-envvars`). When set, the chart skips its own envvars ConfigMap and the Deployment's `envFrom` references this resource.
##
existingConfigmap: ""
## @param extraStartupArgs Extra default startup args (prepended to the container args)
##
extraStartupArgs: ""
## @param extraFlags FreeRADIUS additional command line flags
##
extraFlags: ""
## @param initdbScripts Dictionary of initdb scripts run at first boot. Alternatively, drop files under `files/docker-entrypoint-initdb.d/`.
## e.g:
## initdbScripts:
##   my_init_script.sh: |
##      #!/bin/sh
##      echo "Do something."
##
initdbScripts: {}
## @param initdbScriptsConfigMap ConfigMap with the initdb scripts (Note: Overrides `initdbScripts`)
##
initdbScriptsConfigMap: ""
## @param extraEnvVars Extra environment variables to be set on FreeRADIUS containers
## E.g.
## extraEnvVars:
##  - name: TZ
##    value: "Europe/Paris"
##
extraEnvVars: []
## @param extraEnvVarsCM Name of existing ConfigMap containing extra env vars for FreeRADIUS containers
##
extraEnvVarsCM: ""
## @param extraEnvVarsSecret Name of existing Secret containing extra env vars for FreeRADIUS containers
##
extraEnvVarsSecret: ""

## Module enablement. Each sub-block toggles a matching FreeRADIUS module.
## Every enabled module renders into its own ConfigMap (`templates/modules/<name>.yaml`,
## named `<fullname>-mods-<name>`) and is mounted at
## `/etc/freeradius/mods-enabled/<name>` inside the container so the upstream
## daemon picks it up. Set `<module>.existingConfigMap` to mount a BYO ConfigMap
## (with a `<name>` key) instead — the chart then skips rendering that module.
##
modules:
  includeDir: mods-enabled
  ## SQL backend for clients/users/accounting. When enabled, the chart renders
  ## the `sql` module config (`templates/modules/sql.yaml`) directly from these
  ## values and the database-connection helpers (the matching bundled subchart —
  ## `mariadb.*` for mysql, `postgresql.*` for postgresql — or `externalDatabase.*`
  ## when no subchart is enabled), and mounts it into the pod. The DB password is
  ## injected separately by the Deployment via secretKeyRef.
  ##
  sql:
    ## @param modules.sql.enabled Enable the FreeRADIUS SQL module
    ##
    enabled: false
    ## @param modules.sql.existingConfigMap Mount an existing ConfigMap (must contain a `sql` key with the module config) at `mods-enabled/sql` instead of the chart-rendered one; the chart then skips rendering its own.
    ##
    existingConfigMap: ""
    ## @param modules.sql.dialect SQL dialect understood by the rlm_sql driver. Allowed: `mysql`, `postgresql`,
    ##  `sqlite`. Must match whichever bundled subchart is enabled (`mariadb.enabled` ↔ `mysql`, `postgresql.enabled` ↔ `postgresql`);
    ##  the chart's hard validator rejects mismatches.
    ##
    dialect: mysql
    ## @param modules.sql.table.acct1 Table containing accounting items (start records)
    ## @param modules.sql.table.acct2 Table containing accounting items (stop records)
    ## @param modules.sql.table.authcheck Table containing `check` items
    ## @param modules.sql.table.authreply Table containing `reply` items
    ## @param modules.sql.table.client Table holding RADIUS client/NAS info
    ## @param modules.sql.table.groupcheck Table containing group `check` items
    ## @param modules.sql.table.groupreply Table containing group `reply` items
    ## @param modules.sql.table.postauth Table for post-auth storage
    ## @param modules.sql.table.usergroup Table mapping users to groups
    ##
    table:
      acct1: radacct
      acct2: radacct
      authcheck: radcheck
      authreply: radreply
      client: nas
      groupcheck: radgroupcheck
      groupreply: radgroupreply
      postauth: radpostauth
      usergroup: radusergroup
    ## @param modules.sql.group_attribute The group attribute specific to this instance of rlm_sql (maps 1:1 to FreeRADIUS `group_attribute`)
    ##
    group_attribute: SQL-Group
    ## @param modules.sql.read_clients Read RADIUS clients from the database (`nas` table). Clients are only read on server startup. (Maps 1:1 to FreeRADIUS `read_clients`.)
    ##
    read_clients: true
    ## @param modules.sql.readGroups Read the group tables (`groupcheck`/`groupreply`) during authorization. When `true`, group tables are read unless `Fall-Through = no` is set in the reply table; when `false`, they are only read when `Fall-Through = yes` is set explicitly. Upstream rlm_sql default is `true`.
    ##
    readGroups: true
    ## @param modules.sql.readProfiles Read user profiles during authorization. When `true`, profiles are read unless `Fall-Through = no` is set in the groupreply table; when `false`, they are only read when `Fall-Through = yes` is set explicitly. Upstream rlm_sql default is `true`.
    ##
    readProfiles: true
    ## TLS configuration for the SQL connection itself. Independent of the
    ## in-pod RADSEC TLS (see top-level `tls:` block) and of cert-manager (see
    ## `tls.certManager.*`).
    ##
    ## @param modules.sql.tls.enabled Enable TLS for the SQL backend connection
    ## @param modules.sql.tls.ciphers TLS cipher list passed to the SQL driver (empty leaves the driver default)
    ## @param modules.sql.tls.autoGenerated [DEPRECATED — no longer consulted] When `modules.sql.tls.enabled: true` the chart now auto-generates a self-signed Secret implicitly (suppressed only by setting `modules.sql.tls.certificatesSecret`). Slated for removal in the next major bump.
    ## @param modules.sql.tls.certificatesSecret Name of an existing Secret holding `tls.crt` / `tls.key` / `ca.crt` for the SQL connection. Skips auto-generation when set.
    ## @param modules.sql.tls.certFilename Override filename of the leaf certificate inside the mounted Secret
    ## @param modules.sql.tls.certKeyFilename Override filename of the leaf key inside the mounted Secret
    ## @param modules.sql.tls.certCAFilename Override filename of the CA certificate inside the mounted Secret
    ## @param modules.sql.tls.existingTlsSecret [DEPRECATED — use `modules.sql.tls.certificatesSecret`] Legacy alias retained for backwards compatibility. Slated for removal in the next major bump.
    ##
    tls:
      enabled: false
      ciphers: ""
      autoGenerated: true
      certificatesSecret: ""
      certFilename: ""
      certKeyFilename: ""
      certCAFilename: ""
      existingTlsSecret: ""
    ## SQLite-specific knobs, used when `modules.sql.dialect: sqlite`.
    ## @param modules.sql.sqlite.filename Path inside the container where the SQLite database file lives
    ## @param modules.sql.sqlite.busyTimeout SQLite `busy_timeout` (milliseconds)
    ##
    sqlite:
      filename: /startechnica/freeradius/freeradius.db
      busyTimeout: "200"

  ## REST backend (rlm_rest). When enabled, the chart renders its own
  ## `<fullname>-mods-rest` ConfigMap (`templates/modules/rest.yaml`) and wires
  ## the values below into the module file via `$ENV{}` placeholders.
  ## Use the module to consult an HTTP/HTTPS API during the authorize /
  ## authenticate / accounting / post-auth virtual-server sections — each
  ## section only actually fires when the matching `sites-enabled/*` config
  ## lists `rest` in its block.
  ##
  ## Egress NetworkPolicy: when `networkPolicy.enabled: true` AND
  ## `networkPolicy.allowExternalEgress: false`, add an explicit rule under
  ## `networkPolicy.extraEgress` so the pod can reach `connect_uri`.
  ##
  rest:
    ## @param modules.rest.enabled Enable the FreeRADIUS REST module.
    ##
    enabled: false
    ## @param modules.rest.existingConfigMap Mount an existing ConfigMap (must contain a `rest` key with the module config) at `mods-enabled/rest` instead of the chart-rendered one; the chart then skips rendering its own.
    ##
    existingConfigMap: ""
    ## @param modules.rest.connect_uri Base URI all per-section URIs are joined against (e.g. `https://api.example.com/radius`). Required when `enabled: true`.
    ##
    connect_uri: ""
    ## @param modules.rest.connect_timeout TCP connect timeout in seconds (floats accepted).
    ##
    connect_timeout: "4.0"
    ## HTTP authentication applied to ALL per-section blocks (the same
    ## credentials are sent on every request). For per-section credentials,
    ## supply a custom `modules/rest` via `extraVolumes` /
    ## `extraVolumeMounts`.
    ##
    ## @param modules.rest.auth HTTP auth method. Allowed: `none`, `basic`, `digest`, `bearer`. When set to anything
    ##   other than `none`, the chart wires `FREERADIUS_MODS_REST_PASSWORD` from a Secret.
    ## @param modules.rest.username Username for `basic`/`digest` auth. For `bearer`, leave empty (the token is the password).
    ## @param modules.rest.password Password (or bearer token) sent on every request. Auto-generated to a chart-managed value when empty AND `auth != none` AND no `existingSecret` is set.
    ## @param modules.rest.existingSecret Name of an existing Secret holding the REST password. Overrides chart-managed Secret rendering.
    ## @param modules.rest.existingSecretPasswordKey Key inside `existingSecret` that holds the password (defaults to `mods-rest-password`).
    ##
    auth: none
    username: ""
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: ""
    ## Per-section behavior. URI suffixes are appended to `connect_uri`; the
    ## method drives whether the request carries a body. Sections only fire
    ## when the matching virtual server (`sites-enabled/*`) calls `rest`.
    ##
    ## @param modules.rest.authorize.uri URI suffix appended to `connect_uri` for the authorize section. Empty means "use connect_uri as-is".
    ## @param modules.rest.authorize.method HTTP method. Allowed: `GET`, `POST`, `PUT`, `DELETE`, `PATCH`.
    ## @param modules.rest.authorize.body Body encoding. Allowed: `none`, `post` (form-urlencoded), `json`.
    ##
    authorize:
      uri: /authorize
      method: GET
      body: json
    ## @param modules.rest.authenticate.uri URI suffix for the authenticate section.
    ## @param modules.rest.authenticate.method HTTP method.
    ## @param modules.rest.authenticate.body Body encoding.
    ##
    authenticate:
      uri: /authenticate
      method: POST
      body: json
    ## @param modules.rest.accounting.uri URI suffix for the accounting section.
    ## @param modules.rest.accounting.method HTTP method.
    ## @param modules.rest.accounting.body Body encoding.
    ##
    accounting:
      uri: /accounting
      method: POST
      body: json
    ## @param modules.rest.post_auth.uri URI suffix for the post-auth section.
    ## @param modules.rest.post_auth.method HTTP method.
    ## @param modules.rest.post_auth.body Body encoding.
    ##
    post_auth:
      uri: /post-auth
      method: POST
      body: json
    ## TLS material for HTTPS `connect_uri`. Independent of in-pod RADSEC TLS
    ## (top-level `tls.*`) and SQL backend TLS (`modules.sql.tls.*`).
    ## Mounted into the pod at `/opt/startechnica/freeradius/certs-rest/`.
    ##
    ## Most REST endpoints only need server certificate verification — leave
    ## `enabled: false`, `check_cert: true`, `check_cert_cn: true` and the
    ## upstream image's system CA bundle verifies the server. Enable this
    ## block only when the endpoint signs with a private CA or requires
    ## mutual TLS (client cert).
    ##
    ## @param modules.rest.tls.enabled Mount client TLS material (CA / cert / key) into the pod and wire it into the rlm_rest `tls{}` block. Independent of `check_cert*` below.
    ## @param modules.rest.tls.auto_generated Render a chart-managed self-signed leaf via `templates/secrets/rest-tls.yaml` (signed by the chart's shared CA). Skipped when `certificates_secret` is set.
    ## @param modules.rest.tls.certificates_secret Name of an existing Secret holding `tls.crt`/`tls.key`/`ca.crt`. Overrides chart-managed rendering.
    ## @param modules.rest.tls.cert_filename Override filename of the leaf certificate inside the mounted Secret.
    ## @param modules.rest.tls.cert_key_filename Override filename of the leaf key inside the mounted Secret.
    ## @param modules.rest.tls.cert_ca_filename Override filename of the CA certificate inside the mounted Secret.
    ## @param modules.rest.tls.check_cert Verify the server's certificate chain. Disable only for self-signed endpoints in dev.
    ## @param modules.rest.tls.check_cert_cn Verify the server certificate's CN matches the URI host.
    ##
    tls:
      enabled: false
      auto_generated: false
      certificates_secret: ""
      cert_filename: ""
      cert_key_filename: ""
      cert_ca_filename: ""
      check_cert: true
      check_cert_cn: true
    ## rlm_rest connection pool (HTTP keepalive), sized off the FreeRADIUS
    ## thread pool. Every key is rendered into the `pool {}` block as a
    ## `key = value` directive via `freeradius.tplvalues.renderConfig`
    ## (`${thread[pool].*}` are FreeRADIUS config vars, passed through verbatim).
    ##
    ## @param modules.rest.pool.start Connections opened on module instantiation.
    ## @param modules.rest.pool.min Minimum idle connections kept open.
    ## @param modules.rest.pool.max Maximum open connections.
    ## @param modules.rest.pool.spare Spare connections kept idle.
    ## @param modules.rest.pool.uses Requests served per connection before recycle (0 = unlimited).
    ## @param modules.rest.pool.retry_delay Seconds to wait after a failed open before retrying.
    ## @param modules.rest.pool.lifetime Max connection lifetime in seconds (0 = unlimited).
    ## @param modules.rest.pool.idle_timeout Seconds an idle connection is kept before closing.
    ##
    pool:
      start: "${thread[pool].start_servers}"
      min: "${thread[pool].min_spare_servers}"
      max: "${thread[pool].max_servers}"
      spare: "${thread[pool].max_spare_servers}"
      uses: 0
      retry_delay: 30
      lifetime: 0
      idle_timeout: 60

  ## JSON xlat module (rlm_json). Exposes the `%{json_encode:...}` xlat for
  ## serialising attributes into JSON (handy for rlm_rest payloads and
  ## policies). On FreeRADIUS 3.2 the only knobs are the output format of that
  ## xlat, configured below under `encode`. These leaves are inlined into the
  ## nested `encode { attribute {} value {} }` block of `templates/modules/json.yaml`
  ## (the block structure is fixed; only these values are templated).
  ##
  json:
    ## @param modules.json.enabled Enable the FreeRADIUS JSON xlat module.
    ##
    enabled: false
    ## @param modules.json.existingConfigMap Mount an existing ConfigMap (must contain a `json` key with the module config) at `mods-enabled/json` instead of the chart-rendered one; the chart then skips rendering its own.
    ##
    existingConfigMap: ""
    ## Output format of the `%{json_encode:...}` xlat.
    ##
    encode:
      ## @param modules.json.encode.outputMode JSON document layout. One of: `object`, `object_simple`, `array`, `array_of_names`, `array_of_values`.
      ##
      output_mode: object
      attribute:
        ## @param modules.json.encode.attribute.prefix Colon-delimited prefix added to every attribute name (e.g. `foo` renders `User-Name` as `foo:User-Name`). Empty disables the prefix.
        ##
        prefix: ""
      value:
        ## @param modules.json.encode.value.singleValueAsArray Always emit values as a JSON array, even single values.
        ##
        singleValueAsArray: false
        ## @param modules.json.encode.value.enumAsInteger Emit the integer value of enumerated attributes instead of their textual alias.
        ##
        enumAsInteger: false
        ## @param modules.json.encode.value.datesAsInteger Emit date attributes as seconds since the epoch instead of a textual date.
        ##
        datesAsInteger: false
        ## @param modules.json.encode.value.alwaysString Force all values to be quoted JSON strings (integers are otherwise emitted unquoted).
        ##
        alwaysString: false

  ## PAM authentication module (rlm_pam). Hands authentication off to Linux
  ## PAM (`/etc/pam.d/${pam_auth}` inside the container). The upstream
  ## `freeradius/freeradius-server` image ships `/etc/pam.d/radiusd` by
  ## default — to use a custom PAM service, override `pam_auth` AND mount the
  ## matching config via `extraVolumes` / `extraVolumeMounts`. Don't forget
  ## to wire `Auth-Type := PAM` in `authorize` and add `pam` to the
  ## `authenticate {}` block of your virtual server.
  ##
  ## Every key here except `enabled` is rendered verbatim into the `pam {}`
  ## block as a `key = value` directive (via `freeradius.tplvalues.renderConfig`),
  ## so use FreeRADIUS directive names (snake_case) for any keys you add.
  ##
  pam:
    ## @param modules.pam.enabled Enable the FreeRADIUS PAM module.
    ##
    enabled: false
    ## @param modules.pam.existingConfigMap Mount an existing ConfigMap (must contain a `pam` key with the module config) at `mods-enabled/pam` instead of the chart-rendered one; the chart then skips rendering its own.
    ##
    existingConfigMap: ""
    ## @param modules.pam.pam_auth PAM service name. Maps to `/etc/pam.d/<name>` inside the container. The `Pam-Auth` attribute set in `authorize` overrides this at request time.
    ##
    pam_auth: radiusd

  ## PAP authentication module (rlm_pap). Verifies a cleartext `User-Password`
  ## against a "known good" password (`Cleartext-Password`, `Crypt-Password`,
  ## `MD5-Password`, `SSHA-Password`, …) supplied by another module such as
  ## `sql` or `files`. List `pap` in the `authorize {}` block of your virtual
  ## server (so it can set `Auth-Type := PAP`) and in `authenticate {}` (so it
  ## actually checks the password). This is the standalone module, independent
  ## of the inner `pap` EAP method under `modules.eap`.
  ##
  ## Every key here except `enabled`/`existingConfigMap` is rendered verbatim
  ## into the `pap {}` block as a `key = value` directive (via
  ## `freeradius.tplvalues.renderConfig`), so use FreeRADIUS directive names
  ## (snake_case) for any keys you add.
  ##
  pap:
    ## @param modules.pap.enabled Enable the FreeRADIUS PAP module.
    ##
    enabled: false
    ## @param modules.pap.existingConfigMap Mount an existing ConfigMap (must contain a `pap` key with the module config) at `mods-enabled/pap` instead of the chart-rendered one; the chart then skips rendering its own.
    ##
    existingConfigMap: ""
    ## @param modules.pap.normalise Detect the hash/encoding of "known good" passwords and normalise them so PAP can compare against them (`normalise`).
    ##
    normalise: true

  ## Redis module (rlm_redis). Exposes the `%{redis:...}` xlat for talking to a
  ## Redis server. Renders into `<fullname>-mods-redis`
  ## (`templates/modules/redis.yaml`) and mounts at `mods-enabled/redis`. Set
  ## `existingConfigMap` to mount a BYO ConfigMap instead. For a Redis-backed
  ## attribute cache, enable `modules.cache` with `driver: redis` — it reuses
  ## this connection (the settings below).
  ##
  ## Egress NetworkPolicy: when `networkPolicy.enabled: true` AND
  ## `networkPolicy.allowExternalEgress: false`, add a rule under
  ## `networkPolicy.extraEgress` so the pod can reach `modules.redis.server`.
  ##
  redis:
    ## @param modules.redis.enabled Enable the FreeRADIUS Redis module.
    ##
    enabled: false
    ## @param modules.redis.existingConfigMap Mount an existing ConfigMap (must contain a `redis` key) at `mods-enabled/redis` instead of the chart-rendered one; the chart then skips rendering its own.
    ##
    existingConfigMap: ""
    ## Redis connection. Every key here except `enabled` / `existingConfigMap` is
    ## rendered verbatim into the `redis { }` block as a `key = value` directive
    ## (nested maps become `key { }` sub-blocks) via
    ## `freeradius.tplvalues.renderConfig`, evaluated through Helm `tpl` (escape a
    ## literal `{{` as `{{ "{{" }}`). `server` is resolved by the chart (the bundled
    ## subchart's `<release>-redis-master` Service when `redis.enabled`, otherwise
    ## this value); the `${thread[pool].*}` values are FreeRADIUS config vars,
    ## passed through verbatim.
    ##
    ## @param modules.redis.server Redis server hostname. Ignored when the bundled `redis` subchart is enabled.
    ## @param modules.redis.port Redis server port.
    ## @param modules.redis.pool.start Connections opened on module instantiation.
    ## @param modules.redis.pool.min Minimum idle connections kept open.
    ## @param modules.redis.pool.max Maximum open connections.
    ## @param modules.redis.pool.spare Spare connections kept idle.
    ## @param modules.redis.pool.uses Requests served per connection before recycle (0 = unlimited).
    ## @param modules.redis.pool.retry_delay Seconds to wait after a failed open before retrying.
    ## @param modules.redis.pool.lifetime Max connection lifetime in seconds (0 = unlimited).
    ## @param modules.redis.pool.idle_timeout Seconds an idle connection is kept before closing.
    ##
    server: redis-master
    port: 6379
    # password: ""
    # database: 0
    pool:
      start: "${thread[pool].start_servers}"
      min: "${thread[pool].min_spare_servers}"
      max: "${thread[pool].max_servers}"
      spare: "${thread[pool].max_spare_servers}"
      uses: 0
      retry_delay: 30
      lifetime: 0
      idle_timeout: 60

  ## Cache module (rlm_cache). Caches arbitrary attributes keyed by an xlat
  ## expansion, with a pluggable backend `driver`. Renders into
  ## `<fullname>-mods-cache` (`templates/modules/cache.yaml`) and mounts at
  ## `mods-enabled/cache`. Set `existingConfigMap` to mount a BYO ConfigMap.
  ##
  cache:
    ## @param modules.cache.enabled Enable the FreeRADIUS cache module (rlm_cache).
    ##
    enabled: false
    ## @param modules.cache.existingConfigMap Mount an existing ConfigMap (must contain a `cache` key) at `mods-enabled/cache` instead of the chart-rendered one; the chart then skips rendering its own.
    ##
    existingConfigMap: ""
    ## @param modules.cache.driver Cache backend driver. One of `rbtree` (in-memory, per-pod), `redis` (shared across replicas — reuses the connection under `modules.redis`, and the bundled Redis password when `redis.auth.enabled`), `memcached`.
    ##
    driver: rbtree
    ## @param modules.cache.key Cache key expansion (FreeRADIUS xlat). Embed the quotes in the value so it renders quoted.
    ##
    key: '"%{User-Name}"'
    ## @param modules.cache.ttl Default entry time-to-live in seconds.
    ##
    ttl: 3600
    ## @param modules.cache.maxEntries Maximum number of cached entries (0 = unlimited).
    ##
    maxEntries: 0
    ## @param modules.cache.update Body of the required rlm_cache `update { }` section, rendered verbatim (through `tpl`, so values may be referenced). FreeRADIUS refuses to load the module unless this holds at least one map. Each line is FreeRADIUS map syntax `<list>:<attr> <op> <value>`: on store it is written to the cache entry, on retrieve it is copied back onto the request. The default caches the whole reply list; customise for what you actually need.
    ##
    update: |-
      &reply: += &reply:
    ## @param modules.cache.config [object] Extra `rlm_cache` directives merged verbatim into the `cache { }` block (e.g. `epoch`, `add_stats`). Rendered via `freeradius.tplvalues.renderConfig`.
    ##
    config: {}
    ## Memcached backend settings, used when `driver: memcached`. Rendered verbatim
    ## into the `memcached { }` sub-block.
    ##
    ## @param modules.cache.memcached.config [object] libmemcached driver settings (e.g. `options`).
    ##
    memcached:
      config:
        options: '"--SERVER=memcached:11211"'
    ## Additional user-defined rlm_cache instances rendered alongside the base
    ## `cache` instance (and the chart-managed `cache_tls` / `keycloak_cache`
    ## siblings). Each top-level key is a FreeRADIUS module instance name
    ## (used directly in unlang as `<name>`) with the same schema as the base:
    ## `driver`, `key`, `ttl`, `maxEntries` (default 0), `update` (required),
    ## `config`, `memcached.config`. One ConfigMap per instance renders into
    ## `mods-enabled/<name>`. `driver: redis` auto-injects the `redis { }`
    ## sub-block reusing `modules.redis.*` connection params, same as the base.
    ##
    ## @param modules.cache.instances [object] Additional named rlm_cache instances. Map key = FreeRADIUS instance name (e.g. `cache_coa`); value = config dict mirroring the base cache schema.
    ## instances:
    ##   cache_coa:
    ##     driver: redis
    ##     key: '"%{Acct-Session-Id}"'
    ##     ttl: 7200
    ##     update: |-
    ##       &reply: += &reply:
    ##
    instances: {}

  ## EAP module (rlm_eap). Provides TLS-based EAP methods that share one
  ## `tls-config` server certificate: EAP-TLS (mutual TLS, client
  ## certificate) and EAP-TTLS (TLS tunnel + inner auth via a virtual
  ## server). `defaultType` selects which enabled method is offered to peers
  ## that don't negotiate one. EAP runs over plain RADIUS (UDP auth) — it is
  ## independent of RADSEC (`tls.enabled`).
  ##
  ## Structure mirrors FreeRADIUS: `tlsConfig` is the shared
  ## `tls-config tls-common { }` block (server cert + TLS engine settings);
  ## `methods.*` are the individual EAP methods, each referencing tls-common.
  ##
  eap:
    ## @param modules.eap.enabled Enable the FreeRADIUS EAP module.
    ##
    enabled: false
    ## @param modules.eap.existingConfigMap Mount an existing ConfigMap (must contain an `eap` key with the module config) at `mods-enabled/eap` instead of the chart-rendered one; the chart then skips rendering its own.
    ##
    existingConfigMap: ""
    ## @param modules.eap.defaultType Outer EAP method offered when the peer doesn't request a specific one. Must be one of the enabled outer methods (`tls`, `ttls`) listed in `methods`.
    ##
    defaultType: ttls
    ## @param modules.eap.timerExpire Seconds an EAP session may sit idle before it is expired (`timer_expire`).
    ## @param modules.eap.ignoreUnknownEapTypes Silently ignore EAP requests for unknown/unconfigured types instead of NAK-ing (`ignore_unknown_eap_types`).
    ## @param modules.eap.ciscoAccountingUsernameBug Work around the Cisco accounting User-Name bug (`cisco_accounting_username_bug`).
    ## @param modules.eap.maxSessions Maximum number of concurrent EAP sessions (`max_sessions`). Defaults to the FreeRADIUS `${max_requests}` config var.
    ##
    timerExpire: 60
    ignoreUnknownEapTypes: false
    ciscoAccountingUsernameBug: false
    maxSessions: "${max_requests}"
    ## @param modules.eap.methods [array] EAP methods to render, each as its own block. Outer methods (`tls`, `ttls`)
    ##   reference the shared `tlsConfig`; inner methods (`mschapv2`, `md5`, `pap`) render as empty blocks for use inside the TTLS tunnel (selected via `ttls.default_eap_type`). Remove a method to disable it — e.g. drop `md5` (EAP-MD5 is legacy/insecure).
    ##
    methods:
      - tls
      - ttls
      - peap
      - mschapv2
      # - md5

    ## Per-method config. Which methods are rendered is controlled by `methods`
    ## above. Each method's config map (`modules.eap.<method>`) becomes the body
    ## of its block: every key is emitted as a `key = value` directive (nested
    ## maps become `key { ... }` sub-blocks) via `freeradius.tplvalues.renderConfig`,
    ## evaluated through Helm `tpl` so values may reference `.Values` / `.Release`
    ## (escape literal `{{` as `{{ "{{" }}`). The inner methods (`mschapv2` /
    ## `md5` / `pap`) carry no config here, so they render as empty `<method> {}`
    ## blocks; add any directive as a key to give one a body.
    ##
    ## @param modules.eap.tls.tls Name of the `tls-config` block this method references (`tls = <name>`).
    ##
    tls:
      tls: tls-common
    ## EAP-TTLS — establishes a TLS tunnel, then authenticates the inner
    ## identity through a virtual server.
    ##
    ## @param modules.eap.ttls.tls Name of the `tls-config` block this method references (`tls = <name>`).
    ## @param modules.eap.ttls.default_eap_type Inner EAP type used inside the TTLS tunnel (e.g. `mschapv2`, `md5`). Must be an inner method listed in `methods`.
    ## @param modules.eap.ttls.copy_request_to_tunnel Copy outer request attributes into the tunnel (`copy_request_to_tunnel`).
    ## @param modules.eap.ttls.use_tunneled_reply Copy tunnel reply attributes to the outer reply (`use_tunneled_reply`).
    ## @param modules.eap.ttls.virtual_server Virtual server (`sites-enabled/<name>`) that authenticates the TTLS inner identity. Defaults to the chart-shipped `inner-tunnel` site.
    ##
    ttls:
      tls: tls-common
      # default_eap_type: pap
      copy_request_to_tunnel: "yes"
      use_tunneled_reply: "yes"
      virtual_server: inner-tunnel
      include_length: "yes"

    peap:
      tls: tls-common
      # default_eap_type: pap
      copy_request_to_tunnel: "yes"
      use_tunneled_reply: "yes"
      virtual_server: "inner-tunnel"

    ## Shared TLS server configuration — FreeRADIUS `tls-config tls-common`.
    ## Consumed by every enabled TLS-based EAP method above. A separate TLS
    ## context (independent of in-pod RADSEC `tls.*`, SQL `modules.sql.tls.*`,
    ## and REST `modules.rest.tls.*`), mounted at
    ## `/opt/startechnica/freeradius/certs-eap`. EAP cannot run without a
    ## server certificate, so the chart auto-generates one (via cert-manager
    ## when its API is present, otherwise via the in-template shared genCA
    ## path) whenever the module is enabled and `certificates_secret` is
    ## empty.
    ##
    ## @param modules.eap.tlsConfig.name Name of the `tls-config` block (FreeRADIUS `tls-config <name>`). Each enabled method references it via `tls = <name>`.
    ## @param modules.eap.tlsConfig.autoGenerated [DEPRECATED — no longer consulted] When `modules.eap.enabled: true` the chart now auto-generates the EAP server leaf implicitly (suppressed only by setting `modules.eap.tlsConfig.certificates_secret`). Slated for removal in the next major bump.
    ## @param modules.eap.tlsConfig.certificates_secret Name of an existing Secret holding `tls.crt`/`tls.key`/`ca.crt` for EAP. Overrides chart-managed rendering.
    ## @param modules.eap.tlsConfig.cert_filename Override filename of the leaf certificate inside the mounted Secret.
    ## @param modules.eap.tlsConfig.cert_key_filename Override filename of the leaf key inside the mounted Secret.
    ## @param modules.eap.tlsConfig.cert_ca_filename Override filename of the CA certificate inside the mounted Secret.
    ## @param modules.eap.tlsConfig.private_key_password Password for the EAP leaf key when it is password-protected. Auto-generated into the chart credentials Secret (`mods-eap-tls-privkey-password`) when empty.
    ## @param modules.eap.tlsConfig.random_file Source of randomness passed to the TLS engine (`random_file`).
    ## @param modules.eap.tlsConfig.cipher_list OpenSSL cipher list (`cipher_list`). `DEFAULT` keeps the image's compiled-in list.
    ## @param modules.eap.tlsConfig.cipher_server_preference Honour the server's cipher order over the client's (`cipher_server_preference`).
    ## @param modules.eap.tlsConfig.min_version Minimum TLS protocol version offered (`tls_min_version`).
    ## @param modules.eap.tlsConfig.max_version Maximum TLS protocol version offered (`tls_max_version`).
    ##
    tlsConfig:
      name: tls-common
      autoGenerated: true
      certificates_secret: ""
      cert_filename: ""
      cert_key_filename: ""
      cert_ca_filename: ""
      private_key_password: ""
      random_file: /dev/urandom
      cipher_list: "DEFAULT"
      cipher_server_preference: false
      min_version: "1.2"
      max_version: "1.3"
      ## @param modules.eap.tlsConfig.cache.enable Enable the EAP TLS session cache (`cache { enable }`). Use `"yes"`/`"no"` (quoted, rendered verbatim). Overridden to `yes` when `sites.tlsCache.enabled` (the chart auto-wires that path).
      ## EAP TLS session cache — OpenSSL session resumption for EAP-TLS / PEAP /
      ## TTLS (distinct from `rlm_cache` / `modules.cache`). Enabling lets a
      ## returning supplicant skip the full handshake.
      ##
      ## Multi-replica caveat: the cache is per-pod (in-memory by default).
      ## `persist_dir` writes local disk only — shared RWX storage is unsafe for
      ## concurrent OpenSSL session writes. With multiple replicas a supplicant
      ## resuming on a different pod than the original will fall back to a full
      ## handshake; useful only with `replicas: 1` or sticky session affinity on
      ## the Service. For cross-pod resumption, enable `sites.tlsCache` — it
      ## externalises the cache to a Redis-backed rlm_cache instance and
      ## auto-wires `method = stateful` / `virtual_server = tls-cache` here.
      ##
      cache:
        enable: "no"
        lifetime: 86400                          # session lifetime in seconds (24h)
        max_entries: 255                         # in-memory entries cap
        name: EAP-module                         # namespace for the cache (lets multiple tls-configs coexist)
        persist_dir: "${logdir}/tlscache"        # OPTIONAL — persist sessions to disk so resumption survives restarts
        store_attributes: "yes"                  # write session attrs back into the request on resume
      ## @param modules.eap.tlsConfig.ocsp.enable Enable OCSP certificate checking (`ocsp { enable }`). Use `"yes"`/`"no"` (quoted, rendered verbatim).
      ##
      ocsp:
        enable: "no"
        name: EAP-module
        persist_dir: "${logdir}/tlscache"
      verify: {}
        # tmpdir: /tmp/radiusd
        # client: "/usr/bin/openssl verify -CApath ${..ca_path} %{TLS-Client-Cert-Filename}"
  files:
    enabled: false
    existingConfigMap: ""
  ldap:
    ## @param modules.ldap.enabled Enable the FreeRADIUS LDAP module.
    ##
    enabled: false
    ## @param modules.ldap.existingConfigMap Mount an existing ConfigMap (must contain an `ldap` key with the module config) at `mods-enabled/ldap` instead of the chart-rendered one; the chart then skips rendering its own.
    ##
    existingConfigMap: ""
## FreeRADIUS policy definitions (the `policy { }` block in radiusd.conf).
##
## @param policies.includeDir Directory the `policy { }` block includes policies from. A relative path resolves against the config dir (`/etc/freeradius`), so the default reads the image's bundled `policy.d` (filter, eap, …) plus any chart-mounted policies (e.g. Keycloak's `policy.d/keycloak`). The directory must exist in the container — point it at an absolute path only if you mount your own populated `policy.d`.
##
policies:
  includeDir: policy.d

## FreeRADIUS home_server definitions for proxy routing. Each entry renders a
## `home_server <name> { ... }` block referenced by a `home_server_pool`.
## Rendered into the `<fullname>-home-servers` ConfigMap, mounted at
## `/opt/startechnica/freeradius/home-servers.conf` and `$INCLUDE`d from the
## main configuration (absolute path) when this array is non-empty.
## `homeServerPools` and `realms` render into their own sibling ConfigMaps
## (`-home-server-pools` / `-realms`) under the same mount root and are
## `$INCLUDE`d in dependency order (servers → pools → realms).
##
## @param homeServers [array] Inline home_server entries. Each entry: `name` is the home_server identifier (referenced by `homeServerPools[].homeServers`); `type` is `auth` / `acct` / `auth+acct` / `coa` (default `auth`); `ipaddr` / `port` address the remote (port default 1812); `secret` is the shared secret (use `$ENV{...}` to inject from the env, e.g. via `extraEnvVarsSecret`); `proto` is `udp` / `tcp` (default `udp`); the remaining fields (`response_window`, `zombie_period`, `revive_interval`, `status_check`, `check_interval`, `num_answers_to_alive`) map 1:1 to FreeRADIUS native `home_server { }` directives and are emitted only when set.
## homeServers:
##   - name: auth1
##     type: auth
##     ipaddr: 192.0.2.10
##     port: 1812
##     secret: $ENV{FREERADIUS_HOMESERVER_AUTH1_SECRET}
##     proto: udp
##     response_window: 20
##     zombie_period: 40
##     revive_interval: 120
##     status_check: status-server
##     check_interval: 30
##     num_answers_to_alive: 3
##
homeServers: []

## FreeRADIUS home_server_pool definitions. Each entry renders a
## `home_server_pool <name> { ... }` block listing one or more `home_server`
## members; realms reference pools via `realms[].authPool` / `acctPool`.
##
## @param homeServerPools [array] Inline home_server_pool entries. Each entry: `name` is the pool identifier referenced by realms; `type` is `fail-over` (default) / `load-balance` / `client-balance` / `client-port-balance` / `keyed-balance`; `home_servers` is the ordered list of `home_server` names belonging to this pool (each renders as one `home_server = <name>` line); `virtual_server` (optional, maps 1:1 to the FreeRADIUS `virtual_server` directive in `home_server_pool { }`) names a virtual server the proxied reply is processed through; `fallback` (optional) names a `home_server` used when every pool member is dead. Note: per-entry sub-fields use snake_case here for visual consistency with the rendered FreeRADIUS config; this is distinct from the top-level `.Values.homeServers` (camelCase, list of home_server *definitions*).
## homeServerPools:
##   - name: my_auth_failover
##     type: fail-over
##     home_servers:
##       - auth1
##       - auth2
##     virtual_server: ""
##     fallback: ""
##
homeServerPools: []

## FreeRADIUS realm definitions for proxy routing. Each entry renders a
## `realm <name> { ... }` block. Realms map an incoming request's User-Name
## suffix to a `home_server_pool` (`authPool` / `acctPool`) or hand the
## request to a local `virtualServer`. Leave empty to keep the upstream
## `proxy.conf` realms unchanged.
##
## @param realms [array] Inline realm entries. Each entry: `name` is the realm string matched against the User-Name suffix (use `DEFAULT` for the fall-through realm, `NULL` for requests with no realm, `LOCAL` for the upstream-convention "handle locally, do not proxy" sentinel). All optional sub-fields below use snake_case mirroring FreeRADIUS native `realm { }` directive names; emit only the ones you need (mixing old-style and new-style is rejected by FreeRADIUS). Two routing modes: (a) **new-style proxy** via `auth_pool` / `acct_pool` / `coa_pool`, each referencing a `home_server_pool` name from `homeServerPools[]` (auth = Access-Request, acct = Accounting-Request, coa = Change-of-Authorization / Disconnect-Request); (b) **old-style proxy** via `authhost` / `accthost` / `secret` (FreeRADIUS 1.x/2.x compatibility — host:port pairs and the shared secret in-line). `virtual_server` handles the request locally instead of proxying (alternative to both modes). `nostrip: true` keeps the realm portion of User-Name when proxying (default strips). `realm LOCAL` is emitted by the chart unconditionally (the upstream definition in `files/proxy.conf` is commented out to avoid a "Duplicate realm" error). Supplying your own `name: LOCAL` entry below overrides the chart-managed one — useful for pointing LOCAL at a custom `virtual_server`. Wrapping charts can override `realms` freely without losing LOCAL.
## realms:
##   - name: example.com                  # new-style proxy via pool refs
##     auth_pool: my_auth_failover
##     acct_pool: my_acct_failover
##     coa_pool: my_coa_pool
##     nostrip: false
##     virtual_server: ""
##   - name: legacy.example.com           # old-style proxy
##     authhost: radius.example.com:1600
##     accthost: radius.example.com:1601
##     secret: $ENV{FREERADIUS_REALM_LEGACY_SECRET}
##
realms: []

## Virtual-server enablement. Toggles the matching FreeRADIUS virtual server
## (`/etc/freeradius/sites-enabled/<name>` inside the container) and wires
## the corresponding container port / Service port / NetworkPolicy entry.
## Per-site config files are sourced from `files/sites/<name>` and rendered
## into the `<release>-sites` ConfigMap by `templates/configmaps/sites.yaml`.
##
sites:
  includeDir: /opt/startechnica/freeradius/sites-enabled
  ## Core virtual servers, enabled by default: `default` (the main auth/acct
  ## server) and `inner-tunnel` (EAP-TTLS/PEAP inner identity). Disable either
  ## with `enabled: false`, or set `existingConfigMap` to bring your own.
  ##
  ## @param sites.default.enabled Enable the `default` virtual server (the main auth/acct server). Leave enabled unless you fully replace it via `extraSites`.
  ## @param sites.default.existingConfigMap Mount an existing ConfigMap (must contain a `default` key with the virtual-server config) at `sites-enabled/default` instead of the chart-rendered one; the chart then skips rendering its own.
  ##
  default:
    enabled: true
    existingConfigMap: ""
  ## @param sites.innerTunnel.enabled Enable the `inner-tunnel` virtual server (EAP-TTLS/PEAP inner identity). Required by the EAP module's tunnelled methods.
  ## @param sites.innerTunnel.existingConfigMap Mount an existing ConfigMap (must contain an `inner-tunnel` key with the virtual-server config) at `sites-enabled/inner-tunnel` instead of the chart-rendered one; the chart then skips rendering its own.
  ##
  innerTunnel:
    enabled: true
    existingConfigMap: ""
  ## @param sites.coa.enabled Enable the `coa` virtual server (Change-of-Authorization, UDP port `containerPorts.coa`).
  ## @param sites.coa.existingConfigMap Mount an existing ConfigMap (must contain a `coa` key with the virtual-server config) at `sites-enabled/coa` instead of the chart-rendered one; the chart then skips rendering its own.
  ## @param sites.coa.listen.ipaddr Bind address for the CoA listener. Wildcard `*` accepts CoA traffic on every pod interface; set to `0.0.0.0` / a specific IPv4 / `::` for IPv6 to constrain.
  ##
  coa:
    enabled: false
    existingConfigMap: ""
    listen:
      ipaddr: "*"
  ## RADIUS `status` virtual server, used by the chart's liveness/readiness
  ## probes (`radclient status` over loopback) AND by the standalone metrics
  ## exporter Deployment (`metrics.enabled`) which talks to it over the
  ## cluster Service. Disabling this also disables the chart-managed probes
  ## — supply `customLivenessProbe`/`customReadinessProbe` if you need
  ## different checks.
  ##
  ## @param sites.status.enabled Enable the `status` virtual server
  ## @param sites.status.listen Listen address for the status server. Default `0.0.0.0` so the standalone metrics exporter pod can reach it via the FreeRADIUS Service. Use `127.0.0.1` to keep it pod-local if you don't enable metrics (the chart's NetworkPolicy locks down the port either way).
  ## @param sites.status.secret Shared secret the status `radclient` uses. When empty, the chart auto-generates and persists one in `auth.existingSecret` under key `sites-status-secret`.
  ## @param sites.status.existingConfigMap Mount an existing ConfigMap (must contain a `status` key with the virtual-server config) at `sites-enabled/status` instead of the chart-rendered one; the chart then skips rendering its own.
  ##
  status:
    enabled: true
    existingConfigMap: ""
    listen: 0.0.0.0
    secret: ""
  ## DHCP virtual server (rlm_dhcp / sqlippool). Disabled by default. Enabling
  ## mounts the `dhcp` virtual server but does not open a DHCP listener port —
  ## wire that up via `containerPorts` / `service` / `extraPorts` as needed.
  ##
  ## @param sites.dhcp.enabled Enable the `dhcp` virtual server
  ## @param sites.dhcp.existingConfigMap Mount an existing ConfigMap (must contain a `dhcp` key with the virtual-server config) at `sites-enabled/dhcp` instead of the chart-rendered one; the chart then skips rendering its own.
  ##
  dhcp:
    enabled: false
    existingConfigMap: ""
  ## In-pod RADSEC server (TLS over TCP RADIUS). When enabled, the chart
  ## mounts the TLS material referenced by `tls.*` and opens the RADSEC
  ## container/Service port.
  ##
  ## @param sites.radsec.enabled Enable the RADSEC virtual server
  ## @param sites.radsec.listen.ipaddr Bind address for the RADSEC `listen { }` block. `*` accepts on every pod interface; set to `0.0.0.0` / a specific IPv4 / `::` for IPv6 to constrain. Note: the port is *not* configurable here — it is shared with the Service and NetworkPolicy via `containerPorts.radsec`.
  ## @param sites.radsec.listen.type FreeRADIUS listen-socket type. Default `auth+acct` handles both Access-Request and Accounting-Request packets on the same RADSEC connection — typical for a RADSEC-replacement-for-UDP setup. Use `auth` or `acct` to constrain.
  ## @param sites.radsec.listen.virtual_server Virtual server that processes decrypted RADSEC requests. Default `default` routes to the same `server default { }` that handles UDP traffic — see [README.md](README.md) §RADSEC for the rationale. Override to send RADSEC requests through a separate processing pipeline (must reference an existing virtual server, e.g. via `extraSites` or `sites.<name>.enabled`).
  ## @param sites.radsec.listen.proxy_protocol Emit `proxy_protocol = yes` so the listener parses HAProxy PROXY-protocol headers and uses the real client IP for RADIUS client lookup. Useful when fronting the RADSEC port with an L4 load balancer that adds PROXY headers. Default `false` (directive omitted, matches FreeRADIUS image default).
  ## @param sites.radsec.listen.check_client_connections Emit `check_client_connections = yes` so FreeRADIUS validates the client connection (TCP/TLS handshake) up front and rejects unauthorised peers before parsing RADIUS packets. Default `false` (directive omitted, matches FreeRADIUS image default).
  ## @param sites.radsec.tls.cipher_list TLS cipher suite passed to the RADSEC server's `tls { cipher_list = ... }` directive. `DEFAULT` keeps the upstream image's default list; set to an explicit OpenSSL cipher string to constrain (e.g. `HIGH:!aNULL:!MD5`). Also applied to the chart-managed `home_server radsec` loopback block in `home-servers.conf` so both peers negotiate consistently.
  ## @param sites.radsec.tls.private_key_password Password for the RADSEC private key when it is password-protected. Renders the `tls { private_key_password = $ENV{...} }` line in both the radsec listener and the chart-managed `home_server radsec` loopback. Auto-generated into the chart credentials Secret (`sites-radsec-privkey-password`) when left empty; the env-var (`FREERADIUS_SITES_RADSEC_PRIVKEY_PASSWORD`) is wired only when this value is set.
  ## @param sites.radsec.radsecSecret RADIUS shared secret for the loopback `clients radsec { client 127.0.0.1 { secret = … } }` block in the RADSEC virtual server. Stored under `clients-radsec-secret` in the chart-managed credentials Secret and injected via `$ENV{FREERADIUS_CLIENTS_RADSEC_SECRET}`. Auto-generated when empty; FreeRADIUS defaults the secret to literal `"radsec"` for `proto = tls` so any value works.
  ## @param sites.radsec.existingConfigMap Mount an existing ConfigMap (must contain a `radsec` key with the virtual-server config) at `sites-enabled/radsec` instead of the chart-rendered one; the chart then skips rendering its own.
  ## @param sites.radsec.clients [array] Additional external RADSEC peers (NASes, WiFi controllers, switches, VPN concentrators) authorised to connect on port `containerPorts.radsec`. Each entry renders a `client <name> { ... }` block inside the existing `clients radsec { }` group; the chart-managed loopback `client 127.0.0.1` (used by `home_server radsec` for the self-proxy pattern) is always emitted alongside, so don't add `127.0.0.1` here. Each entry: `name` is the on-config identifier (DNS-1123 label); `ipaddr` is an IPv4 host or CIDR (`192.0.2.50` / `192.0.2.0/24`); `ipv6addr` optional IPv6 variant; `secret` is the RADIUS shared secret — FreeRADIUS defaults this to literal `"radsec"` for `proto = tls`, so an empty value works for vanilla RADSEC, set it when your NAS uses a real secret (use `$ENV{...}` to pull from `extraEnvVarsSecret`); `require_message_authenticator: true` enforces the BlastRADIUS mitigation per client; `nas_type` is a free-form NAS-Type tag (default `other`); `virtual_server` (optional) overrides the listener's default virtual server for this client. All field names mirror FreeRADIUS native `client { }` directive names.
  ##
  radsec:
    enabled: false
    existingConfigMap: ""
    radsecSecret: ""
    listen:
      ipaddr: "*"
      type: "auth+acct"
      virtual_server: "default"
      proxy_protocol: false
      check_client_connections: false
    tls:
      cipher_list: "DEFAULT"
      private_key_password: ""
    ## clients:
    ##   - name: ap-controller
    ##     ipaddr: 192.0.2.50/32
    ##     secret: $ENV{FREERADIUS_RADSEC_CLIENT_AP_SECRET}
    ##     require_message_authenticator: true
    ##     nas_type: cisco
    ##     virtual_server: ""
    ##     ipv6addr: ""
    ##
    clients: []
  ## `tls-cache` virtual server — backs EAP TLS session resumption with a
  ## shared Redis-backed rlm_cache instance, fixing the per-pod caveat
  ## documented on `modules.eap.tlsConfig.cache` above. Enabling renders:
  ##   * `sites-enabled/tls-cache` (this template)
  ##   * `mods-enabled/cache_tls` — dedicated rlm_cache instance keyed on
  ##     `%{TLS-Session-Id}`, reusing the Redis connection from `modules.redis.*`
  ##   * auto-wires `tls-config { cache { enable = yes, method = stateful,
  ##     virtual_server = tls-cache } }` into the EAP module
  ## REQUIRES `modules.eap.enabled: true` AND a Redis backend (bundled subchart
  ## `redis.enabled: true` or external `modules.redis.server`). Rendering
  ## hard-fails via `freeradius.validate.tlsCache` otherwise — an in-pod
  ## backend would defeat the cross-replica resumption this site exists for.
  ##
  ## @param sites.tlsCache.enabled Enable the `tls-cache` virtual server. Auto-wires the EAP cache directives; hard-fails without Redis.
  ## @param sites.tlsCache.existingConfigMap Mount an existing ConfigMap (must contain a `tls-cache` key with the virtual-server config) at `sites-enabled/tls-cache` instead of the chart-rendered one; the chart then skips rendering its own.
  ## @param sites.tlsCache.ttl TTL (seconds) for cached TLS sessions in the dedicated `cache_tls` instance. Should match the desired resumption window (typically aligned with `modules.eap.tlsConfig.cache.lifetime` if set).
  ##
  tlsCache:
    enabled: false
    existingConfigMap: ""
    ttl: 86400


## RADIUS clients map rendered into a ConfigMap and mounted at
## `/etc/freeradius/clients.conf`. Each top-level entry becomes one `client`
## block. Set `existingConfigMapName` to bring your own ConfigMap (the entries
## below are then ignored).
##
clients:
  includeFile: clients.conf
  ## @param clients.existingConfigMapName Name of an existing ConfigMap supplying `clients.conf`. Overrides the chart-rendered entries above.
  ##
  existingConfigMapName: ""
  ## @param clients.localhost.ipv4addr IPv4 address (or CIDR) the loopback client matches
  ## @param clients.localhost.ipv6addr IPv6 address (or CIDR) the loopback client matches
  ## @param clients.localhost.proto Transport protocol (`udp` or `tcp`)
  ## @param clients.localhost.secret Shared secret used to authenticate this client
  ## @param clients.localhost.nas_type NAS-Type string reported by RADIUS attributes
  ## @param clients.localhost.virtual_server Virtual server (`sites-enabled/<name>`) requests from this client are dispatched to
  ## @param clients.localhost.coa_server Name of a `home_server` (or `home_server_pool`) used to proxy **outbound** CoA-Request/Disconnect packets sent to this client. Leave empty unless you've defined a matching `home_server` block — this chart does NOT currently render any. Inbound CoA is handled separately by `sites.coa.enabled` (a `listen` block + virtual server, not a client directive).
  ## @param clients.localhost.require_message_authenticator Reject Access-Requests that arrive without a `Message-Authenticator` attribute. Mitigates the BlastRADIUS attack (CVE-2024-3596). Safe to enable when every NAS that hits this client entry is known to add Message-Authenticator (all modern radclients do).
  ## @param clients.localhost.keycloak Bind this NAS to a named Keycloak backend defined under `keycloak.instances.<name>`. When set, the chart renders an `if (Packet-Src-IP-Address == <ipv4addr>) { keycloak_<name>_authorize }` arm into the dispatch chain in `sites/default` (and `sites/inner-tunnel`). Leave empty to fall through to the `default` instance (when `keycloak.wireDefaultSite: true`) or to `pap`. Not emitted into `clients.conf` — FR3 client blocks are schema-validated and reject unknown directives.
  ## @param clients.localhost.limit.max_connections Maximum concurrent connections (TCP only)
  ## @param clients.localhost.limit.lifetime Maximum connection lifetime in seconds (0 = no limit)
  ## @param clients.localhost.limit.idle_timeout Idle timeout in seconds
  ##
  localhost:
    ipv4addr: "127.0.0.1"
    ipv6addr: ""
    proto: udp
    secret: password
    nas_type: other
    virtual_server: default
    coa_server: ""
    require_message_authenticator: false
    keycloak: ""
    limit:
      max_connections: 16
      lifetime: 0
      idle_timeout: 30


