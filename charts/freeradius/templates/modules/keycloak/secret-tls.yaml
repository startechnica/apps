{{/*
Per-instance chart-rendered Secrets holding the Keycloak server TLS CA
bundle as `ca.crt`. One Secret per instance whose `tls.caCert` is
non-empty AND whose `tls.existingSecret` is unset (BYO).

  default → `<fullname>-keycloak-ca`           key: `ca.crt`
            (legacy name — kept stable for backwards-compat)
  <name>  → `<fullname>-keycloak-<name>-ca`    key: `ca.crt`

Instances using `tls.existingSecret` skip rendering and reference the
BYO Secret directly from Deployment.yaml. Instances with neither set fall
back to the image's system CA bundle.
*/}}

{{- if .Values.keycloak.enabled }}
{{- $resolved := include "freeradius.keycloak.resolveInstances" . | fromYaml }}
{{- range $name, $cfg := $resolved.instances }}
{{- if include "freeradius.keycloak.tls.createSecret" (dict "instance" $cfg) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "freeradius.keycloak.tls.secretName" (dict "name" $name "instance" $cfg "context" $) }}
  namespace: {{ include "st-common.names.namespace" $ | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
    app.firmansyah.id/keycloak-instance: {{ $name | quote }}
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" $.Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  ca.crt: |
{{ $cfg.tls.caCert | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
