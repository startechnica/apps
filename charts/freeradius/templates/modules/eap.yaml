{{- if and .Values.modules.eap.enabled (not .Values.modules.eap.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-mods-eap" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  {{- /* Mounted directly at mods-enabled/eap by the Deployment (subPath eap).
         `{{ ... }}` directives are evaluated as this template renders; the
         private-key password stays as `$ENV{}` so it is injected from a Secret
         at runtime and never baked into this ConfigMap. */}}
  eap: |-
    ## modules/eap -- EAP module (rlm_eap), EAP-TLS + EAP-TTLS methods
    eap {
        default_eap_type = {{ .Values.modules.eap.defaultType }}

        timer_expire = {{ .Values.modules.eap.timerExpire }}
        ignore_unknown_eap_types = {{ ternary "yes" "no" .Values.modules.eap.ignoreUnknownEapTypes }}
        cisco_accounting_username_bug = {{ ternary "yes" "no" .Values.modules.eap.ciscoAccountingUsernameBug }}
        max_sessions = {{ .Values.modules.eap.maxSessions }}

        tls-config {{ .Values.modules.eap.tlsConfig.name }} {
            certificate_file = {{ include "freeradius.eap.tlsConfig.certPath" . }}
            private_key_file = {{ include "freeradius.eap.tlsConfig.certKeyPath" . }}
            {{- if .Values.modules.eap.tlsConfig.private_key_password }}
            private_key_password = $ENV{FREERADIUS_MODS_EAP_TLS_PRIVKEY_PASSWORD}
            {{- end }}
            ca_file = {{ include "freeradius.eap.tlsConfig.caCertPath" . }}
            random_file = {{ .Values.modules.eap.tlsConfig.random_file }}

            cipher_list = "{{ .Values.modules.eap.tlsConfig.cipher_list }}"
            cipher_server_preference = {{ ternary "yes" "no" .Values.modules.eap.tlsConfig.cipher_server_preference }}
            tls_min_version = "{{ .Values.modules.eap.tlsConfig.min_version }}"
            tls_max_version = "{{ .Values.modules.eap.tlsConfig.max_version }}"

            cache {
                {{- include "freeradius.tplvalues.renderConfig" (dict "value" .Values.modules.eap.tlsConfig.cache "context" $) | nindent 16 }}
            }

            verify {
                {{- include "freeradius.tplvalues.renderConfig" (dict "value" .Values.modules.eap.tlsConfig.verify "context" $) | nindent 16 }}
            }

            ocsp {
                {{- include "freeradius.tplvalues.renderConfig" (dict "value" .Values.modules.eap.tlsConfig.ocsp "context" $) | nindent 16 }}
            }
        }

        #  EAP methods, rendered from `modules.eap.methods`. Each method's config map
        #  (`modules.eap.<method>`) becomes its block body via renderConfig; methods
        #  with no config map render an empty `<method> {}`.
        {{- range $method := .Values.modules.eap.methods }}
        {{ $method }} {
            {{- include "freeradius.tplvalues.renderConfig" (dict "value" (index $.Values.modules.eap $method) "context" $) | nindent 12 }}
        }
        {{- end }}
    }
{{- end }}
