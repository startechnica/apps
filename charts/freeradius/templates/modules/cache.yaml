{{/*
Single ConfigMap, single key (`cache`), holding every rlm_cache instance the
chart manages concatenated into one FreeRADIUS module file. Sections rendered
on demand:
  - `cache { }`                — base       (modules.cache.enabled)
  - `cache cache_tls { }`      — EAP TLS    (sites.tlsCache.enabled)
  - `cache cache_keycloak { }` — Keycloak   (keycloak.cache.enabled)
  - `cache <name> { }`         — per-entry  (modules.cache.instances.<name>)

The Deployment mounts this as one file at `mods-enabled/cache`; rlm_cache
parses every `cache <name>` block in the file and registers each as its own
instance.

BYO override: `modules.cache.existingConfigMap` skips this template entirely
and the user provides the full module file themselves. Chart-managed
`cache_tls` / `cache_keycloak` bodies interpolate chart values, so combining
BYO with `sites.tlsCache` or `keycloak.cache` is not supported.

The `redis { }` sub-block is intentionally inlined per instance — no shared
helper, because the indirection hurts readability more than the duplication.
*/}}
{{- if not .Values.modules.cache.existingConfigMap -}}
{{- $base := .Values.modules.cache.enabled -}}
{{- $tls := .Values.sites.tlsCache.enabled -}}
{{- $kc := .Values.keycloak.cache.enabled -}}
{{- $inst := not (empty .Values.modules.cache.instances) -}}
{{- if or $base $tls $kc $inst }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-mods-cache" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  cache: |
    {{- if $base }}
    # rlm_cache base module — attribute cache with a pluggable backend driver
    cache {
        driver = "rlm_cache_{{ .Values.modules.cache.driver }}"
        key = {{ .Values.modules.cache.key }}
        ttl = {{ .Values.modules.cache.ttl }}
        max_entries = {{ .Values.modules.cache.maxEntries }}
        {{- with .Values.modules.cache.config }}
        {{- include "freeradius.tplvalues.renderConfig" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}

        # Attributes to cache. rlm_cache refuses to load unless this section
        # holds at least one map ("Must have an 'update' section in order to
        # cache anything").
        update {
            {{- include "st-common.tplvalues.render" (dict "value" .Values.modules.cache.update "context" $) | nindent 12 }}
        }

        {{- if eq .Values.modules.cache.driver "redis" }}
        # Redis backend — connection reused from modules.redis
        redis {
            server = {{ include "freeradius.redis.host" . }}
            {{- if include "freeradius.redis.usePassword" . }}
            password = $ENV{FREERADIUS_MODS_REDIS_PASSWORD}
            {{- end }}
            {{- include "freeradius.tplvalues.renderConfig" (dict "value" (omit .Values.modules.redis "enabled" "existingConfigMap" "server") "context" $) | nindent 12 }}
        }
        {{- else if eq .Values.modules.cache.driver "memcached" }}
        memcached {
            {{- include "freeradius.tplvalues.renderConfig" (dict "value" .Values.modules.cache.memcached.config "context" $) | nindent 12 }}
        }
        {{- end }}
    }
    {{- end }}
    {{- if $tls }}

    # rlm_cache instance dedicated to OpenSSL TLS session blobs. Distinct from
    # the generic `modules.cache` instance: keyed on %{TLS-Session-Id}, with a
    # TTL tuned to the EAP session lifetime and an `update { }` that copies
    # &session-state: in both directions (the EAP module pre-populates the
    # serialized session there). Always Redis-backed — `freeradius.validate.tlsCache`
    # hard-fails if no Redis is configured, since an in-pod backend defeats
    # the cross-replica resumption that justifies enabling this at all.
    cache cache_tls {
        driver = "rlm_cache_redis"
        key = "%{TLS-Session-Id}"
        ttl = {{ .Values.sites.tlsCache.ttl }}
        max_entries = 0

        update {
            &session-state: += &session-state:
        }

        redis {
            server = {{ include "freeradius.redis.host" . }}
            {{- if include "freeradius.redis.usePassword" . }}
            password = $ENV{FREERADIUS_MODS_REDIS_PASSWORD}
            {{- end }}
            {{- include "freeradius.tplvalues.renderConfig" (dict "value" (omit .Values.modules.redis "enabled" "existingConfigMap" "server") "context" $) | nindent 12 }}
        }
    }
    {{- end }}
    {{- if $kc }}

    # rlm_cache instance dedicated to Keycloak auth results. Keyed on the
    # RADIUS User-Name; caches only the role attribute set by keycloak_lua
    # (&control:{{ .Values.keycloak.roleAttribute }}) so subsequent
    # `authorize_keycloak` calls within TTL skip the ROPC + introspection
    # roundtrip to Keycloak. Role->reply mapping (roles_keycloak) still runs
    # on every request, regenerating reply attrs from the cached role list.
    # Rest mode caches nothing useful currently (rlm_rest only fetches the
    # token); the cache_keycloak short-circuit still saves the ROPC roundtrip.
    # Always Redis-backed — freeradius.validate.keycloakCache hard-fails if
    # no Redis is configured (cross-pod sharing is the point; per-pod caches
    # still help but the chart standardises on Redis for predictability).
    cache cache_keycloak {
        driver = "rlm_cache_redis"
        key = "%{User-Name}"
        ttl = {{ .Values.keycloak.cache.ttl }}
        max_entries = 0

        update {
            &control:{{ .Values.keycloak.roleAttribute }} += &control:{{ .Values.keycloak.roleAttribute }}
        }

        redis {
            server = {{ include "freeradius.redis.host" . }}
            {{- if include "freeradius.redis.usePassword" . }}
            password = $ENV{FREERADIUS_MODS_REDIS_PASSWORD}
            {{- end }}
            {{- include "freeradius.tplvalues.renderConfig" (dict "value" (omit .Values.modules.redis "enabled" "existingConfigMap" "server") "context" $) | nindent 12 }}
        }
    }
    {{- end }}
    {{- range $name, $cfg := .Values.modules.cache.instances }}

    # User-defined rlm_cache instance (modules.cache.instances.{{ $name }}).
    cache {{ $name }} {
        driver = "rlm_cache_{{ $cfg.driver }}"
        key = {{ $cfg.key }}
        ttl = {{ $cfg.ttl }}
        max_entries = {{ $cfg.maxEntries | default 0 }}
        {{- with $cfg.config }}
        {{- include "freeradius.tplvalues.renderConfig" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}

        update {
            {{- include "st-common.tplvalues.render" (dict "value" $cfg.update "context" $) | nindent 12 }}
        }

        {{- if eq $cfg.driver "redis" }}
        # Redis backend — connection reused from modules.redis
        redis {
            server = {{ include "freeradius.redis.host" $ }}
            {{- if include "freeradius.redis.usePassword" $ }}
            password = $ENV{FREERADIUS_MODS_REDIS_PASSWORD}
            {{- end }}
            {{- include "freeradius.tplvalues.renderConfig" (dict "value" (omit $.Values.modules.redis "enabled" "existingConfigMap" "server") "context" $) | nindent 12 }}
        }
        {{- else if eq $cfg.driver "memcached" }}
        memcached {
            {{- if $cfg.memcached }}
            {{- include "freeradius.tplvalues.renderConfig" (dict "value" $cfg.memcached.config "context" $) | nindent 12 }}
            {{- end }}
        }
        {{- end }}
    }
    {{- end }}
{{- end }}
{{- end }}
