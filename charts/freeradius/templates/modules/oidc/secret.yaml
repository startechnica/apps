{{/*
Per-instance Opaque Secrets holding the OAuth client_secret for each
OIDC backend whose `clientSecret` is non-empty AND whose `existingSecret`
is unset (BYO). One Secret per qualifying instance:

  default → `<fullname>-oidc`           key: `client-secret`
  <name>  → `<fullname>-oidc-<name>`    key: `client-secret`

The Deployment injects each as `$ENV{<envPrefix>CLIENT_SECRET}` (prefix
`FREERADIUS_OIDC_` for default, `FREERADIUS_OIDC_<NAME>_` otherwise).
Instances using `existingSecret` skip rendering and reference the BYO
Secret directly from Application.yaml.
*/}}

{{- if .Values.modules.oidc.enabled }}
{{- $resolved := include "freeradius.oidc.resolveInstances" . | fromYaml }}
{{- $fullname := include "st-common.names.fullname" . }}
{{- range $name, $cfg := $resolved.instances }}
{{- if and $cfg.clientSecret (not $cfg.existingSecret) }}
{{- $secretName := ternary (printf "%s-oidc" $fullname) (printf "%s-oidc-%s" $fullname $name) (eq $name "default") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "st-common.names.namespace" $ | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" $.Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  client-secret: {{ $cfg.clientSecret | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
