{{/*
Per-instance Opaque Secrets holding the OIDC client_secret for each
Keycloak backend whose `clientSecret` is non-empty AND whose
`existingSecret` is unset (BYO). One Secret per qualifying instance:

  default → `<fullname>-keycloak`           key: `client-secret`
            (legacy name — kept stable for backwards-compat)
  <name>  → `<fullname>-keycloak-<name>`    key: `client-secret`

The Deployment injects each as `$ENV{<envPrefix>CLIENT_SECRET}` (prefix
`FREERADIUS_KEYCLOAK_` for default, `FREERADIUS_KEYCLOAK_<NAME>_`
otherwise). Instances using `existingSecret` skip rendering and reference
the BYO Secret directly from Deployment.yaml.
*/}}

{{- if .Values.keycloak.enabled }}
{{- $resolved := include "freeradius.keycloak.resolveInstances" . | fromYaml }}
{{- $fullname := include "st-common.names.fullname" . }}
{{- range $name, $cfg := $resolved.instances }}
{{- if and $cfg.clientSecret (not $cfg.existingSecret) }}
{{- $secretName := ternary (printf "%s-keycloak" $fullname) (printf "%s-keycloak-%s" $fullname $name) (eq $name "default") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "st-common.names.namespace" $ | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
    app.firmansyah.id/keycloak-instance: {{ $name | quote }}
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" $.Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  client-secret: {{ $cfg.clientSecret | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
