{{- if .Values.keycloak.enabled }}
{{- $isLua := eq .Values.keycloak.mode "lua" -}}
{{- $mod := ternary "keycloak_lua" "keycloak_rest" $isLua -}}
{{- /* rcodes after a successful call differ per module: rlm_lua returns `ok`
       on RLM_MODULE_OK; rlm_rest returns `updated` when it parsed reply attrs
       from the JSON body, otherwise `ok`. Match both for rest to be safe. */ -}}
{{- $okRcode := ternary "(ok)" "(ok || updated)" $isLua -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-keycloak-policy" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  {{- /* policy.d/keycloak — unlang wrapper around the active Keycloak backend
         module (`keycloak_lua` in lua mode, `keycloak_rest` in rest mode).
         Adds cache-aside when keycloak.cache.enabled and role→reply mapping
         when roleMappings (lua only — rest mode doesn't populate role attrs,
         since the chart's rlm_rest instance only hits the token endpoint).
         FreeRADIUS only parses `policy { }` blocks when included from
         policy.d/, so this lives in its own ConfigMap separate from the
         mods-enabled/keycloak module file. */}}
  keycloak: |
    #  Files in policy.d/ are $INCLUDEd inside radiusd.conf's top-level
    #  `policy { }` block, so each named policy is declared with bare
    #  `<name> { }` syntax (no `policy` keyword prefix — that would parse as
    #  a module call and fail with "Failed to find 'policy' as a module").

    #  Entry point. Call this from a virtual server's authorize {} section.
    keycloak_authorize {
        {{- if .Values.keycloak.cache.enabled }}
        #  Cache lookup: skip the Keycloak roundtrip if &User-Name has a
        #  recent successful result cached. cache_keycloak returns ok on hit
        #  (populating &control:{{ .Values.keycloak.roleAttribute }} in lua
        #  mode, or &reply:Session-Timeout / &reply:Class in rest mode),
        #  notfound on miss.
        cache_keycloak

        if (notfound) {
            {{ $mod }}
            if {{ $okRcode }} {
                {{- if not $isLua }}
                #  rest mode: lift expires_in / session_state from the Keycloak
                #  JSON body. Session-Timeout makes the NAS terminate the
                #  session when the OAuth token would have expired, forcing
                #  re-auth against Keycloak; Class round-trips Keycloak's
                #  session UUID opaquely in accounting packets so usage can
                #  be correlated back to a specific Keycloak session.
                #  Uses the dedicated `json_keycloak` rlm_json instance
                #  defined alongside keycloak_rest in mods-enabled/keycloak.
                #  Requires `response { force_to = "plain" }` on the
                #  keycloak_rest instance (so REST-HTTP-Body is a raw string).
                map json_keycloak "%{reply:REST-HTTP-Body}" {
                    &reply:Session-Timeout := '/expires_in'
                    &reply:Class           := '/session_state'
                    # If you need the access token instead, swap '/session_state'
                    # for '/access_token' — note JWTs are ~800-1500 bytes which
                    # some NASes truncate or reject in the Class attribute.
                }
                #  Drop the raw rest exposure attrs so they don't leak to the NAS.
                update reply {
                    &REST-HTTP-Status-Code !* ANY
                    &REST-HTTP-Body !* ANY
                }
                {{- end }}
                #  Store the post-auth attribute set per cache_keycloak's update {}.
                cache_keycloak
            }
        }
        {{- else }}
        {{- if $isLua }}
        #  keycloak_lua: ROPC + introspection -> &control:{{ .Values.keycloak.roleAttribute }} (+ rcode).
        {{- else }}
        #  keycloak_rest: ROPC password grant -> HTTP 200 = ok/updated, 401 = reject.
        {{- end }}
        {{ $mod }}
        {{- if not $isLua }}
        if {{ $okRcode }} {
            #  rest mode (no cache): same JSON extraction as the cache-miss
            #  branch above. See comment there for the rationale.
            map json_keycloak "%{reply:REST-HTTP-Body}" {
                &reply:Session-Timeout := '/expires_in'
                &reply:Class           := '/access_token'
            }
            update reply {
                &REST-HTTP-Status-Code !* ANY
                &REST-HTTP-Body !* ANY
            }
        }
        {{- end }}
        {{- end }}
        if {{ $okRcode }} {
            #  Credentials valid (fresh or cached): accept and resolve role-based reply attrs.
            update control {
                &Auth-Type := Accept
            }
        {{- if and $isLua .Values.keycloak.roleMappings }}
            keycloak_roles
        {{- end }}
        }
        #  reject (bad creds / inactive), fail (network/config) and noop
        #  (not a password request) propagate unchanged to the caller.
    }
    {{- if and $isLua .Values.keycloak.roleMappings }}

    #  Map Keycloak client roles (&control:{{ .Values.keycloak.roleAttribute }})
    #  to RADIUS reply attributes. First match wins.
    keycloak_roles {
    {{- range $i, $m := .Values.keycloak.roleMappings }}
        {{ if $i }}elsif{{ else }}if{{ end }} (&control:{{ $.Values.keycloak.roleAttribute }}[*] == "{{ $m.role }}") {
            update reply {
            {{- range $line := $m.reply }}
                {{ $line }}
            {{- end }}
            }
        }
    {{- end }}
    {{- if .Values.keycloak.denyWithoutRole }}
        else {
            update reply {
                Reply-Message := "Access denied: no valid Keycloak role"
            }
            reject
        }
    {{- end }}
    }
    {{- end }}
{{- end }}
