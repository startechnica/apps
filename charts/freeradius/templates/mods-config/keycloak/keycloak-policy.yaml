{{/*
Per-instance ConfigMaps holding the unlang policy wrapper for each
configured Keycloak backend. FreeRADIUS only parses `policy { }` blocks
when included from `policy.d/`, so these live in their own ConfigMaps
separate from the module-instance files rendered by `keycloak.yaml`.

  default → `<fullname>-keycloak-policy`           key: `keycloak`
            policy names: `authorize_keycloak`, `roles_keycloak`,
                          `groups_keycloak`
  <name>  → `<fullname>-keycloak-<name>-policy`    key: `keycloak_<name>`
            policy names: `authorize_keycloak_<name>`,
                          `roles_keycloak_<name>`,
                          `groups_keycloak_<name>`

The policy wraps the per-instance module instance (`keycloak_lua` /
`keycloak_python` for default, `keycloak_<name>` for named) with:
  - optional cache-aside via the dedicated `cache_keycloak[_<name>]`
    rlm_cache instance (when `cache.enabled`),
  - optional cache-hit freshness check via `<modName>_validate`
    (when `refreshTokenCache: true`): copies the cached refresh_token
    out of &control: and into &request: (rlm_python3 only exposes the
    request list to the script), calls Keycloak's /token endpoint with
    `grant_type=refresh_token`. Refresh REJECT (session revoked)
    invalidates the cache entry and rejects the request; network FAIL
    falls through gracefully, reusing the cached attrs.
  - `&control:Auth-Type := Accept` on success (so authenticate{} is bypassed),
  - role → reply mapping via `roles_keycloak[_<name>]` when `roleMappings`
    is non-empty,
  - group → reply mapping via `groups_keycloak[_<name>]` when `groupMappings`
    is non-empty.
*/}}

{{- if .Values.keycloak.enabled }}
{{- $resolved := include "freeradius.keycloak.resolveInstances" . | fromYaml }}
{{- $fullname := include "st-common.names.fullname" . }}
{{- range $name, $cfg := $resolved.instances }}
{{- $modName := include "freeradius.keycloak.moduleName" (dict "name" $name "mode" $cfg.mode) -}}
{{- $validateModName := include "freeradius.keycloak.validateModuleName" (dict "name" $name "mode" $cfg.mode) -}}
{{- $polName := include "freeradius.keycloak.policyName" (dict "name" $name) -}}
{{- $rolesPolName := include "freeradius.keycloak.rolesPolicyName" (dict "name" $name) -}}
{{- $groupsPolName := include "freeradius.keycloak.groupsPolicyName" (dict "name" $name) -}}
{{- $cacheName := include "freeradius.keycloak.cacheName" (dict "name" $name) -}}
{{- $polKey := include "freeradius.keycloak.policyKey" (dict "name" $name) -}}
{{- $cmName := ternary (printf "%s-keycloak-policy" $fullname) (printf "%s-keycloak-%s-policy" $fullname $name) (eq $name "default") -}}
{{- $cacheEnabled := and $cfg.cache $cfg.cache.enabled -}}
{{- $refreshValidate := and $cacheEnabled $cfg.refreshTokenCache -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cmName }}
  namespace: {{ include "st-common.names.namespace" $ | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
    app.firmansyah.id/keycloak-instance: {{ $name | quote }}
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" $.Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  {{ $polKey }}: |
    #  Files in policy.d/ are $INCLUDEd inside radiusd.conf's top-level
    #  `policy { }` block, so each named policy is declared with bare
    #  `<name> { }` syntax (no `policy` keyword prefix — that would parse as
    #  a module call and fail with "Failed to find 'policy' as a module").

    #  Entry point — call from a virtual server's authorize{} section. With
    #  multi-instance, the chart's dispatch chain in sites/default chooses
    #  which `authorize_keycloak[_<name>]` to call based on NAS-IP-Address.
    {{ $polName }} {
        {{- if $cacheEnabled }}
        #  Cache lookup: skip the Keycloak roundtrip if &User-Name has a
        #  recent successful result cached. Keyed on
        #  `keycloak:{{ $name }}:%{User-Name}` — instance-namespaced to prevent
        #  cross-instance cache hits on common usernames.
        {{ $cacheName }}

        if (notfound) {
            {{ $modName }}
            if (ok) {
                #  Store the post-auth attribute set per {{ $cacheName }}'s update{}.
                {{ $cacheName }}
            }
        }
        {{- if $refreshValidate }}
        elsif (ok) {
            #  Cache hit — confirm the Keycloak session is still alive by
            #  refreshing the cached token. rlm_python3 only sees the
            #  request list, so move the token there first.
            update request {
                Tmp-String-9 := &control:Tmp-String-9
            }
            {{ $validateModName }}
            if (reject) {
                #  Session revoked since the cache entry was stored
                #  (user disabled, password rotated, /logout-all). Force
                #  the entry to expire and reject this request — the
                #  next request from the same user will cache-miss and
                #  re-run ROPC against fresh credentials.
                update control {
                    &Cache-TTL := 0
                }
                {{ $cacheName }}
                update reply {
                    &Reply-Message := "Keycloak session revoked"
                }
                reject
            }
            #  fail / noop on the refresh: graceful degradation, the
            #  cached attrs are still our best answer. Restore rcode=ok
            #  so the post-cache `if (ok)` arms below fire.
            ok
        }
        {{- end }}
        {{- else }}
        #  {{ $modName }}: ROPC + JWT claims -> &control:{{ $cfg.roleAttribute }} (+ rcode).
        {{ $modName }}
        {{- end }}
        if (ok) {
            #  Credentials valid (fresh or cached): accept and resolve role/group-based reply attrs.
            update control {
                &Auth-Type := Accept
            }
            {{- if $cfg.roleMappings }}
            {{ $rolesPolName }}
            {{- end }}
            {{- if $cfg.groupMappings }}
            {{ $groupsPolName }}
            {{- end }}
        }
        #  reject (bad creds / inactive), fail (network/config) and noop
        #  (not a password request) propagate unchanged to the caller.
    }

    {{- if $cfg.roleMappings }}
    #  Map Keycloak client roles (&control:{{ $cfg.roleAttribute }})
    #  to RADIUS reply attributes. First match wins.
    {{ $rolesPolName }} {
    {{- range $i, $m := $cfg.roleMappings }}
        {{ if $i }}elsif{{ else }}if{{ end }} (&control:{{ $cfg.roleAttribute }}[*] == "{{ $m.role }}") {
            update reply {
            {{- range $line := $m.reply }}
                {{ $line }}
            {{- end }}
            }
        }
    {{- end }}
    {{- if $cfg.denyWithoutRole }}
        else {
            update reply {
                Reply-Message := "Access denied: no valid Keycloak role"
            }
            reject
        }
    {{- end }}
    }
    {{- end }}

    {{- if $cfg.groupMappings }}
    #  Map Keycloak group paths (&control:{{ default "Class" $cfg.groupAttribute }})
    #  to RADIUS reply attributes. First match wins. The shared library
    #  reads the `groups` claim verbatim (Keycloak's Group Membership
    #  client mapper emits full paths like "/branch-a/hotspot").
    {{ $groupsPolName }} {
    {{- range $i, $m := $cfg.groupMappings }}
        {{ if $i }}elsif{{ else }}if{{ end }} (&control:{{ default "Class" $cfg.groupAttribute }}[*] == "{{ $m.group }}") {
            update reply {
            {{- range $line := $m.reply }}
                {{ $line }}
            {{- end }}
            }
        }
    {{- end }}
    }
    {{- end }}
{{- end }}
{{- end }}
