{{/*
Shared Lua library — `keycloak_common.lua` — mounted into the pod's
script path once per release (regardless of how many lua-mode instances
exist). Per-instance wrappers (rendered by `keycloak-conf-lua.yaml`)
gather config from env vars and pass a plain table into
`common.authorize(p, cfg)` / `common.accounting(p)` /
`common.validate(p, cfg)`. The library itself touches NO env vars and
has NO module-level config — pure logic over the table passed in.

Rendered whenever `keycloak.enabled: true` — the body is pure static
logic, so an unused ConfigMap when no lua instance exists is just
inert (cheaper than a detection loop in the template).

Requires luasec (ssl.https), luasocket (ltn12, socket.url, mime) and
lua-cjson in the image — rlm_lua is not bundled in the default
`freeradius/freeradius-server:3.2.8` image.
*/}}

{{- if .Values.keycloak.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-keycloak-lua-common" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" $ | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" $.Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  keycloak_common.lua: |-
    --[[
      keycloak_common.lua — shared Lua logic for the per-instance Keycloak
      authenticator/mapper wrappers (rlm_lua, FreeRADIUS 3.2.x).

      Pure logic — no env-var reads, no module-level config. Each
      per-instance wrapper (`keycloak[_<name>].lua`) gathers its config
      from its own env-var prefix and passes a plain table in:

          common.authorize(p, cfg)
          common.accounting(p)
          common.validate(p, cfg)

      Expected keys in `cfg`:
          instance              string   instance name (for logs)
          role_attribute        string   &control:<this> populated per role
          base_url              string   Keycloak server URL
          realm                 string   realm name
          client_id             string   OIDC client_id
          client_secret         string   confidential-client secret (or "")
          scope                 string   OAuth scope (or "")
          role_mapper           string   "client" or "realm"
          ca_file               string   path to PEM CA (or nil)
          insecure              bool     skip TLS verify (dev only)
          timeout               number   connect timeout (seconds, or nil)
          group_attribute       string   &control:<this> populated per group
          group_mappings        table    non-empty -> caller wants groups
          attribute_mappings    table    {{"{"}}{{"{"}}claim=str, reply=str{{"}"}}, ...{{"}"}}
          required              table    JWT claim names that must be truthy
          introspect            bool     RFC 7662 introspection over local decode
          refresh_token_cache   bool     store refresh_token in &control:Tmp-String-9
    --]]

    local M = {}

    local https = require("ssl.https")
    local ltn12 = require("ltn12")
    local url   = require("socket.url")
    local mime  = require("mime")
    local json  = require("cjson")
    local fr    = require("freeradius")

    -- Request-list attribute that carries the cached refresh_token from
    -- cache hit into validate(). Same convention as the Python sibling.
    local REFRESH_TOKEN_ATTR = "Tmp-String-9"

    local function decode_jwt_claims(token)
        if not token then return {} end
        local payload = token:match("^[^.]+%.([^.]+)%.")
        if not payload then return {} end
        payload = payload:gsub("-", "+"):gsub("_", "/")
        local pad = (4 - (#payload % 4)) % 4
        if pad > 0 then payload = payload .. string.rep("=", pad) end
        local decoded = mime.unb64(payload)
        if not decoded then return {} end
        local ok, data = pcall(json.decode, decoded)
        if not ok then return {} end
        return data
    end

    local function roles_from_claims(claims, role_mapper, client_id)
        if role_mapper == "realm" then
            return ((claims or {}).realm_access or {}).roles or {}
        end
        local ra = (claims or {}).resource_access or {}
        return (ra[client_id] or {}).roles or {}
    end

    local function groups_from_claims(claims)
        return (claims or {}).groups or {}
    end

    local function is_truthy(v)
        -- Mirror the Python `not v` semantics: nil/false/0/""/empty-table are falsy.
        if v == nil or v == false or v == 0 or v == "" then return false end
        if type(v) == "table" and next(v) == nil then return false end
        return true
    end

    local function check_required(claims, required)
        if not required then return nil end
        for _, name in ipairs(required) do
            if not is_truthy((claims or {})[name]) then
                return name
            end
        end
        return nil
    end

    local function basic_auth(client_id, client_secret)
        return "Basic " .. (mime.b64(client_id .. ":" .. client_secret))
    end

    local function tls_params_for(cfg)
        local p = { mode = "client", protocol = "tlsv1_2" }
        if cfg.insecure then
            p.verify = "none"
        elseif cfg.ca_file then
            p.verify = "peer"
            p.cafile = cfg.ca_file
            p.options = "all"
        end
        return p
    end

    local function post_form(endpoint, fields, extra_headers, tls_params)
        local parts = {}
        for k, v in pairs(fields) do
            parts[#parts + 1] = url.escape(k) .. "=" .. url.escape(v)
        end
        local body = table.concat(parts, "&")
        local headers = {
            ["Content-Type"]   = "application/x-www-form-urlencoded",
            ["Content-Length"] = tostring(#body),
        }
        if extra_headers then
            for k, v in pairs(extra_headers) do headers[k] = v end
        end
        local resp = {}
        local _, code = https.request{
            url     = endpoint,
            method  = "POST",
            headers = headers,
            source  = ltn12.source.string(body),
            sink    = ltn12.sink.table(resp),
            verify  = tls_params.verify,
            cafile  = tls_params.cafile,
            options = tls_params.options,
        }
        if type(code) ~= "number" then
            return nil, nil
        end
        local ok, data = pcall(json.decode, table.concat(resp))
        if not ok then
            return code, nil
        end
        return code, data
    end

    local function kc_urls(cfg)
        local base = string.format("%s/realms/%s/protocol/openid-connect",
                                   cfg.base_url, cfg.realm)
        return base .. "/token", base .. "/token/introspect"
    end

    local function ropc(token_url, fields, tls_params)
        return post_form(token_url, fields, nil, tls_params)
    end

    local function introspect(introspect_url, token, cfg, tls_params)
        local headers = { Authorization = basic_auth(cfg.client_id, cfg.client_secret) }
        local code, body = post_form(introspect_url, { token = token }, headers, tls_params)
        if code == 200 and type(body) == "table" and body.active then
            return body
        end
        return nil
    end

    local function refresh(token_url, refresh_token, cfg, tls_params)
        local fields = {
            grant_type    = "refresh_token",
            client_id     = cfg.client_id,
            refresh_token = refresh_token,
        }
        if cfg.client_secret and cfg.client_secret ~= "" then
            fields.client_secret = cfg.client_secret
        end
        return post_form(token_url, fields, nil, tls_params)
    end

    function M.authorize(p, cfg)
        local username = p:get("request", "User-Name")
        local password = p:get("request", "User-Password")
        if not username or not password then
            return fr.RLM_MODULE_NOOP
        end

        local instance = cfg.instance
        if not cfg.base_url or not cfg.realm then
            fr.log(fr.L_ERR, "keycloak[" .. instance .. "]: base_url / realm not set")
            return fr.RLM_MODULE_FAIL
        end

        if cfg.timeout then https.TIMEOUT = cfg.timeout end
        local tls_params = tls_params_for(cfg)
        local token_url, introspect_url = kc_urls(cfg)

        local fields = {
            grant_type = "password",
            client_id  = cfg.client_id,
            username   = username,
            password   = password,
        }
        if cfg.client_secret and cfg.client_secret ~= "" then fields.client_secret = cfg.client_secret end
        if cfg.scope and cfg.scope ~= "" then fields.scope = cfg.scope end

        local code, body = ropc(token_url, fields, tls_params)

        if code == nil then
            fr.log(fr.L_ERR, "keycloak[" .. instance .. "]: token request failed (network/TLS)")
            return fr.RLM_MODULE_FAIL
        end
        if code == 400 or code == 401 then
            fr.log(fr.L_AUTH, "keycloak[" .. instance .. "]: ROPC rejected for " .. tostring(username) .. " (HTTP " .. tostring(code) .. ")")
            return fr.RLM_MODULE_REJECT
        end
        if code ~= 200 or not body or not body.access_token then
            fr.log(fr.L_ERR, "keycloak[" .. instance .. "]: unexpected token response for " .. tostring(username) .. " (HTTP " .. tostring(code) .. ")")
            return fr.RLM_MODULE_FAIL
        end

        local access_token  = body.access_token
        local refresh_token = body.refresh_token

        local claims
        if cfg.introspect then
            if not cfg.client_secret or cfg.client_secret == "" then
                fr.log(fr.L_ERR, "keycloak[" .. instance .. "]: introspect requires client_secret")
                return fr.RLM_MODULE_FAIL
            end
            claims = introspect(introspect_url, access_token, cfg, tls_params)
            if claims == nil then
                fr.log(fr.L_AUTH, "keycloak[" .. instance .. "]: introspect rejected token for " .. tostring(username))
                return fr.RLM_MODULE_REJECT
            end
        else
            claims = decode_jwt_claims(access_token)
        end

        local missing = check_required(claims, cfg.required)
        if missing then
            fr.log(fr.L_AUTH, "keycloak[" .. instance .. "]: required claim `" .. missing .. "` not satisfied for " .. tostring(username))
            return fr.RLM_MODULE_REJECT
        end

        local role_mapper = cfg.role_mapper or "client"
        local roles = roles_from_claims(claims, role_mapper, cfg.client_id)
        local groups = {}
        if cfg.group_mappings and #cfg.group_mappings > 0 then
            groups = groups_from_claims(claims)
        end

        if roles and #roles > 0 then
            for _, role in ipairs(roles) do
                fr.log(fr.L_DBG, "keycloak[" .. instance .. "]: role -> " .. role)
                p:add("control", cfg.role_attribute, role)
            end
        else
            fr.log(fr.L_WARN, "keycloak[" .. instance .. "]: no " .. role_mapper .. " roles for " .. tostring(username) .. " (CLIENT_ID=" .. cfg.client_id .. ")")
        end

        if groups and #groups > 0 then
            local ga = cfg.group_attribute or "Class"
            for _, group in ipairs(groups) do
                fr.log(fr.L_DBG, "keycloak[" .. instance .. "]: group -> " .. group)
                p:add("control", ga, group)
            end
        end

        if cfg.attribute_mappings then
            for _, m in ipairs(cfg.attribute_mappings) do
                local val = (claims or {})[m.claim]
                if val ~= nil then
                    p:add("reply", m.reply, tostring(val))
                end
            end
        end

        if cfg.refresh_token_cache and refresh_token then
            p:add("control", REFRESH_TOKEN_ATTR, refresh_token)
        end

        return fr.RLM_MODULE_OK
    end

    function M.validate(p, cfg)
        local refresh_token = p:get("request", REFRESH_TOKEN_ATTR)
        local instance = cfg.instance

        if not refresh_token then
            return fr.RLM_MODULE_NOOP
        end

        if not cfg.base_url or not cfg.realm then
            fr.log(fr.L_ERR, "keycloak[" .. instance .. "]: base_url / realm not set (validate)")
            return fr.RLM_MODULE_FAIL
        end

        if cfg.timeout then https.TIMEOUT = cfg.timeout end
        local tls_params = tls_params_for(cfg)
        local token_url, _ = kc_urls(cfg)

        local code, _ = refresh(token_url, refresh_token, cfg, tls_params)

        if code == 200 then
            fr.log(fr.L_DBG, "keycloak[" .. instance .. "]: refresh-token validated (cache hit)")
            return fr.RLM_MODULE_OK
        end
        if code == 400 or code == 401 then
            fr.log(fr.L_AUTH, "keycloak[" .. instance .. "]: refresh-token rejected (cache hit -> session revoked)")
            return fr.RLM_MODULE_REJECT
        end
        fr.log(fr.L_ERR, "keycloak[" .. instance .. "]: refresh-token request failed (HTTP " .. tostring(code) .. ")")
        return fr.RLM_MODULE_FAIL
    end

    function M.accounting(p)
        return fr.RLM_MODULE_NOOP
    end

    return M
{{- end }}
