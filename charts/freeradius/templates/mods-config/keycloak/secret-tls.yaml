{{/*
Chart-rendered Secret holding the Keycloak server TLS CA bundle as `ca.crt`.
Skipped when the user provides their own Secret via
`.Values.keycloak.tls.existingSecret` (the Deployment mounts that one
directly) or when no CA is configured at all (system CA bundle is used).
*/}}
{{- if and .Values.keycloak.enabled (include "freeradius.keycloak.tls.createSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "freeradius.keycloak.tls.secretName" . }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  ca.crt: |
{{ .Values.keycloak.tls.caCert | indent 4 }}
{{- end }}
