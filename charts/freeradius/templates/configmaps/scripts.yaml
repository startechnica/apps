apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-scripts" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  {{- /* radclient sends a Status-Server probe to the `status` virtual server over
         loopback. The shared secret comes from $FREERADIUS_SITES_STATUS_SECRET,
         injected by the Deployment via secretKeyRef. The probes invoke these as
         `sh <script>`, so no execute bit is required. */}}
  healthcheck.sh: |
    #!/bin/bash

    /bin/echo "Message-Authenticator = 0x00" | /usr/bin/radclient 127.0.0.1:{{ .Values.containerPorts.status }} status "$FREERADIUS_SITES_STATUS_SECRET"
  startup.sh: |
    #!/bin/bash

    {{- if or (.Files.Glob "files/docker-entrypoint-initdb.d/*.{sh,sql,sql.gz}") .Values.initdbScriptsConfigMap .Values.initdbScripts }}
    if [ ! -f "{{ .Values.persistence.mountPath }}/.user_scripts_initialized" ]; then
        echo "Init scripts still not executed. Skipping check"
        exit 1
    fi
    {{- end }}
    /bin/echo "Message-Authenticator = 0x00" | /usr/bin/radclient 127.0.0.1:{{ .Values.containerPorts.status }} status "$FREERADIUS_SITES_STATUS_SECRET"
  db-bootstrap.sh: |
    #!/bin/bash

    set -euo pipefail
    echo "[db-bootstrap] waiting up to {{ .Values.bootstrap.database.waitTimeout }}s for $DB_HOST:$DB_PORT" >&2
    deadline=$(( $(date +%s) + {{ .Values.bootstrap.database.waitTimeout }} ))
    while ! (echo > "/dev/tcp/$DB_HOST/$DB_PORT") 2>/dev/null; do
      if [ "$(date +%s)" -ge "$deadline" ]; then
        echo "[db-bootstrap] timeout waiting for database" >&2
        exit 1
      fi
      sleep 2
    done

    echo "[db-bootstrap] loading schema into $DB_NAME" >&2

    case "$DB_DIALECT" in
      mysql)
        mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < /schema/schema.sql
        ;;
      postgresql)
        PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f /schema/schema.sql
        ;;
      *)
        echo "[db-bootstrap] no schema load for dialect '$DB_DIALECT'; skipping" >&2
        ;;
    esac

    echo "[db-bootstrap] schema applied" >&2
