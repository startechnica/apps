{{- $rpKind := lower (toString (.Values.kind | default "Deployment")) -}}
{{- $rpReplicas := int (.Values.replicaCount | default 1) -}}
{{- $rpEnabled := and (hasKey .Values "realmPool") .Values.realmPool.enabled (eq $rpKind "statefulset") (gt $rpReplicas 1) -}}
{{- if or .Values.homeServerPools .Values.tls.enabled $rpEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-home-server-pools" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  home-server-pools.conf: |-
    {{- /* `home_server_pool radsec` is chart-managed so wrapping charts
           that override .Values.homeServerPools don't accidentally drop
           it. A user-supplied `name: radsec` entry in .Values.homeServerPools
           wins. Gated on tls.enabled to match `home_server radsec`. */}}
    {{- $hasRadsec := false }}
    {{- range .Values.homeServerPools }}
    {{- if eq .name "radsec" }}{{- $hasRadsec = true }}{{- end }}
    {{- end }}
    {{- if and .Values.tls.enabled (not $hasRadsec) }}
    home_server_pool radsec {
        type = fail-over
        home_server = radsec
    }
    {{- end }}
    {{- range .Values.homeServerPools }}
    home_server_pool {{ .name }} {
        type = {{ default "fail-over" .type }}
        {{- range .home_servers }}
        home_server = {{ . }}
        {{- end }}
        {{- if .virtual_server }}
        virtual_server = {{ .virtual_server }}
        {{- end }}
        {{- if .fallback }}
        fallback = {{ .fallback }}
        {{- end }}
    }
    {{- end }}

    {{- /* Auto-generated peer pool. Skipped when a user-supplied pool with the
           same name is present (same conflict-avoidance pattern as `radsec`
           above). Gated by $rpEnabled at file scope. */}}
    {{- if $rpEnabled }}
    {{- $rp := .Values.realmPool }}
    {{- $rpHasUser := false }}
    {{- range .Values.homeServerPools }}
    {{- if eq .name $rp.name }}{{- $rpHasUser = true }}{{- end }}
    {{- end }}
    {{- if not $rpHasUser }}
    home_server_pool {{ $rp.name }} {
        type = {{ default "load-balance" $rp.type }}
        {{- range $i := until $rpReplicas }}
        home_server = {{ $rp.name }}-{{ $i }}
        {{- end }}
        {{- if $rp.virtualServer }}
        virtual_server = {{ $rp.virtualServer }}
        {{- end }}
    }
    {{- end }}
    {{- end }}
{{- end }}
