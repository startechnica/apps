{{- if (include "st-common.capabilities.certmanagerCertificate.apiVersion" .) }}
{{- $apiVersion := include "st-common.capabilities.certmanagerCertificate.apiVersion" . -}}
{{- $releaseNamespace := include "st-common.names.namespace" . }}
{{- $clusterDomain := .Values.clusterDomain }}
{{- $fullname := include "st-common.names.fullname" . }}
{{- $svcDnsNames := list (printf "%s.%s.svc.%s" $fullname $releaseNamespace $clusterDomain) (printf "%s.%s.svc" $fullname $releaseNamespace) (printf "%s.%s" $fullname $releaseNamespace) $fullname }}
{{- if and .Values.tls.enabled .Values.tls.certManager.create }}
apiVersion: {{ $apiVersion }}
kind: Certificate
metadata:
  name: {{ $fullname }}
  namespace: {{ $releaseNamespace | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ include "freeradius.tls.secretName" . }}
  issuerRef:
    group: {{ .Values.tls.certManager.issuerRef.group }}
    kind: {{ .Values.tls.certManager.issuerRef.kind }}
    name: {{ .Values.tls.certManager.issuerRef.name }}
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  subject:
    organizations:
      - {{ .Release.Name | quote }}
    organizationalUnits:
      - {{ $fullname }}
  dnsNames:
    {{- range $svcDnsNames }}
    - {{ . | quote }}
    {{- end }}
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
{{- if and .Values.gateway.enabled .Values.gateway.tls.enabled .Values.tls.certManager.create }}
{{- if and .Values.tls.enabled .Values.tls.certManager.create }}
---
{{- end }}
{{- $primaryHost := default $fullname (first .Values.gateway.hostnames) }}
{{- $altNames := default (list $primaryHost) .Values.gateway.hostnames }}
apiVersion: {{ $apiVersion }}
kind: Certificate
metadata:
  name: {{ $fullname }}
  namespace: {{ include "st-common.gateway.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ include "freeradius.gateway.tlsSecretName" . }}
  issuerRef:
    group: {{ .Values.tls.certManager.issuerRef.group }}
    kind: {{ .Values.tls.certManager.issuerRef.kind }}
    name: {{ .Values.tls.certManager.issuerRef.name }}
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  subject:
    organizations:
      - {{ .Release.Name | quote }}
    organizationalUnits:
      - {{ $fullname }}
  dnsNames:
    {{- range $altNames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
