{{- $globalSecretName := printf "%s" (tpl (include "st-common.secrets.name" (dict "existingSecret" .Values.auth.existingSecret "context" $)) $) }}
apiVersion: {{ include "st-common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "st-common.names.fullname" . }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if or .Values.deploymentAnnotations .Values.commonAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
      {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
    {{- if .Values.deploymentAnnotations }}
      {{- include "st-common.tplvalues.render" (dict "value" .Values.deploymentAnnotations "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if not .Values.horizontalPodAutoscaler.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels: {{- include "st-common.labels.matchLabels" (dict "customLabels" .Values.commonLabels "context" $) | nindent 6 }}
      app.kubernetes.io/component: freeradius
  {{- if .Values.updateStrategy }}
  strategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- if or .Values.podAnnotations .Values.commonAnnotations (not .Values.existingConfigmap) (not .Values.auth.existingSecret) }}
      annotations:
        {{- if not .Values.existingConfigmap }}
        checksum/configmap-env: {{ include (print $.Template.BasePath "/configmap/envvars.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.sites.default.enabled (not .Values.sites.default.existingConfigMap) }}
        checksum/configmap-sites-default: {{ include (print $.Template.BasePath "/sites/default.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.sites.innerTunnel.enabled (not .Values.sites.innerTunnel.existingConfigMap) }}
        checksum/configmap-sites-inner-tunnel: {{ include (print $.Template.BasePath "/sites/inner-tunnel.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.sites.status.enabled (not .Values.sites.status.existingConfigMap) }}
        checksum/configmap-sites-status: {{ include (print $.Template.BasePath "/sites/status.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.sites.coa.enabled (not .Values.sites.coa.existingConfigMap) }}
        checksum/configmap-sites-coa: {{ include (print $.Template.BasePath "/sites/coa.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.sites.dhcp.enabled (not .Values.sites.dhcp.existingConfigMap) }}
        checksum/configmap-sites-dhcp: {{ include (print $.Template.BasePath "/sites/dhcp.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.tls.enabled (not .Values.sites.tls.existingConfigMap) }}
        checksum/configmap-sites-tls: {{ include (print $.Template.BasePath "/sites/tls.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.modules.eap.enabled (not .Values.modules.eap.existingConfigMap) }}
        checksum/configmap-mods-eap: {{ include (print $.Template.BasePath "/modules/eap.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.modules.pam.enabled (not .Values.modules.pam.existingConfigMap) }}
        checksum/configmap-mods-pam: {{ include (print $.Template.BasePath "/modules/pam.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.modules.pap.enabled (not .Values.modules.pap.existingConfigMap) }}
        checksum/configmap-mods-pap: {{ include (print $.Template.BasePath "/modules/pap.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.modules.sql.enabled (not .Values.modules.sql.existingConfigMap) }}
        checksum/configmap-mods-sql: {{ include (print $.Template.BasePath "/modules/sql.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.modules.rest.enabled (not .Values.modules.rest.existingConfigMap) }}
        checksum/configmap-mods-rest: {{ include (print $.Template.BasePath "/modules/rest.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.modules.json.enabled (not .Values.modules.json.existingConfigMap) }}
        checksum/configmap-mods-json: {{ include (print $.Template.BasePath "/modules/json.yaml") . | sha256sum }}
        {{- end }}
        {{- if not .Values.auth.existingSecret }}
        checksum/secret-credentials: {{ include (print $.Template.BasePath "/secret/credentials.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.modules.sql.tls.enabled .Values.modules.sql.tls.autoGenerated (not .Values.modules.sql.tls.certificatesSecret) (not .Values.modules.sql.tls.existingTlsSecret) }}
        checksum/secret-sql-tls: {{ include (print $.Template.BasePath "/secret/sql-tls.yaml") . | sha256sum }}
        {{- end }}
        {{- if include "freeradius.tls.createSecret" . }}
        checksum/secret-tls: {{ include (print $.Template.BasePath "/secret/tls.yaml") . | sha256sum }}
        {{- end }}
        {{- if include "freeradius.rest.tls.createSecret" . }}
        checksum/secret-rest-tls: {{ include (print $.Template.BasePath "/secret/rest-tls.yaml") . | sha256sum }}
        {{- end }}
        {{- if include "freeradius.eap.tlsConfig.createSecret" . }}
        checksum/secret-eap-tls: {{ include (print $.Template.BasePath "/secret/eap-tls.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.commonAnnotations }}
          {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 8 }}
        {{- end }}
        {{- if .Values.podAnnotations }}
          {{- include "st-common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 8 }}
        app.kubernetes.io/component: freeradius
        {{- if .Values.podLabels }}
          {{- include "st-common.tplvalues.render" (dict "value" .Values.podLabels "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.affinity }}
      affinity: {{- include "st-common.tplvalues.render" (dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "st-common.affinities.pods" (dict "type" .Values.podAffinityPreset "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "st-common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "context" $) | nindent 10 }}
        nodeAffinity: {{- include "st-common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- include "freeradius.image.pullSecrets" . | nindent 6 }}
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "st-common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "st-common.tplvalues.render" (dict "value" .Values.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName | quote }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      serviceAccountName: {{ include "freeradius.serviceAccountName" . }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "st-common.tplvalues.render" (dict "value" .Values.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "st-common.tplvalues.render" (dict "value" .Values.topologySpreadConstraints "context" $) | nindent 8 }}
      {{- end }}
      {{- $needsDbBootstrap := and .Values.modules.sql.enabled .Values.bootstrap.database.enabled (has .Values.modules.sql.dialect (list "mysql" "postgresql")) }}
      initContainers:
        {{- if .Values.initContainers }}
          {{- include "st-common.tplvalues.render" (dict "value" .Values.initContainers "context" $) | nindent 8 }}
        {{- end }}
        {{- /* Stage the projected virtual servers into a writable emptyDir. The
               sites source is a projected/configMap volume, which is mounted
               read-only and cannot be chmod'd; copying the files out lets us set
               the sites-enabled directory to 0711 owned by the runtime user. */}}
        - name: prepare-sites
          image: {{ include "st-common.images.image" (dict "imageRoot" .Values.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command:
            - /bin/bash
          args:
            - -ec
            - |
              printf '%s\n' "[prepare-sites] staging virtual servers into {{ .Values.sites.includeDir }}" >&2
              for f in /tmp/freeradius-sites/*; do
                [ -e "$f" ] || continue
                cp -L "$f" {{ .Values.sites.includeDir }}/
              done
              chown -R {{ .Values.containerSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.fsGroup }} {{ .Values.sites.includeDir }}
              chmod 0711 {{ .Values.sites.includeDir }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: freeradius-sites-tmp
              mountPath: /tmp/freeradius-sites
              readOnly: true
            - name: freeradius-sites
              mountPath: {{ .Values.sites.includeDir }}
        {{- if and .Values.bootstrap.volumePermissions.enabled .Values.persistence.enabled }}
        - name: volume-permissions
          image: {{ include "st-common.images.image" (dict "imageRoot" .Values.bootstrap.volumePermissions.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.bootstrap.volumePermissions.image.pullPolicy | quote }}
          command:
            - /bin/bash
          args:
            - -ec
            - |
              printf '%s\n' "[system] Change permission" >&2
              chown -R {{ .Values.containerSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.fsGroup }} {{ .Values.persistence.mountPath }}
              chmod 0711 {{ .Values.persistence.mountPath }}
          {{- if eq ( toString ( .Values.bootstrap.volumePermissions.securityContext.runAsUser )) "auto" }}
          securityContext: {{- omit .Values.bootstrap.volumePermissions.securityContext "runAsUser" | toYaml | nindent 12 }}
          {{- else }}
          securityContext: {{- .Values.bootstrap.volumePermissions.securityContext | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.bootstrap.volumePermissions.resources }}
          resources: {{- toYaml .Values.bootstrap.volumePermissions.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
              {{- if .Values.persistence.subPath }}
              subPath: {{ .Values.persistence.subPath }}
              {{- end }}
        {{- end }}
        {{- if $needsDbBootstrap }}
        - name: db-bootstrap
          image: {{ include "freeradius.bootstrap.database.image" . }}
          imagePullPolicy: {{ .Values.bootstrap.database.image.pullPolicy | quote }}
          command:
            - /bin/bash
          args:
            - -ec
            - /scripts/db-bootstrap.sh
          env:
            - name: DB_DIALECT
              value: {{ .Values.modules.sql.dialect | quote }}
            - name: DB_HOST
              value: {{ include "freeradius.sql.host" . | quote }}
            - name: DB_PORT
              value: {{ include "freeradius.sql.port" . }}
            - name: DB_NAME
              value: {{ include "freeradius.sql.name" . | quote }}
            - name: DB_USER
              value: {{ include "freeradius.sql.user" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "freeradius.sql.secretName" . }}
                  key: {{ include "freeradius.sql.secretKey" . }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" "capabilities" "readOnlyRootFilesystem" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.bootstrap.database.resources }}
          resources: {{- toYaml .Values.bootstrap.database.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: db-schema
              mountPath: /schema
              readOnly: true
            - name: scripts
              mountPath: /scripts
              subPath: db-bootstrap.sh
              readOnly: true
        {{- end }}
      containers:
        - name: freeradius
          image: {{ include "st-common.images.image" (dict "imageRoot" .Values.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- include "st-common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          {{- else if .Values.command }}
          command: {{- include "st-common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          args: {{- include "st-common.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- else if .Values.args }}
          args: {{- include "st-common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 12 }}
          {{- else }}
          args:
            - -fxx
            - -l
            - stdout
          {{- end }}
          env:
            {{- if .Values.modules.sql.enabled }}
            - name: FREERADIUS_MODS_SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                {{- if .Values.auth.existingSecretPerPassword }}
                  name: {{ tpl (include "st-common.secrets.name" (dict "existingSecret" .Values.auth.existingSecretPerPassword.databasePassword "context" $)) $ }}
                  key: {{ include "st-common.secrets.key" (dict "existingSecret" .Values.auth.existingSecretPerPassword "key" "databasePassword") }}
                {{- else }}
                  name: {{ include "freeradius.sql.secretName" . }}
                  key: {{ include "freeradius.sql.secretKey" . }}
                {{- end }}
            {{- end }}
            {{- if .Values.sites.status.enabled }}
            - name: FREERADIUS_SITES_STATUS_SECRET
              valueFrom:
                secretKeyRef:
                {{- if .Values.auth.existingSecretPerPassword }}
                  name: {{ tpl (include "st-common.secrets.name" (dict "existingSecret" .Values.auth.existingSecretPerPassword.sitesStatusSecret "context" $)) $ }}
                  key: {{ include "st-common.secrets.key" (dict "existingSecret" .Values.auth.existingSecretPerPassword "key" "sitesStatusSecret") }}
                {{- else }}
                  name: {{ $globalSecretName }}
                  key: {{ include "st-common.secrets.key" (dict "existingSecret" .Values.auth.existingSecret "key" "sites-status-secret") }}
                {{- end }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: FREERADIUS_SITES_TLS_PRIVKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                {{- if .Values.auth.existingSecretPerPassword }}
                  name: {{ tpl (include "st-common.secrets.name" (dict "existingSecret" .Values.auth.existingSecretPerPassword.sitesTlsPrivKeyPassword "context" $)) $ }}
                  key: {{ include "st-common.secrets.key" (dict "existingSecret" .Values.auth.existingSecretPerPassword "key" "sitesTlsPrivKeyPassword") }}
                {{- else }}
                  name: {{ $globalSecretName }}
                  key: {{ include "st-common.secrets.key" (dict "existingSecret" .Values.auth.existingSecret "key" "sites-tls-privkey-password") }}
                {{- end }}
            {{- end }}
            {{- if and .Values.modules.rest.enabled (ne .Values.modules.rest.auth "none") }}
            - name: FREERADIUS_MODS_REST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "freeradius.rest.secretName" . }}
                  key: {{ include "freeradius.rest.secretKey" . }}
            {{- end }}
            {{- if .Values.modules.eap.enabled }}
            - name: FREERADIUS_MODS_EAP_TLS_PRIVKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                {{- if .Values.auth.existingSecretPerPassword }}
                  name: {{ tpl (include "st-common.secrets.name" (dict "existingSecret" .Values.auth.existingSecretPerPassword.modsEapTlsPrivKeyPassword "context" $)) $ }}
                  key: {{ include "st-common.secrets.key" (dict "existingSecret" .Values.auth.existingSecretPerPassword "key" "modsEapTlsPrivKeyPassword") }}
                {{- else }}
                  name: {{ $globalSecretName }}
                  key: {{ include "st-common.secrets.key" (dict "existingSecret" .Values.auth.existingSecret "key" "mods-eap-tls-privkey-password") }}
                {{- end }}
            {{- end }}
            {{- if .Values.extraEnvVars }}
              {{- include "st-common.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "freeradius.names.envvars" . }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .Values.extraEnvVarsCM }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.extraEnvVarsSecret }}
            {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "st-common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          ports:
            - name: auth
              containerPort: {{ .Values.containerPorts.auth }}
              protocol: UDP
            - name: acct
              containerPort: {{ .Values.containerPorts.acct }}
              protocol: UDP
            {{- if .Values.sites.coa.enabled }}
            - name: coa
              containerPort: {{ .Values.containerPorts.coa }}
              protocol: UDP
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: radsec
              containerPort: {{ .Values.containerPorts.radsec }}
              protocol: TCP
            {{- end }}
            {{- if .Values.sites.status.enabled }}
            - name: status
              containerPort: {{ .Values.containerPorts.status }}
              protocol: UDP
            {{- end }}
            {{- if .Values.extraPorts }}
              {{- include "st-common.tplvalues.render" (dict "value" .Values.extraPorts "context" $) | nindent 12 }}
            {{- end }}
          {{- if not .Values.diagnosticMode.enabled }}
          {{- if .Values.customStartupProbe }}
          startupProbe: {{- include "st-common.tplvalues.render" (dict "value" .Values.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.startupProbe.enabled }}
          startupProbe: {{- include "st-common.tplvalues.render" (dict "value" (omit .Values.startupProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.customLivenessProbe }}
          livenessProbe: {{- include "st-common.tplvalues.render" (dict "value" .Values.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.livenessProbe.enabled }}
          livenessProbe: {{- include "st-common.tplvalues.render" (dict "value" (omit .Values.livenessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.customReadinessProbe }}
          readinessProbe: {{- include "st-common.tplvalues.render" (dict "value" .Values.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.readinessProbe.enabled }}
          readinessProbe: {{- include "st-common.tplvalues.render" (dict "value" (omit .Values.readinessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if .Values.resources }}
          resources: {{- include "st-common.tplvalues.render" (dict "value" .Values.resources "context" $) | nindent 12 }}
          {{- else if and .Values.resourcesPreset (ne .Values.resourcesPreset "none") }}
          resources: {{- include "st-common.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 12 }}
          {{- end }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ default "/startechnica/freeradius" .Values.persistence.mountPath }}
              {{- if .Values.persistence.subPath }}
              subPath: {{ .Values.persistence.subPath }}
              {{- end }}
            {{- if or (.Files.Glob "files/radiusd.conf") .Values.configurations .Values.configurationsConfigMap }}
            - name: freeradius-config
              mountPath: /etc/freeradius/radiusd.conf
              subPath: radiusd.conf
            {{- end }}
            {{- if or (.Files.Glob "files/docker-entrypoint-initdb.d/*.{sh,sql,sql.gz}") .Values.initdbScriptsConfigMap .Values.initdbScripts }}
            - name: custom-init-scripts
              mountPath: /docker-entrypoint-initdb.d
            {{- end }}
            {{- if .Values.modules.sql.enabled }}
            - name: freeradius-mods-sql
              mountPath: /etc/freeradius/mods-enabled/sql
              subPath: sql
            {{- end }}
            {{- if .Values.modules.rest.enabled }}
            - name: freeradius-mods-rest
              mountPath: /etc/freeradius/mods-enabled/rest
              subPath: rest
            {{- end }}
            {{- if .Values.modules.json.enabled }}
            - name: freeradius-mods-json
              mountPath: /etc/freeradius/mods-enabled/json
              subPath: json
            {{- end }}
            {{- if .Values.modules.eap.enabled }}
            - name: freeradius-mods-eap
              mountPath: /etc/freeradius/mods-enabled/eap
              subPath: eap
            {{- end }}
            {{- if .Values.modules.pam.enabled }}
            - name: freeradius-mods-pam
              mountPath: /etc/freeradius/mods-enabled/pam
              subPath: pam
            {{- end }}
            {{- if .Values.modules.pap.enabled }}
            - name: freeradius-mods-pap
              mountPath: /etc/freeradius/mods-enabled/pap
              subPath: pap
            {{- end }}
            {{- /* All virtual servers (chart sites + extraSites) staged by the
                   prepare-sites init container into a 0711 emptyDir, mounted as
                   the whole sites-enabled directory. */}}
            - name: freeradius-sites
              mountPath: {{ .Values.sites.includeDir }}
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: freeradius-tls
              mountPath: /opt/startechnica/freeradius/certs
              readOnly: true
            {{- end }}
            {{- if and .Values.modules.sql.enabled (eq .Values.modules.sql.dialect "sqlite") }}
            - name: freeradius-sqlite
              mountPath: {{ .Values.modules.sql.sqlite.filename | quote }}
            {{- end }}
            {{- if .Values.modules.sql.tls.enabled }}
            - name: freeradius-sql-tls
              mountPath: /opt/startechnica/freeradius/certs
            {{- end }}
            {{- if and .Values.modules.rest.enabled .Values.modules.rest.tls.enabled }}
            - name: freeradius-rest-tls
              mountPath: /opt/startechnica/freeradius/certs-rest
              readOnly: true
            {{- end }}
            {{- if .Values.modules.eap.enabled }}
            - name: freeradius-eap-tls
              mountPath: /opt/startechnica/freeradius/certs-eap
              readOnly: true
            {{- end }}
            - name: shared-certs
              mountPath: /opt/startechnica/freeradius/shared-certs
              readOnly: true
            - name: temp
              mountPath: /startechnica/freeradius/tmp
            {{- range .Values.extraModules }}
            - name: {{ .name }}
              mountPath: /etc/freeradius/mods-enabled/{{ .name }}
              subPath: {{ .key | default .name }}
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
              {{- include "st-common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
        {{- if .Values.sidecars }}
          {{- include "st-common.tplvalues.render" ( dict "value" .Values.sidecars "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        {{- if .Values.modules.sql.enabled }}
        - name: freeradius-mods-sql
          configMap:
            name: {{ include "freeradius.module.configMapName" (dict "module" "sql" "context" $) }}
        {{- end }}
        {{- if .Values.modules.rest.enabled }}
        - name: freeradius-mods-rest
          configMap:
            name: {{ include "freeradius.module.configMapName" (dict "module" "rest" "context" $) }}
        {{- end }}
        {{- if .Values.modules.json.enabled }}
        - name: freeradius-mods-json
          configMap:
            name: {{ include "freeradius.module.configMapName" (dict "module" "json" "context" $) }}
        {{- end }}
        {{- if .Values.modules.eap.enabled }}
        - name: freeradius-mods-eap
          configMap:
            name: {{ include "freeradius.module.configMapName" (dict "module" "eap" "context" $) }}
        {{- end }}
        {{- if .Values.modules.pam.enabled }}
        - name: freeradius-mods-pam
          configMap:
            name: {{ include "freeradius.module.configMapName" (dict "module" "pam" "context" $) }}
        {{- end }}
        {{- if .Values.modules.pap.enabled }}
        - name: freeradius-mods-pap
          configMap:
            name: {{ include "freeradius.module.configMapName" (dict "module" "pap" "context" $) }}
        {{- end }}
        {{- /* One projected volume aggregates every enabled virtual server
               (chart sites + extraSites). Each chart site ConfigMap holds a
               single key named after the site, so it is projected whole (the
               key becomes the filename); BYO and enable gating are resolved per
               source via freeradius.site.configMapName. extraSites use `items`
               since their key may differ from the path. This is read-only, so
               the `prepare-sites` init container copies it into the writable
               `freeradius-sites` emptyDir to set 0711 on sites-enabled/. */}}
        - name: freeradius-sites-tmp
          projected:
            sources:
              {{- if .Values.sites.default.enabled }}
              - configMap:
                  name: {{ include "freeradius.site.configMapName" (dict "site" "default" "context" $) }}
              {{- end }}
              {{- if .Values.sites.innerTunnel.enabled }}
              - configMap:
                  name: {{ include "freeradius.site.configMapName" (dict "site" "inner-tunnel" "key" "innerTunnel" "context" $) }}
              {{- end }}
              {{- if .Values.sites.status.enabled }}
              - configMap:
                  name: {{ include "freeradius.site.configMapName" (dict "site" "status" "context" $) }}
              {{- end }}
              {{- if .Values.sites.coa.enabled }}
              - configMap:
                  name: {{ include "freeradius.site.configMapName" (dict "site" "coa" "context" $) }}
              {{- end }}
              {{- if .Values.sites.dhcp.enabled }}
              - configMap:
                  name: {{ include "freeradius.site.configMapName" (dict "site" "dhcp" "context" $) }}
              {{- end }}
              {{- if .Values.tls.enabled }}
              - configMap:
                  name: {{ include "freeradius.site.configMapName" (dict "site" "tls" "context" $) }}
              {{- end }}
              {{- range .Values.extraSites }}
              - configMap:
                  name: {{ tpl .existingConfigMap $ }}
                  items:
                    - key: {{ .key | default .name }}
                      path: {{ .name }}
              {{- end }}
        - name: freeradius-sites
          emptyDir: {}
        {{- range .Values.extraModules }}
        - name: {{ .name }}
          configMap:
            name: {{ tpl .existingConfigMap $ }}
        {{- end }}
        - name: scripts
          configMap:
            name: {{ printf "%s-scripts" (include "st-common.names.fullname" .) }}
        - name: temp
          emptyDir: {}
        - name: shared-certs
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "freeradius.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if and .Values.modules.sql.enabled (eq .Values.modules.sql.dialect "sqlite") }}
        - name: freeradius-sqlite
          emptyDir: {}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: freeradius-tls
          secret:
            secretName: {{ include "freeradius.tls.secretName" . }}
        {{- end }}
        {{- if .Values.modules.sql.tls.enabled }}
        - name: freeradius-sql-tls
          secret:
            secretName: {{ include "freeradius.sql.tls.secretName" . }}
            items:
              - key: tls.crt
                path: sql-tls.crt
              - key: tls.key
                path: sql-tls.key
              - key: ca.crt
                path: sql-ca.crt
        {{- end }}
        {{- if and .Values.modules.rest.enabled .Values.modules.rest.tls.enabled }}
        - name: freeradius-rest-tls
          secret:
            secretName: {{ include "freeradius.rest.tls.secretName" . }}
        {{- end }}
        {{- if .Values.modules.eap.enabled }}
        - name: freeradius-eap-tls
          secret:
            secretName: {{ include "freeradius.eap.tlsConfig.secretName" . }}
        {{- end }}
        {{- if or (.Files.Glob "files/radiusd.conf") .Values.configurations .Values.configurationsConfigMap }}
        - name: freeradius-config
          configMap:
            name: {{ include "freeradius.configurationCM" . }}
        {{- end }}
        {{- if or (.Files.Glob "files/docker-entrypoint-initdb.d/*.{sh,sql,sql.gz}") .Values.initdbScriptsConfigMap .Values.initdbScripts }}
        - name: custom-init-scripts
          configMap:
            name: {{ include "freeradius.initdbScriptsCM" . }}
        {{- end }}
        {{- if and .Values.modules.sql.enabled .Values.bootstrap.database.enabled (has .Values.modules.sql.dialect (list "mysql" "postgresql")) }}
        - name: db-schema
          configMap:
            name: {{ include "freeradius.bootstrap.database.schemaConfigMapName" . }}
        {{- end }}
        {{- if .Values.extraVolumes }}
          {{- include "st-common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
