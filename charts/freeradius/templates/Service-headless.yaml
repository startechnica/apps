{{- /* Rendered only when the workload is a StatefulSet — a Deployment has no
       use for a headless sibling. Match `.Values.kind` case-insensitively,
       mirroring Application.yaml. */}}
{{- if include "freeradius.isStatefulSet" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freeradius.headlessServiceName" . }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if or (and .Values.metrics.enabled .Values.metrics.service.annotations) .Values.service.annotations .Values.commonAnnotations }}
  annotations:
    {{- if or .Values.service.annotations .Values.commonAnnotations (and .Values.metrics.enabled .Values.metrics.service.annotations) }}
    {{- $annotations := include "st-common.tplvalues.merge" ( dict "values" ( list .Values.service.annotations .Values.metrics.service.annotations .Values.commonAnnotations ) "context" . ) }}
    {{- include "st-common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  ipFamilyPolicy: {{ .Values.service.ipFamilyPolicy }}
  publishNotReadyAddresses: {{ .Values.service.headless.publishNotReadyAddresses }}
  ports:
    - name: udp-auth
      port: {{ .Values.service.ports.auth }}
      protocol: UDP
      targetPort: {{ .Values.containerPorts.auth }}
    - name: udp-acct
      port: {{ .Values.service.ports.acct }}
      protocol: UDP
      targetPort: {{ .Values.containerPorts.acct }}
    {{- if .Values.sites.coa.enabled }}
    - name: udp-coa
      port: {{ .Values.service.ports.coa }}
      protocol: UDP
      targetPort: {{ .Values.containerPorts.coa }}
    {{- end }}
    {{- if .Values.tls.enabled }}
    - name: tls-radsec
      port: {{ .Values.service.ports.radsec }}
      protocol: TCP
      targetPort: {{ .Values.containerPorts.radsec }}
    {{- end }}
    {{- if .Values.sites.status.enabled }}
    - name: udp-status
      port: {{ .Values.service.ports.status }}
      protocol: UDP
      targetPort: {{ .Values.containerPorts.status }}
    {{- end }}
  selector: {{- include "st-common.labels.matchLabels" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
{{- end }}
