{{/*
Persistent self-signed Certificate Authority shared by the chart's in-pod
RADSEC leaf (`templates/secret/tls.yaml`) and the gateway-namespace leaf
(`templates/secret/gateway-tls.yaml`). Rendered only when at least one leaf
needs a self-signed cert. Holds `ca.crt` AND `ca.key` so subsequent
`helm upgrade` runs can recover the same CA via `lookup` and re-sign new leaf
certs with it — keeping clients trusting the CA across path migrations and
routine upgrades.
*/}}
{{- $radsecSelfSigned := and .Values.tls.enabled .Values.tls.autoGenerated (not (include "freeradius.tls.useCertManager" .)) (not .Values.tls.certificatesSecret) (not .Values.tls.existingSecretName) -}}
{{- $gatewaySelfSigned := and .Values.gateway.enabled .Values.gateway.tls.enabled .Values.gateway.tls.selfSigned (not (include "freeradius.tls.useCertManager" .)) (not .Values.gateway.tls.existingSecret) (not .Values.gateway.tls.secrets) -}}
{{- if or $radsecSelfSigned $gatewaySelfSigned }}
{{- include "freeradius.tls.ca.init" . }}
{{- $ca := index $ "_freeradiusTlsCa" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "freeradius.tls.ca.secretName" . }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  ca.key: {{ $ca.Key | b64enc | quote }}
{{- end }}
