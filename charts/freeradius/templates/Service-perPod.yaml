{{- /* Per-pod Services. One Service per StatefulSet replica, each targeting
       exactly one pod via `statefulset.kubernetes.io/pod-name`. Inherits every
       knob from `.Values.service.*` except:
         - `spec.externalTrafficPolicy` is hardcoded to `Local` so the client
           source IP is preserved end-to-end (no kube-proxy SNAT); valid because
           each per-pod Service has a single backing pod, so cross-node
           dropping is the correct behaviour.
         - `spec.ports[].nodePort` is unset (auto-allocated per pod) — fixed
           NodePorts are cluster-wide, so reusing `service.nodePorts.*` across
           N Services would collide.
       Gated on `kind: StatefulSet`. Deployment / DaemonSet don't expose
       `statefulset.kubernetes.io/pod-name` (their pods are named `<name>-<rand>`
       and `<name>-<rand>` respectively), so the per-pod selector wouldn't
       match anything — the chart skips this template silently.
*/}}

{{- $kind := lower (toString (.Values.kind | default "Deployment")) -}}
{{- $replicas := int (.Values.replicaCount | default 1) -}}
{{- if and (eq $kind "statefulset") (gt $replicas 0) }}
{{- $fullname := include "st-common.names.fullname" . }}
{{- $svcNs := include "st-common.names.namespace" . }}
{{- range $i := until $replicas }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%d" $fullname $i }}
  namespace: {{ $svcNs | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
    app.kubernetes.io/pod-ordinal: {{ $i | quote }}
  {{- if or (and $.Values.metrics.enabled $.Values.metrics.service.annotations) $.Values.service.annotations $.Values.commonAnnotations }}
  annotations:
    {{- if or $.Values.service.annotations $.Values.commonAnnotations (and $.Values.metrics.enabled $.Values.metrics.service.annotations) }}
    {{- $annotations := include "st-common.tplvalues.merge" ( dict "values" ( list $.Values.service.annotations $.Values.metrics.service.annotations $.Values.commonAnnotations ) "context" $ ) }}
    {{- include "st-common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ default "ClusterIP" $.Values.service.type }}
  {{- if eq $.Values.service.type "LoadBalancer" }}
  allocateLoadBalancerNodePorts: {{ eq $.Values.service.allocateLoadBalancerNodePorts "true" }}
  {{- end }}
  {{- if or (eq $.Values.service.type "LoadBalancer") (eq $.Values.service.type "NodePort") }}
  #  Hardcoded to `Local` for per-pod Services so the client source IP is
  #  preserved end-to-end (no kube-proxy SNAT). Each per-pod Service has a
  #  single backing pod, so cross-node dropping is the correct behaviour.
  externalTrafficPolicy: "Local"
  {{- end }}
  ipFamilyPolicy: {{ $.Values.service.ipFamilyPolicy }}
  {{- if and (eq $.Values.service.type "LoadBalancer") (not (empty $.Values.service.loadBalancerClass)) }}
  loadBalancerClass: {{ $.Values.service.loadBalancerClass }}
  {{- end }}
  {{- if and (eq $.Values.service.type "LoadBalancer") (not (empty $.Values.service.loadBalancerSourceRanges)) }}
  loadBalancerSourceRanges: {{- toYaml $.Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if $.Values.service.sessionAffinity }}
  sessionAffinity: {{ $.Values.service.sessionAffinity }}
  {{- end }}
  {{- if $.Values.service.sessionAffinityConfig }}
  sessionAffinityConfig: {{- include "st-common.tplvalues.render" (dict "value" $.Values.service.sessionAffinityConfig "context" $) | nindent 4 }}
  {{- end }}
  ports:
    {{- include "freeradius.service.portsList" (dict "context" $ "suppressNodePorts" true) | nindent 4 }}
  selector: {{- include "st-common.labels.matchLabels" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
    statefulset.kubernetes.io/pod-name: {{ printf "%s-%d" $fullname $i | quote }}
{{- end }}
{{- end }}
