{{- if and .Values.gateway.enabled (eq .Values.gateway.implementation "gateway-api") .Values.gateway.udpRoute.enabled -}}
{{- $apiVersion := include "st-common.capabilities.networkingGatewayUDPRoute.apiVersion" . -}}
{{- if not (eq $apiVersion "false") -}}
{{- $svcNs := include "st-common.names.namespace" . -}}
{{- $override := .Values.gateway.udpRoute.parentRefs -}}
{{- /* backendRefs fan out to one entry per StatefulSet replica when
       kind: StatefulSet (each replica's per-pod Service from
       Service-perPod.yaml, equal weight). Deployment / DaemonSet keep a single
       backendRef targeting the main load-balanced Service. */ -}}
apiVersion: {{ $apiVersion }}
kind: UDPRoute
metadata:
  name: {{ printf "%s-auth" (include "st-common.names.fullname" .) }}
  namespace: {{ $svcNs | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- include "freeradius.gateway.routeParentRefs" (dict "parentRefs" $override "sectionName" "auth" "context" $) | nindent 4 }}
  rules:
    - backendRefs:
        {{- include "freeradius.gateway.backendRefs" (dict "context" $ "port" .Values.service.ports.auth) | nindent 8 }}
---
apiVersion: {{ $apiVersion }}
kind: UDPRoute
metadata:
  name: {{ printf "%s-acct" (include "st-common.names.fullname" .) }}
  namespace: {{ $svcNs | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- include "freeradius.gateway.routeParentRefs" (dict "parentRefs" $override "sectionName" "acct" "context" $) | nindent 4 }}
  rules:
    - backendRefs:
        {{- include "freeradius.gateway.backendRefs" (dict "context" $ "port" .Values.service.ports.acct) | nindent 8 }}
{{- if .Values.sites.coa.enabled }}
---
apiVersion: {{ $apiVersion }}
kind: UDPRoute
metadata:
  name: {{ printf "%s-coa" (include "st-common.names.fullname" .) }}
  namespace: {{ $svcNs | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  parentRefs: {{- include "freeradius.gateway.routeParentRefs" (dict "parentRefs" $override "sectionName" "coa" "context" $) | nindent 4 }}
  rules:
    - backendRefs:
        {{- include "freeradius.gateway.backendRefs" (dict "context" $ "port" .Values.service.ports.coa) | nindent 8 }}
{{- end }}
{{- end -}}
{{- end -}}
