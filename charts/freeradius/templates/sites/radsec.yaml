{{- if and .Values.tls.enabled (not .Values.sites.radsec.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-sites-radsec" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  radsec: |
    # radsec virtual server

    listen {

        ipaddr = {{ .Values.sites.radsec.listen.ipaddr }}
        port = {{ .Values.containerPorts.radsec }}

        type = {{ .Values.sites.radsec.listen.type }}
        proto = tcp
        virtual_server = {{ .Values.sites.radsec.listen.virtual_server }}
        clients = radsec
        {{- /* `gateway.proxyProtocol: true` ALSO forces this directive on,
               since it renders an Envoy BackendTrafficPolicy that prepends
               PROXY v1 — accepting PROXY here is mandatory or RADSEC breaks. */}}
        {{- if or .Values.sites.radsec.listen.proxy_protocol .Values.gateway.proxyProtocol }}
        proxy_protocol = yes
        {{- end }}
        {{- if .Values.sites.radsec.listen.check_client_connections }}
        check_client_connections = yes
        {{- end }}

        limit {
            max_connections = 16
            lifetime = 0
            idle_timeout = 30
        }

        tls {
            {{- if .Values.sites.radsec.tls.private_key_password }}
            private_key_password = $ENV{FREERADIUS_SITES_RADSEC_PRIVKEY_PASSWORD}
            {{- end }}
            private_key_file = {{ include "freeradius.tls.certKeyPath" . }}

            # allow_expired_crl = no

            certificate_file = {{ include "freeradius.tls.certPath" . }}
            ca_file = {{ include "freeradius.tls.caCertPath" . }}

            # dh_file = ${certdir}/dh

            # random_file = /dev/urandom

            fragment_size = 8192

            # include_length = yes

            # check_crl = yes
            ca_path = ${cadir}
            ca_path_reload_interval = 3600

            # check_cert_issuer = "/C=GB/ST=Berkshire/L=Newbury/O=My Company Ltd"
            # check_cert_cn = %{User-Name}
            #
            cipher_list = {{ include "freeradius.utils.joinOrDefault" (dict "list" .Values.sites.radsec.tls.cipher_list "sep" ":" "default" "DEFAULT") }}
            cipher_server_preference = no

            tls_min_version = "1.2"
            tls_max_version = "1.3"

            cache {
                enable = no
                lifetime = 24 # hours

                # name = "TLS ${..ipaddr} ${..port} ${..proto}"

                # persist_dir = "${logdir}/tlscache"
            }

            require_client_cert = yes

            verify {
                # tmpdir = /tmp/radiusd
                # tmpdir = /startechnica/freeradius/tmp

                # client = "/path/to/openssl verify -CApath ${..ca_path} %{TLS-Client-Cert-Filename}"
            }
        }
    }

    clients radsec {
        client 127.0.0.1 {
            ipaddr = 127.0.0.1
            proto = tls

            secret = $ENV{FREERADIUS_CLIENTS_RADSEC_SECRET}
        }

        {{- /* Same v4+v6 single-block bug as `clients.conf` — emit two sibling
               blocks when both `ipaddr` (v4) and `ipv6addr` are set
               (`<name>` and `<name>_v6`). See [freeradius.clientBlockBody]
               in `_helpers.tpl` for the rationale (FreeRADIUS client blocks
               hold one address each; the second silently overrides the first). */}}
        {{- range .Values.sites.radsec.clients }}
        {{- $hasV4 := and .ipaddr (ne .ipaddr "") -}}
        {{- $hasV6 := and .ipv6addr (ne .ipv6addr "") -}}
        {{- $c := . }}
        {{- if $hasV4 }}
        client {{ .name }} {
            ipaddr = {{ .ipaddr | quote }}
            {{- include "freeradius.radsecClientBlockBody" $c | nindent 12 }}
        }
        {{- end }}
        {{- if $hasV6 }}
        client {{ if $hasV4 }}{{ printf "%s_v6" .name }}{{ else }}{{ .name }}{{ end }} {
            ipv6addr = {{ .ipv6addr | quote }}
            {{- include "freeradius.radsecClientBlockBody" $c | nindent 12 }}
        }
        {{- end }}
        {{- end }}
    }
{{- end }}
