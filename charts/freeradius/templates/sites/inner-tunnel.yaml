{{- if and .Values.sites.innerTunnel.enabled (not .Values.sites.innerTunnel.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-sites-inner-tunnel" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  inner-tunnel: |-
    ######################################################################
    #
    #    This is a virtual server that handles *only* inner tunnel
    #    requests for EAP-TTLS and PEAP types.
    #
    ######################################################################

    server inner-tunnel {

        listen {
            ipaddr = 127.0.0.1
            port = 18120
            type = auth
        }

        authorize {
            filter_username
        #    filter_inner_identity
            chap
            mschap
        #    unix
        #    IPASS
            suffix
        #    ntdomain

            update control {
                &Proxy-To-Realm := LOCAL
            }

            eap {
                ok = return
            }

            {{ if .Values.modules.files.enabled }}
            files
            {{- end }}
            {{ if .Values.modules.sql.enabled }}
            -sql
            {{- end }}
        #    smbpasswd
            {{ if .Values.modules.ldap.enabled }}
            -ldap
            {{- end }}
        #    daily
            expiration
            logintime

            {{- if .Values.modules.oidc.enabled }}
            {{- $oidcResolved := include "freeradius.oidc.resolveInstances" . | fromYaml }}
            {{- $oidcArms := (include "freeradius.oidc.dispatchArms" .) | fromYaml }}
            {{- $oidcHasDefault := hasKey $oidcResolved.instances "default" }}
            {{- $oidcWireDefault := and $oidcHasDefault .Values.modules.oidc.wireDefaultSite }}
            {{- if $oidcArms.arms }}
            #  OIDC multi-instance dispatch — mirrors the block in `sites/default`.
            #  Inside an EAP-TTLS / PEAP tunnel `Packet-Src-IP-Address` /
            #  `Packet-Src-IPv6-Address` still reflect the *outer* NAS (RFC 5281
            #  §11.2), so the same `clients.<x>.oidc: <instance>` binding routes
            #  tunnelled inner-auth to the matching `oidc_<name>_authorize` policy.
            {{- range $i, $arm := $oidcArms.arms }}
            {{- $cond := list -}}
            {{- if $arm.ipv4 }}{{- $cond = append $cond (printf "Packet-Src-IP-Address == %s" ($arm.ipv4 | quote)) -}}{{- end -}}
            {{- if $arm.ipv6 }}{{- $cond = append $cond (printf "Packet-Src-IPv6-Address == %s" ($arm.ipv6 | quote)) -}}{{- end }}
            {{ if $i }}elsif{{ else }}if{{ end }} ({{ join " || " $cond }}) {
                {{ include "freeradius.oidc.policyName" (dict "name" $arm.instance) }}
            }
            {{- end }}
            {{- if $oidcWireDefault }}
            else {
                #  Default OIDC instance — catches NAS without an explicit
                #  `clients.<x>.oidc` binding (wireDefaultSite: true).
                oidc_authorize
            }
            {{- else if .Values.modules.oidc.unmatchedReject }}
            else {
                #  No matching instance and no default fallback — reject
                #  (`modules.oidc.unmatchedReject: true`).
                reject
            }
            {{- end }}
            {{- else if $oidcWireDefault }}
            #  OIDC: only the default instance is wired (no `clients.*` has an
            #  `oidc:` binding). Calls `oidc_authorize` directly.
            oidc_authorize
            {{- end }}
            {{- end }}
            pap
        }

        authenticate {

            Auth-Type PAP {
                pap
            }

            Auth-Type CHAP {
                chap
            }

            Auth-Type MS-CHAP {
                mschap
            }

            mschap
        #    pam

            #    Auth-Type LDAP {
            #        ldap
            #    }

            eap
        }

        session {
            radutmp
        #    sql
        }

        #  Post-Authentication
        post-auth {
        #   cui-inner

        #    update outer.session-state {
        #           User-Name := &User-Name
        #    }

        #    reply_log
            -sql
        #    ldap
        #    moonshot_host_tid
        #    moonshot_realm_tid
        #    moonshot_coi_tid

            if (0) {
                update reply {
                    User-Name !* ANY
                    Message-Authenticator !* ANY
                    EAP-Message !* ANY
                    Proxy-State !* ANY
                    MS-MPPE-Encryption-Types !* ANY
                    MS-MPPE-Encryption-Policy !* ANY
                    MS-MPPE-Send-Key !* ANY
                    MS-MPPE-Recv-Key !* ANY
                }

                update {
                    &outer.session-state: += &reply:
                }
            }

            Post-Auth-Type REJECT {
                -sql
                attr_filter.access_reject

                update outer.session-state {
                    &Module-Failure-Message := &request:Module-Failure-Message
                }
            }
        }

        pre-proxy {
        #    files
        #    attr_filter.pre-proxy
        #    pre_proxy_log
        }

        post-proxy {
        #    post_proxy_log
        #    attr_filter.post-proxy
            eap
        }

    } # inner-tunnel server block
{{- end }}
