{{- if and .Values.tls.enabled (not .Values.sites.tls.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-sites-tls" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  tls: |
    # RADIUS over TLS (radsec)

    listen {

    		# ipaddr = $ENV{FREERADIUS_SITES_TLS_LISTEN}
    		ipaddr = *
    		port = {{ .Values.containerPorts.radsec }}

    		type = auth+acct
    		proto = tcp
    		virtual_server = default
    		clients = radsec

    #       proxy_protocol = no

    #       check_client_connections = yes

    		limit {
    			  max_connections = 16
    			  lifetime = 0
    			  idle_timeout = 30
    		}

    		tls {
    				{{- if .Values.sites.tls.privateKeyPassword }}
    				private_key_password = $ENV{FREERADIUS_SITES_TLS_PRIVKEY_PASSWORD}
    				{{- end }}
    				private_key_file = {{ include "freeradius.tls.certKeyPath" . }}

    		#       allow_expired_crl = no

    				certificate_file = {{ include "freeradius.tls.certPath" . }}
    				ca_file = {{ include "freeradius.tls.caCertPath" . }}

    				# dh_file = ${certdir}/dh

    				# random_file = /dev/urandom

    				fragment_size = 8192

    		#       include_length = yes

    		#       check_crl = yes
    				ca_path = ${cadir}
    				ca_path_reload_interval = 3600

    		#       check_cert_issuer = "/C=GB/ST=Berkshire/L=Newbury/O=My Company Ltd"

    		#       check_cert_cn = %{User-Name}
    		#
    				cipher_list = {{ default "DEFAULT" .Values.sites.tls.cipher }}
    				cipher_server_preference = no

    				tls_min_version = "1.2"
    				tls_max_version = "1.3"

    				cache {
    					  enable = no
    					  lifetime = 24 # hours

    					  #name = "TLS ${..ipaddr} ${..port} ${..proto}"

    					  #persist_dir = "${logdir}/tlscache"
    				}

    				require_client_cert = yes

    				verify {
    		#               tmpdir = /tmp/radiusd
    						# tmpdir = /startechnica/freeradius/tmp

    		#               client = "/path/to/openssl verify -CApath ${..ca_path} %{TLS-Client-Cert-Filename}"
    				}
    		}
    }

    clients radsec {
    		client 127.0.0.1 {
    			ipaddr = 127.0.0.1
    			proto = tls

    			# secret = radsec
    			secret = $ENV{FREERADIUS_CLIENTS_RADSEC_SECRET}
    		}
    }

    home_server tls {
    		ipaddr = 127.0.0.1
    		port = {{ .Values.containerPorts.radsec }}

    		type = auth
    		secret = radsec
    		proto = tcp
    		status_check = none

    		tls {
    		#       hostname = "example.com"

    				{{- if .Values.sites.tls.privateKeyPassword }}
    				private_key_password = $ENV{FREERADIUS_SITES_TLS_PRIVKEY_PASSWORD}
    				{{- end }}
    				# private_key_file = ${certdir}/client.pem
    				private_key_file = {{ include "freeradius.tls.certKeyPath" . }}

    				# certificate_file = ${certdir}/client.pem
    				certificate_file = {{ include "freeradius.tls.certPath" . }}
    				ca_file = {{ include "freeradius.tls.caCertPath" . }}

    		#       psk_query = "%{psksql:select hex(key) from psk_keys where keyid = '%{TLS-PSK-Identity}'}"

    		#		dh_file = ${certdir}/dh
    				random_file = /dev/urandom

    				fragment_size = 8192

    		#       include_length = yes

    		#       check_crl = yes
    				ca_path = ${cadir}

    		#		check_cert_issuer = "/C=GB/ST=Berkshire/L=Newbury/O=My Company Ltd"

    		#       check_cert_cn = %{User-Name}
    		#
    				cipher_list = {{ default "DEFAULT" .Values.sites.tls.cipher }}
    		}

    }

    home_server_pool tls {
    	type = fail-over
    	home_server = tls
    }

    realm tls {
    	auth_pool = tls
    }
{{- end }}
