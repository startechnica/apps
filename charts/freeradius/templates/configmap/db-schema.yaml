{{/*
FreeRADIUS rlm_sql schema ConfigMap. Sourced from `files/schema/<dialect>.sql`
and loaded into the configured database by the `db-bootstrap` init container
on the FreeRADIUS pod (see Deployment.yaml). The upstream schema files are
shipped with the chart at `files/schema/{mysql,postgresql,sqlite}.sql`.

Skipped when:
  - SQL backend is disabled (`modules.sql.enabled: false`)
  - the bootstrap mechanism is turned off (`bootstrap.database.enabled: false`)
  - the user is bringing their own schema ConfigMap (`bootstrap.database.schemaConfigMap`)
  - the dialect's schema file doesn't ship with the chart (e.g. sqlite is
    bootstrapped by the SQLite driver itself at first write, so no separate
    schema load is needed)
*/}}
{{- $dialect := .Values.modules.sql.dialect -}}
{{- $schemaPath := printf "files/schema/%s.sql" $dialect -}}
{{- if and .Values.modules.sql.enabled .Values.bootstrap.database.enabled (not .Values.bootstrap.database.schemaConfigMap) (.Files.Glob $schemaPath) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "freeradius.bootstrap.database.schemaConfigMapName" . }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  schema.sql: |
{{ .Files.Get $schemaPath | indent 4 }}
{{- end }}
