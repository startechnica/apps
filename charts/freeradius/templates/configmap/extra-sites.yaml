{{- /* One ConfigMap + volume per `extraSites` entry. The entry `name` is the
       data key, the volume name (see Deployment.yaml), and the on-disk filename
       mounted at sites-enabled/<name> via subPath. Content is verbatim (no tpl). */}}
{{- range .Values.extraSites }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-site-%s" (include "st-common.names.fullname" $) .name }}
  namespace: {{ include "st-common.names.namespace" $ | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" $.Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  {{ .name }}: |
{{ .config | indent 4 }}
{{- end }}
