apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-modules" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
{{- if .Values.modules.sql.enabled }}
{{ (.Files.Glob "files/modules/sql").AsConfig | indent 2 }}
{{- end }}
{{- if .Values.modules.rest.enabled }}
{{ (.Files.Glob "files/modules/rest").AsConfig | indent 2 }}
{{- end }}
{{- if .Values.modules.json.enabled }}
  {{- /* json is rendered through `tpl`: the encode{} block structure is fixed
         and its leaf directives are bound to `modules.json.encode.*`. */}}
  json: |
{{ tpl (.Files.Get "files/modules/json") $ | indent 4 }}
{{- end }}
{{- if .Values.modules.pam.enabled }}
  {{- /* pam is rendered through `tpl` so every key under `modules.pam`
         (except `enabled`) is emitted into the pam block. */}}
  pam: |
{{ tpl (.Files.Get "files/modules/pam") $ | indent 4 }}
{{- end }}
{{- if .Values.modules.eap.enabled }}
  {{- /* eap is rendered through `tpl` so Helm directives inside
         files/modules/eap are evaluated. Secret values stay as `$ENV{}`
         (injected from a Secret at runtime, never baked into this ConfigMap).
         The other module files are loaded verbatim via AsConfig because they
         are vendored upstream configs that may contain literal `{{`. */}}
  eap: |
{{ tpl (.Files.Get "files/modules/eap") $ | indent 4 }}
{{- end }}
