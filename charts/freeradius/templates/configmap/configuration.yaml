{{/*
Chart-rendered FreeRADIUS `radiusd.conf` ConfigMap. Materialised when the user
supplies inline configuration via `.Values.configurations` OR when an opt-in
`files/radiusd.conf` is bundled with the chart. Skipped when the user is
bringing their own ConfigMap via `.Values.configurationsConfigMap` — that path
short-circuits via the `freeradius.configurationCM` helper, so the Deployment's
volume points at the user-supplied resource and this template renders nothing.
*/}}
{{- if and (or .Values.configurations (.Files.Glob "files/radiusd.conf")) (not .Values.configurationsConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-configurations" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: freeradius
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  radiusd.conf: |
    {{- if .Values.configurations }}
    {{- include "st-common.tplvalues.render" (dict "value" .Values.configurations "context" $) | nindent 4 }}
    {{- else }}
    {{- .Files.Get "files/radiusd.conf" | nindent 4 }}
    {{- end }}
{{- end }}
