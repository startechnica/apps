annotations:
  category: AccessManagement
  artifacthub.io/images: |
    - name: freeradius
      image: docker.io/freeradius/freeradius-server:3.2.8
  artifacthub.io/changes: |
    - kind: changed
      description: "1.1.0 major release — values.yaml restructured, TLS/cert-manager keys consolidated, gateway-api stack adapted for RADIUS (UDPRoute/TLSRoute), bundled PostgreSQL subchart added alongside MariaDB, REST/JSON/PAM/PAP modules, top-level keys cleaned up (modsEnabled→modules, sitesEnabled→sites, database.bootstrap→bootstrap.database); see CHANGELOG.md and README §Upgrading for migration."
apiVersion: v2
appVersion: 3.2.8
dependencies:
  - name: st-common
    repository: https://startechnica.github.io/apps
    version: 0.1.21
    alias: startechnica-common
  - name: mariadb
    condition: mariadb.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 20.5.9
  - name: postgresql
    condition: postgresql.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 16.7.27
  - name: redis
    condition: redis.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 25.5.3
description: FreeRADIUS is a modular, high performance free RADIUS suite developed and
  distributed under the GNU General Public License, version 2, and is free for download and use.
home: https://github.com/startechnica/apps/tree/main/charts/freeradius
icon: https://freeradius.org/img/wordmark.svg
keywords:
  - freeradius
  - radius
  - radsec
  - mysql
  - postgresql
  - ldap
kubeVersion: ">=1.24.0-0"
maintainers:
  - name: firmansyahn
    email: firmansyah@nainggolan.id
    url: https://firmansyah.nainggolan.id
name: freeradius
sources:
  - https://freeradius.org/
  - https://github.com/FreeRADIUS/freeradius-server
  - https://github.com/startechnica/apps.git
type: application
version: 1.1.0
