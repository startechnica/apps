annotations:
  category: AccessManagement
  artifacthub.io/images: |
    - name: freeradius
      image: docker.io/freeradius/freeradius-server:3.2.8
  artifacthub.io/changes: |
    - kind: added
      description: "**Generic OIDC authentication module** — `modules.oidc.*` replaces the dedicated Keycloak module (now removed). Configure any number of provider-agnostic backends (Keycloak, Authentik, Azure AD, Auth0, Okta, …) under `modules.oidc.instances.<name>` with `tokenUrl` (required), optional `introspectUrl`, OAuth2 client credentials, TLS material, and claim-path config. NAS-to-backend binding via `clients.<x>.oidc: <name>` renders an `if (Packet-Src-IP-Address == …)` dispatch chain into `sites/default` + `sites/inner-tunnel`."
    - kind: added
      description: "Per-instance OIDC features: `roleMappings` / `groupMappings` (unlang reply mapping keyed off `rolesClaim` / `groupsClaim`), `attributeMappings` (generic JWT-claim → reply engine — reply attrs added to cache `update {}` so hits preserve them), `require` (truthy-claim guard list, e.g. `[email_verified]`), `introspect` (RFC 7662 vs local JWT-payload decode — catches revocation), `refreshTokenCache` (cache-aside with refresh-token freshness check on cache hit, rendered as a second `oidc_<name>_validate` rlm_python3 instance the policy calls)."
    - kind: added
      description: "Per-instance OIDC K8s resources: one module ConfigMap (`<fullname>-oidc[-<name>]` → `mods-enabled/oidc[_<name>]`), one policy ConfigMap (`<fullname>-oidc[-<name>]-policy` → `policy.d/oidc[_<name>]`), one client-secret Secret (skipped under `existingSecret`), one TLS CA Secret (skipped under `tls.existingSecret`); per-instance TLS mount at `/etc/freeradius/certs-oidc[-<name>]/ca.crt`; `client_secret` rides in via `FREERADIUS_OIDC[_<NAME>]_CLIENT_SECRET` env."
    - kind: added
      description: "Single shared `<fullname>-oidc-python` ConfigMap holds the per-instance rlm_python3 wrapper scripts (one data key per instance: `oidc_default.py`, `oidc_<name>.py`); the shared `oidc.py` library (pure logic, no env reads, no module-level config) lives in `<fullname>-oidc-py` and is mounted alongside under `python_path`. Wrappers delegate to `oidc.{authorize,accounting,validate}` over a `_CONFIG` dict baked in at chart-render time."
    - kind: added
      description: "`cache oidc[_<name>]_cache` rlm_cache instance per OIDC instance whose `cache.enabled: true`, namespaced cache key `oidc:<name>:%{User-Name}` (non-overridable) to prevent cross-instance cache hits on common usernames."
    - kind: added
      description: "OIDC namespacing helpers `freeradius.oidc.{resolveInstances, envVarPrefix, moduleName, validateModuleName, policyName, rolesPolicyName, groupsPolicyName, modKey, policyKey, scriptKey, cacheName, cacheKey, dispatchArms, clientSecretName, tlsVolumeName, tls.{enabled,createSecret,secretName,caKey,caFilePath}}` — single source of truth for the legacy-default-vs-named naming split."
    - kind: added
      description: "`freeradius.validate.oidcInstances` + `freeradius.validate.oidcClientBindings` — per-instance schema validation (`tokenUrl` required, `introspect: true` requires `introspectUrl` and a client secret, `refreshTokenCache: true` requires `cache.enabled: true` and a Redis backend, `roleMappings` requires `rolesClaim`, name regex, TLS-caCert/existingSecret exclusivity, `extraEnvVars` must not shadow the per-instance env-var prefix) plus a typo guard on every `clients.<x>.oidc`."
    - kind: added
      description: "Bundled Redis subchart (Bitnami, `condition: redis.enabled`) as an optional backend for the redis/cache modules; auto-targets `<release>-redis-master`, pulls password from the subchart Secret."
    - kind: added
      description: "`templates/modules/redis.yaml` + `modules.redis.*` — rlm_redis module (`%{redis:...}` xlat) rendered as `<fullname>-mods-redis`, mounted at `mods-enabled/redis`, with config-checksum annotation for rollout-on-change."
    - kind: added
      description: "`templates/modules/cache.yaml` + `modules.cache.*` — standalone rlm_cache module with pluggable `driver` (`rbtree` / `redis` / `memcached`), required `update {}` validated by `freeradius.validate.cache`."
    - kind: added
      description: "NetworkPolicy egress to the Redis backend on `modules.redis.port`, rendered when rlm_redis or the redis-driver cache is enabled (skipped under `networkPolicy.allowExternalEgress`)."
    - kind: added
      description: "`templates/Issuer.yaml` — self-signed CA chain bootstrapped via cert-manager (self-signed Issuer → CA Certificate → CA Issuer) when the chart issues via cert-manager and no external `tls.certManager.issuerRef.name` is supplied."
    - kind: added
      description: "`tls.certManager.ca.{commonName,duration,renewBefore,secretName}` — tuning knobs for the bootstrapped CA. `freeradius.tls.useCertManager` helper is the single source of truth for the cert-manager vs genCA branch."
    - kind: added
      description: "`templates/gateway-api/EnvoyProxy.yaml` — JSON access-log format on the chart-managed EnvoyProxy CR: bytes received/sent, duration, client IP, method/path, headers, response code/flags, upstream host. Renders by default under `gateway.infrastructure: envoy`."
    - kind: added
      description: "`values.schema.json` — type-only JSON Schema draft-07 ships with the chart so `helm install/template/lint` catches gross value-type mismatches at submit time."
    - kind: added
      description: "`.helmignore` — excludes the schema regen helper (`.gen-*.py`), `ci/` render fixtures, and Claude-side artifacts (`.claude/`, `CLAUDE.md`) from the packaged chart."
    - kind: changed
      description: "`sites/coa.yaml` refactored to listen-inside-server (modern FR 3.x style matching `default`/`inner-tunnel`/`status`/`dhcp`). Drops over-flexible knobs `sites.coa.listen.type` (only `coa` is valid) and `sites.coa.listen.virtual_server` (must match `sites-enabled/coa`); `sites.coa.listen.ipaddr` kept."
    - kind: changed
      description: "**BREAKING** — RADSEC site renamed `tls` → `radsec` end-to-end: `templates/sites/tls.yaml` → `templates/sites/radsec.yaml`, ConfigMap `<r>-sites-tls` → `<r>-sites-radsec`, data key + mount path `tls` → `radsec`, FreeRADIUS-internal `home_server tls` / `home_server_pool tls` / `realm tls` blocks renamed; `sites.tls.*` values → `sites.radsec.*`; Secret key `sites-tls-privkey-password` → `sites-radsec-privkey-password`; env `FREERADIUS_SITES_TLS_PRIVKEY_PASSWORD` → `FREERADIUS_SITES_RADSEC_PRIVKEY_PASSWORD`; BYO key `sitesTlsPrivKeyPassword` → `sitesRadsecPrivKeyPassword`. Top-level `tls.*` (cert material switch) untouched; `sites.tlsCache` (EAP session-cache site) untouched."
    - kind: changed
      description: "`st-common` dependency moved from the GitHub Pages HTTP repo to the GHCR OCI registry (`oci://ghcr.io/startechnica/charts`) — aligns with the chart's own publish path and removes the Pages-index round-trip."
    - kind: changed
      description: "**BREAKING** — cert-manager is now used automatically whenever its API is detected on the cluster; the chart falls back to the in-template genCA path only when the API is absent. There is no toggle to force the genCA path on a cluster where cert-manager is installed — to opt out for a given release, pre-create a Secret and set `tls.certificatesSecret`. The `validate.tls` hard-fail is removed (auto-generation handles every case); `validate.eap` keeps the `methods` / `defaultType` checks but drops the `tlsConfig` cert-source clause."
    - kind: changed
      description: "`tls.certManager.issuerRef.name` now defaults to `\"\"` (was `selfsigned-issuer`); empty bootstraps a chart-managed CA, set it to use a pre-existing Issuer/ClusterIssuer."
    - kind: changed
      description: "**BREAKING** — TLS auto-generation is now implicit whenever the matching feature is enabled (`tls.enabled`, `modules.eap.enabled`, `modules.sql.tls.enabled`) and no `*certificatesSecret` / `*certificates_secret` is supplied. The previous opt-in toggles (`tls.autoGenerated`, `modules.sql.tls.autoGenerated`, `modules.eap.tlsConfig.autoGenerated`) are no longer consulted. To opt out, set the corresponding `*certificatesSecret` / `*certificates_secret`."
    - kind: changed
      description: "Replaced the env-vars ConfigMap with a Secret (`templates/secrets/envvars.yaml`), dropped unused `FREERADIUS_ENABLE_TLS` / `FREERADIUS_SITES_NAMESPACE` keys; Deployment `envFrom` switches to `secretRef` for chart-managed env vars."
    - kind: removed
      description: "**BREAKING** — Dedicated Keycloak module removed end-to-end. The 1.1.0 top-level `keycloak.{enabled,mode,url,realm,clientId,clientSecret,scope,connectTimeout,roleAttribute,roleMapper,denyWithoutRole,roleMappings,tls.*,cache.*}` block is gone, along with `templates/modules/mods-config/keycloak/configmap-{lua,policy,rest}.yaml`, all `freeradius.keycloak.*` helpers, `freeradius.validate.keycloak*` validators, the `KC_*` / `FREERADIUS_KEYCLOAK_*` env-var injection, and the `clients.<x>.keycloak` NAS binding. Migrate to the new generic `modules.oidc.*` module — same JWT/ROPC flow against any OIDC provider, plus `groupMappings` / `attributeMappings` / `require` / `introspect` / `refreshTokenCache`. NAS binding is now `clients.<x>.oidc: <name>`."
    - kind: removed
      description: "**BREAKING** — `lua` mapper-script mode removed. The 1.1.0 chart accepted `keycloak.mode: lua` via rlm_lua, but rlm_lua is not bundled in `freeradius/freeradius-server:3.2.8`; the new `modules.oidc.*` module is rlm_python3-only."
    - kind: removed
      description: "**BREAKING** — `keycloak.mode: rest` removed. `python` mode was a strict superset (same ROPC POST + JWT-decode for role extraction, via the bundled rlm_python3) so the rest variant added nothing but config surface; gone along with the dedicated Keycloak module."
    - kind: deprecated
      description: "TLS auto-generation toggles `tls.autoGenerated`, `tls.certManager.create`, `modules.sql.tls.autoGenerated`, `modules.eap.tlsConfig.autoGenerated` — all four still accepted, no longer consulted. NOTES.txt fires a deprecation advisory when any is set to a non-default value; all four removed in the next major."
    - kind: fixed
      description: "Certificate / Issuer templates no longer emit an invalid `apiVersion: false` manifest when the cert-manager API is absent — gates now test `freeradius.tls.useCertManager` explicitly."
    - kind: fixed
      description: "`templates/configmaps/clients.yaml` no longer fails to render when `clients` carries non-client scalar keys (`includeFile`, `existingConfigMapName`) — non-map entries are skipped via `kindIs \"map\"`."
    - kind: fixed
      description: "`image.debug` (previously documented but unwired) now gates the container args between `-f` (normal) and `-fxx` (debug), so FreeRADIUS no longer starts in verbose debug mode by default."
    - kind: fixed
      description: "Added a writable `emptyDir` at `/var/run/radiusd` so the daemon can write its pidfile under `readOnlyRootFilesystem: true`."
