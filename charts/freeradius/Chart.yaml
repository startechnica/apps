annotations:
  category: AccessManagement
  artifacthub.io/images: |
    - name: freeradius
      image: docker.io/freeradius/freeradius-server:3.2.8
  artifacthub.io/changes: |
    - kind: added
      description: "Keycloak per-instance shared-library extensions — `groupMappings` (mirror of roleMappings keyed off the `groups` claim), `require` (JWT-claim guard list), `attributeMappings` (generic claim→reply engine), `introspect` (RFC 7662 introspection in place of local JWT decode), and `refreshTokenCache` (cache-hit freshness check via `grant_type=refresh_token`, second module instance `keycloak_<name>_validate`); see CHANGELOG.md §1.2.0."
apiVersion: v2
appVersion: 3.2.8
dependencies:
  - name: st-common
    repository: https://startechnica.github.io/apps
    version: 0.1.21
    alias: startechnica-common
  - name: mariadb
    condition: mariadb.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 20.5.9
  - name: postgresql
    condition: postgresql.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 16.7.27
  - name: redis
    condition: redis.enabled
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 25.5.3
