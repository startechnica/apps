annotations:
  licenses: Apache-2.0
  images: |
    - name: netbox
      image: docker.io/netboxcommunity/netbox:v3.7.8-2.8.0
  artifacthub.io/changes: |
    - kind: added
      description: "remoteAuth.keycloak.* chart-managed convenience block — renders <release>-remoteauth Secret and <release>-keycloak-pipeline ConfigMap"
    - kind: added
      description: "Worker pod wires up dnsConfig / dnsPolicy / enableServiceLinks / schedulerName / topologySpreadConstraints / shareProcessNamespace / lifecycleHooks / probes (default exec: pgrep rqworker)"
    - kind: added
      description: "helm-unittest suite expanded to 12 files / 137 tests (new Secret_test, ConfigMap_test, plus CronJob/worker regression coverage)"
    - kind: added
      description: "docs/auth.md expanded with chart-managed Keycloak section, Azure AD / Google / Okta / generic OIDC examples, group-sync semantics, and troubleshooting"
    - kind: added
      description: "tls.certManager.{issuerRef.{kind,name},tlsAcme} and auto-detect cert-manager (#79); gateway.tls.* and gateway.serviceEntry.* blocks; externalDatabase.passwordless (#63)"
    - kind: changed
      description: "Service ports default HTTP 80 → 8080, HTTPS 443 → 8443; clients hitting the netbox Service directly need to update"
    - kind: changed
      description: "Bundled postgresql 13 → 18 (PG 16 → 17), redis 19 → 27 (Redis 7 → 8); review your data path before upgrading"
    - kind: changed
      description: "global.image{Registry,Repository,Tag} default to empty; per-component image: / worker.image: / housekeeping.image: carry the strings (render is byte-identical)"
    - kind: changed
      description: "redis subchart networkPolicy.allowExternal: false + extraIngress scoped to netbox server/worker/housekeeping pods"
    - kind: changed
      description: "All template helpers migrated bitnami common → st-common 0.1.21; Chart.lock now committed with exact-pinned Bitnami deps"
    - kind: deprecated
      description: "tls.autoGenerated, tls.certManager.create, tls.autoGenerator.* — slated for removal in 6.0.0"
    - kind: fixed
      description: "CronJob housekeeping inherited server pod's containerSecurityContext / extraEnvVarsCM / sidecars / extraVolumes / args fallback — now honors housekeeping.* scoped keys"
    - kind: fixed
      description: "Worker replicaCount was gated on autoscaling.enabled (server HPA) — enabling server HPA silently stripped worker replicas"
    - kind: fixed
      description: "Secret/netbox.yaml wrote LDAP bindPassword to superuser_password key under LDAPBackend — rotate the bind password if you ran 5.0.x with LDAP"
    - kind: fixed
      description: "external-redis Secret no longer renders when no redis target is configured; pod-side projected-Secret mount is gated on the same condition"
    - kind: fixed
      description: "HTTPRoute ingress.extraPaths now translates the modern Ingress v1 backend.service.{name,port.number} shape (was crashing on non-legacy entries)"
    - kind: fixed
      description: "Missing netbox.initdbScriptsCM helper restored; #83 image precedence fix and #61/#56 capability/secret-name conflations"
  artifacthub.io/links: |
    - name: CHANGELOG
      url: https://github.com/startechnica/apps/blob/main/charts/netbox/CHANGELOG.md
    - name: Upgrading notes
      url: https://github.com/startechnica/apps/blob/main/charts/netbox/README.md#upgrading
apiVersion: v2
appVersion: v3.7.8
dependencies:
- name: postgresql
  version: 18.7.0
  repository: oci://registry-1.docker.io/bitnamicharts
  condition: postgresql.enabled
- name: redis
  version: 27.0.0
  repository: oci://registry-1.docker.io/bitnamicharts
  condition: redis.enabled
- name: st-common
  repository: oci://ghcr.io/startechnica/charts
  version: 0.1.21
description: IP address management (IPAM) and data center infrastructure management (DCIM) tool
home: https://github.com/startechnica/apps/tree/main/charts/netbox
icon: https://raw.githubusercontent.com/netbox-community/netbox/develop/docs/netbox_logo.png
keywords:
  - ipam
  - netbox
kubeVersion: ">=1.25.0"
maintainers:
  - name: firmansyahn
    email: firmansyah@nainggolan.id
    url: https://firmansyah.nainggolan.id
name: netbox
type: application
version: 5.1.0
