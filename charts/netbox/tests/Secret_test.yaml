suite: Secret (netbox / external-db / external-redis)
release:
  name: my-netbox
  namespace: netbox
tests:
  - it: netbox Secret renders by default with all chart-managed keys
    templates:
      - templates/Secret/netbox.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: my-netbox
      - equal:
          path: type
          value: Opaque
      - exists:
          path: data.email_password
      - exists:
          path: data.secret_key
      - exists:
          path: data.superuser_password
      - exists:
          path: data.superuser_api_token

  - it: netbox Secret is suppressed when existingSecretName is set
    templates:
      - templates/Secret/netbox.yaml
    set:
      existingSecretName: my-byo-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: netbox Secret omits redis password keys when redis subchart is enabled
    templates:
      - templates/Secret/netbox.yaml
    set:
      redis.enabled: true
    asserts:
      - notExists:
          path: data["redis-tasks-password"]
      - notExists:
          path: data["redis-cache-password"]

  - it: external-db Secret renders when postgresql subchart is disabled
    templates:
      - templates/Secret/external-db.yaml
    set:
      postgresql.enabled: false
      externalDatabase.host: db.example.com
      externalDatabase.password: hunter2
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: my-netbox-external-db
      - exists:
          path: data["db-password"]

  - it: external-db Secret is skipped when postgresql is enabled
    templates:
      - templates/Secret/external-db.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: external-db Secret is skipped when externalDatabase.passwordless is true
    templates:
      - templates/Secret/external-db.yaml
    set:
      postgresql.enabled: false
      externalDatabase.host: db.example.com
      externalDatabase.passwordless: true
    asserts:
      - hasDocuments:
          count: 0

  - it: external-db Secret is skipped when externalDatabase.existingSecretName is set
    templates:
      - templates/Secret/external-db.yaml
    set:
      postgresql.enabled: false
      externalDatabase.host: db.example.com
      externalDatabase.existingSecretName: my-byo-db-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: external-redis Secret renders when redis subchart is disabled
    templates:
      - templates/Secret/external-redis.yaml
    set:
      redis.enabled: false
      tasksRedis.host: redis-tasks.example.com
      cachingRedis.host: redis-cache.example.com
      tasksRedis.password: redistasks
      cachingRedis.password: rediscache
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: my-netbox-external-redis
      - exists:
          path: data["redis-tasks-password"]
      - exists:
          path: data["redis-cache-password"]

  - it: external-redis Secret is skipped when redis subchart is enabled
    templates:
      - templates/Secret/external-redis.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: external-redis Secret is skipped when tasksRedis.existingSecretName is set
    templates:
      - templates/Secret/external-redis.yaml
    set:
      redis.enabled: false
      tasksRedis.host: redis.example.com
      cachingRedis.host: redis.example.com
      tasksRedis.existingSecretName: tasks-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: external-redis Secret is skipped when redis subchart disabled but no host / passwords configured
    templates:
      - templates/Secret/external-redis.yaml
    set:
      redis.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: external-redis Secret renders when only externalRedis.host is set (password lookup will land empty)
    templates:
      - templates/Secret/external-redis.yaml
    set:
      redis.enabled: false
      externalRedis.host: redis.example.com
    asserts:
      - isKind:
          of: Secret

  - it: external-redis Secret renders when only tasksRedis.password is set (sub-block-only setup)
    templates:
      - templates/Secret/external-redis.yaml
    set:
      redis.enabled: false
      tasksRedis.host: redis-tasks.example.com
      tasksRedis.password: tasksonly
    asserts:
      - isKind:
          of: Secret
      - exists:
          path: data["redis-tasks-password"]
