suite: TLS (cert-manager Certificate + self-signed secret)
release:
  name: my-netbox
  namespace: netbox
tests:
  - it: no Certificate is rendered when cert-manager API is absent
    templates:
      - templates/Certificate.yaml
    set:
      tls.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: Certificate auto-renders when cert-manager API is present and tls.enabled
    templates:
      - templates/Certificate.yaml
    capabilities:
      apiVersions:
        - cert-manager.io/v1/Certificate
    set:
      tls.enabled: true
      ingress.hostname: netbox.example.com
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: metadata.name
          value: my-netbox
      - equal:
          path: spec.secretName
          value: my-netbox-tls
      - equal:
          path: spec.issuerRef.kind
          value: ClusterIssuer
      - equal:
          path: spec.issuerRef.name
          value: selfsigned-issuer
      - contains:
          path: spec.dnsNames
          content: netbox.example.com
          any: true

  - it: Certificate uses configured issuerRef
    templates:
      - templates/Certificate.yaml
    capabilities:
      apiVersions:
        - cert-manager.io/v1/Certificate
    set:
      tls.enabled: true
      tls.certManager.issuerRef.kind: Issuer
      tls.certManager.issuerRef.name: letsencrypt-prod
    asserts:
      - equal:
          path: spec.issuerRef.kind
          value: Issuer
      - equal:
          path: spec.issuerRef.name
          value: letsencrypt-prod

  - it: Certificate is suppressed when tls.certificatesSecret is set (BYO)
    templates:
      - templates/Certificate.yaml
    capabilities:
      apiVersions:
        - cert-manager.io/v1/Certificate
    set:
      tls.enabled: true
      tls.certificatesSecret: my-byo-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: chart-managed TLS Secret renders when tls.enabled with autoGenerated default
    templates:
      - templates/Secret/tls.yaml
    set:
      tls.enabled: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: my-netbox-crt
      - equal:
          path: type
          value: Opaque
      - exists:
          path: data["tls.crt"]
      - exists:
          path: data["tls.key"]
      - exists:
          path: data["ca.crt"]

  - it: chart-managed TLS Secret is skipped when an existingSecretName is provided
    templates:
      - templates/Secret/tls.yaml
    set:
      tls.enabled: true
      tls.existingSecretName: my-byo-tls
    asserts:
      - hasDocuments:
          count: 0
