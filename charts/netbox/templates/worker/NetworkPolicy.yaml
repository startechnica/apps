{{- if .Values.worker.networkPolicy.enabled }}
apiVersion: {{ include "st-common.capabilities.networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ template "netbox.worker.fullname" . }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- $podLabels := include "st-common.tplvalues.merge" ( dict "values" ( list .Values.worker.podLabels .Values.commonLabels ) "context" . ) }}
  podSelector:
    matchLabels: {{- include "st-common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  egress:
    # Allow dns resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
    # Allow to Redis and PostgreSQL
    - ports:
        - port: {{ include "netbox.redis.port" . }}
          protocol: TCP
      {{- if .Values.redis.enabled }}
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      {{- end }}
    - ports:
        - port: {{ include "netbox.databasePort" . }}
          protocol: TCP
      {{- if .Values.postgresql.enabled }}
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      {{- end }}
    # Allow outbound connections to other cluster pods
    - ports:
        - port: {{ .Values.service.ports.http | int }}
        {{- if not (eq .Values.containerPorts.http .Values.service.ports.http) }}
        - port: {{ .Values.containerPorts.http | int }}
        {{- end }}
      to:
        - podSelector:
            matchLabels: {{- include "st-common.labels.matchLabels" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 14 }}
    {{- if .Values.worker.networkPolicy.extraEgress }}
      {{- include "st-common.tplvalues.render" ( dict "value" .Values.worker.networkPolicy.extraEgress "context" $ ) | nindent 4 }}
    {{- end }}
  ingress:
    {{- if and .Values.metrics.enabled .Values.worker.metrics.enabled }}
    - ports:
        - port: {{ default 8080 .Values.worker.containerPorts.http }}
        {{- if not (eq .Values.worker.containerPorts.http .Values.metrics.service.ports.http) }}
        - port: {{ .Values.metrics.service.ports.http }}
        {{- end }}
    {{- end }}
    {{- if .Values.worker.extraPorts }}
    - ports:
        {{ range $extraPort := .Values.worker.extraPorts }}
        - port: {{ $extraPort.containerPort | int }}
        {{- end }}
      {{- if not .Values.worker.networkPolicy.allowExternal }}
      from:
        - podSelector:
            matchLabels:
              {{ template "netbox.worker.fullname" . }}-client: "true"
        {{- if .Values.worker.networkPolicy.ingressNSMatchLabels }}
        - namespaceSelector:
            matchLabels:
              {{- range $key, $value := .Values.worker.networkPolicy.ingressNSMatchLabels }}
              {{ $key | quote }}: {{ $value | quote }}
              {{- end }}
          {{- if .Values.worker.networkPolicy.ingressNSPodMatchLabels }}
          podSelector:
            matchLabels:
              {{- range $key, $value := .Values.worker.networkPolicy.ingressNSPodMatchLabels }}
              {{ $key | quote }}: {{ $value | quote }}
              {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.worker.networkPolicy.extraIngress }}
    {{- include "st-common.tplvalues.render" ( dict "value" .Values.worker.networkPolicy.extraIngress "context" $ ) | nindent 4 }}
    {{- end }}
{{- end }}
