{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled .Values.metrics.prometheusRule.groups }}
{{- if not (eq (include "st-common.capabilities.coreosMonitoringPrometheusRule.apiVersion" .) "false") }}
apiVersion: {{ include "st-common.capabilities.coreosMonitoringPrometheusRule.apiVersion" . }}
kind: PrometheusRule
metadata:
  name: {{ template "st-common.names.fullname" . }}
  namespace: {{ default (include "st-common.names.namespace" .) .Values.metrics.prometheusRule.namespace }}
  {{- $labels := include "st-common.tplvalues.merge" ( dict "values" ( list .Values.metrics.prometheusRule.labels .Values.commonLabels ) "context" . ) }}
  labels: {{- include "st-common.labels.standard" ( dict "customLabels" $labels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: netbox
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  groups: {{- include "st-common.tplvalues.render" (dict "value" .Values.metrics.prometheusRule.groups "context" .) | nindent 4 }}
{{- end }}
{{- end }}
