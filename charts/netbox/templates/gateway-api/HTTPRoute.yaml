{{- $implementation := default "gateway-api" .Values.gateway.implementation -}}
{{- if and .Values.gateway.enabled (eq $implementation "gateway-api") .Values.gateway.httpRoute.enabled -}}
{{- $apiVersion := include "st-common.capabilities.networkingGatewayHTTPRoute.apiVersion" . -}}
{{- if and $apiVersion (ne $apiVersion "false") -}}
apiVersion: {{ $apiVersion }}
kind: HTTPRoute
metadata:
  name: {{ include "st-common.names.fullname" . }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: netbox
  {{- if or .Values.ingress.annotations .Values.commonAnnotations }}
  {{- $annotations := include "st-common.tplvalues.merge" (dict "values" (list .Values.ingress.annotations .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "netbox.gateway.routeParentRefs" (dict "parentRefs" .Values.gateway.httpRoute.parentRefs "context" .) | nindent 4 }}
  {{- $hostnames := include "netbox.gateway.hostnames" . | trim }}
  {{- if $hostnames }}
  hostnames:
    {{- $hostnames | nindent 4 }}
  {{- end }}
  rules:
    {{- if not (empty .Values.ingress.path) }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ default "/" .Values.ingress.path | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "st-common.names.fullname" . }}
          port: {{ .Values.service.ports.http | int }}
    {{- end }}
    {{- /*
      `ingress.extraPaths` follows the Ingress shape, which has both a legacy
      (v1beta1) form — `backend.serviceName` / `backend.servicePort` — and the
      modern v1 form — `backend.service.name` / `backend.service.port.{number,name}`.
      The Ingress template splices the value through `toYaml` so it accepts
      either; HTTPRoute has no equivalent shape, so we translate both here.
      Entries that only carry a port `name` (no number) can't be expressed as
      an HTTPRoute backendRef without a Service lookup at template time, so we
      skip them — let the user pin a port `number` if they want HTTPRoute
      coverage for that path.
    */}}
    {{- range .Values.ingress.extraPaths }}
    {{- $svcName := "" }}
    {{- $svcPort := 0 }}
    {{- with .backend }}
      {{- if .service }}
        {{- $svcName = .service.name }}
        {{- with .service.port }}
          {{- if .number }}{{- $svcPort = .number -}}{{- end }}
        {{- end }}
      {{- else if .serviceName }}
        {{- $svcName = .serviceName }}
        {{- if kindIs "int" .servicePort }}{{- $svcPort = .servicePort -}}{{- end }}
        {{- if kindIs "float64" .servicePort }}{{- $svcPort = .servicePort | int -}}{{- end }}
      {{- end }}
    {{- end }}
    {{- if and $svcName $svcPort }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $svcName | quote }}
          port: {{ $svcPort | int }}
    {{- end }}
    {{- end }}
{{- end -}}
{{- end -}}
