{{- if and .Values.remoteAuth.keycloak.enabled (not .Values.remoteAuth.keycloak.existingPipelineConfigMap) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-keycloak-pipeline" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: auth
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  keycloak_pipeline_roles.py: |
    # Auto-generated by the netbox Helm chart from `remoteAuth.keycloak.*`.
    # To bypass this file with your own implementation, set
    # `remoteAuth.keycloak.existingPipelineConfigMap` to a ConfigMap you
    # manage and mount it at the same path.
    #
    # See docs/auth.md → "Configuring Keycloak" for the matching Keycloak
    # client-side mapper that must exist for each GROUP_SOURCE value.
    from django.contrib.auth.models import Group

    # Keycloak client ID — must match the `clientId` configured on the
    # Keycloak side. Read by `_client_roles()` to drill into
    # response['resource_access'][CLIENT_ID]['roles'].
    CLIENT_ID = {{ .Values.remoteAuth.keycloak.clientId | quote }}

    # Where Django Group membership claims live in the OIDC response.
    #   "client" → response['resource_access'][CLIENT_ID]['roles']
    #              (requires a "User Client Role" mapper on the Keycloak client)
    #   "realm"  → response['realm_access']['roles']
    #              (requires a "User Realm Role" mapper on the Keycloak client)
    #   "groups" → response['groups']
    #              (requires a "Group Membership" mapper on the Keycloak client)
    GROUP_SOURCE = {{ .Values.remoteAuth.keycloak.groupSource | quote }}

    # Role name → is_staff / is_superuser. Superuser implies staff.
    IS_STAFF_ROLE = {{ .Values.remoteAuth.keycloak.isStaffRole | quote }}
    IS_SUPERUSER_ROLE = {{ .Values.remoteAuth.keycloak.isSuperuserRole | quote }}

    # Keycloak role name → Django Group name, applied in addition to direct
    # (role name == group name) matching. Populated from
    # `remoteAuth.keycloak.extraGroupMappings`.
    KEYCLOAK_EXTRA_GROUP_MAPPINGS = {
        {{- range $kcRole, $djGroup := .Values.remoteAuth.keycloak.extraGroupMappings }}
        {{ $kcRole | quote }}: {{ $djGroup | quote }},
        {{- end }}
    }


    def _client_roles(response):
        try:
            return response['resource_access'][CLIENT_ID]['roles']
        except (KeyError, TypeError):
            return []


    def _realm_roles(response):
        try:
            return response['realm_access']['roles']
        except (KeyError, TypeError):
            return []


    def _sso_roles(response):
        if GROUP_SOURCE == "client":
            return _client_roles(response)
        if GROUP_SOURCE == "realm":
            return _realm_roles(response)
        return response.get('groups', []) or []


    def set_role(response, user, backend, *args, **kwargs):
        # `is_staff` / `is_superuser` are driven by client roles regardless of
        # GROUP_SOURCE — Keycloak realm roles rarely carry app-specific
        # privilege markers, and the "groups" source is even less granular.
        roles = _client_roles(response)
        user.is_superuser = IS_SUPERUSER_ROLE in roles
        user.is_staff = user.is_superuser or IS_STAFF_ROLE in roles
        user.save()


    def set_groups(response, user, backend, *args, **kwargs):
        sso_roles = _sso_roles(response)
        # Translate Keycloak role names to Django Group names where mapped.
        wanted = set()
        for role in sso_roles:
            wanted.add(KEYCLOAK_EXTRA_GROUP_MAPPINGS.get(role, role))
        for group in Group.objects.all():
            try:
                if group.name in wanted:
                    group.user_set.add(user)
                else:
                    group.user_set.remove(user)
            except Group.DoesNotExist:
                continue
{{- end -}}
