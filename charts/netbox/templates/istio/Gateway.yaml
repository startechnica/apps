{{- $implementation := default "gateway-api" .Values.gateway.implementation -}}
{{- if and .Values.gateway.enabled (eq $implementation "istio") (not .Values.gateway.existingGateway) -}}
{{- $istioApiVersion := include "st-common.capabilities.istioGateway.apiVersion" . -}}
{{- if and $istioApiVersion (ne $istioApiVersion "false") -}}
{{- $hostnames := include "netbox.gateway.hostnames" . | trim -}}
apiVersion: {{ $istioApiVersion }}
kind: Gateway
metadata:
  name: {{ include "netbox.gateway.fullname" . }}
  namespace: {{ include "netbox.gateway.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: netbox
  {{- if or .Values.ingress.annotations .Values.commonAnnotations }}
  {{- $annotations := include "st-common.tplvalues.merge" (dict "values" (list .Values.ingress.annotations .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  selector:
    {{- if .Values.gateway.selector }}
    {{- include "st-common.tplvalues.render" (dict "value" .Values.gateway.selector "context" $) | nindent 4 }}
    {{- else }}
    istio.io/gateway-name: {{ default "ingressgateway" (and .Values.gateway.gateway .Values.gateway.gateway.name) }}
    {{- end }}
  servers:
    - port:
        name: http
        number: 80
        protocol: HTTP
      hosts:
        {{- if $hostnames }}
        {{- $hostnames | nindent 8 }}
        {{- else }}
        - "*"
        {{- end }}
    {{- if and .Values.gateway.tls.enabled (not .Values.tls.enabled) }}
    - port:
        name: https
        number: 443
        protocol: HTTPS
      hosts:
        {{- if $hostnames }}
        {{- $hostnames | nindent 8 }}
        {{- else }}
        - "*"
        {{- end }}
      tls:
        credentialName: {{ include "netbox.gateway.tlsSecretName" . }}
        mode: SIMPLE
    {{- end }}
    {{- if .Values.tls.enabled }}
    - port:
        name: https-passthrough
        number: 443
        protocol: TLS
      hosts:
        {{- if $hostnames }}
        {{- $hostnames | nindent 8 }}
        {{- else }}
        - "*"
        {{- end }}
      tls:
        mode: PASSTHROUGH
    {{- end }}
{{- end -}}
{{- end -}}
