{{- /*
  Shared remoteauth Secret. One Secret per release; each social-auth provider
  (Keycloak today; Azure AD / Google / Okta / generic OIDC to follow)
  contributes its own `oidc-<provider>.yaml` stringData key, gated on that
  provider's own `enabled` flag. The whole Secret is suppressed when no
  social-auth provider is enabled.

  Loaded into Django settings by configuration.py via its
  `/run/config/extra/<provider>/*.yaml` glob — each file is applied via
  `globals().update()`, so keys here become Django settings (the
  `SOCIAL_AUTH_<PROVIDER>_*` constants) at process start.
*/}}
{{- if .Values.remoteAuth.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-remoteauth" (include "st-common.names.fullname" .) }}
  namespace: {{ include "st-common.names.namespace" . | quote }}
  labels: {{- include "st-common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: auth
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "st-common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if .Values.remoteAuth.keycloak.enabled }}
  {{- $kcRealm := trimSuffix "/" (default "" .Values.remoteAuth.keycloak.realmUrl) }}
  oidc-keycloak.yaml: |
    SOCIAL_AUTH_KEYCLOAK_KEY: {{ .Values.remoteAuth.keycloak.clientId | quote }}
    SOCIAL_AUTH_KEYCLOAK_SECRET: {{ .Values.remoteAuth.keycloak.clientSecret | quote }}
    SOCIAL_AUTH_KEYCLOAK_PUBLIC_KEY: {{ .Values.remoteAuth.keycloak.publicKey | quote }}
    {{- if $kcRealm }}
    SOCIAL_AUTH_KEYCLOAK_AUTHORIZATION_URL: {{ printf "%s/protocol/openid-connect/auth" $kcRealm | quote }}
    SOCIAL_AUTH_KEYCLOAK_ACCESS_TOKEN_URL: {{ printf "%s/protocol/openid-connect/token" $kcRealm | quote }}
    {{- end }}
    {{- if .Values.remoteAuth.keycloak.scopes }}
    SOCIAL_AUTH_KEYCLOAK_SCOPE:
    {{- range .Values.remoteAuth.keycloak.scopes }}
      - {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- if .Values.remoteAuth.keycloak.pipelines }}
    SOCIAL_AUTH_KEYCLOAK_PIPELINE:
    {{- range .Values.remoteAuth.keycloak.pipelines }}
      - {{ . | quote }}
    {{- end }}
    {{- end }}
    SOCIAL_AUTH_JSONFIELD_ENABLED: true
  {{- end }}
{{- end -}}
