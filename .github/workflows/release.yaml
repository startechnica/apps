name: Lint and Release Charts

on:
  push:
    branches:
      - "**"
    paths:
      - "charts/**"
      - ".github/workflows/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # chart-testing 3.12.0 bundles a yamale that references ast.Num, which
          # was removed in Python 3.12 — pin to 3.11 so the Chart.yaml schema
          # validation step doesn't crash.
          python-version: "3.11"

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: latest

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Add chart repositories
        run: helm repo add startechnica https://startechnica.github.io/apps

      # `ct` diffs against the default branch and lints ONLY the charts that
      # changed — building their dependencies and running helm lint + yamllint
      # + yamale schema + maintainer + version-increment checks. On a direct
      # push to the default branch nothing differs (so nothing is linted there);
      # lint happens on the feature branch before the merge.
      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --chart-dirs charts

  # Runs helm-unittest against every chart that ships a `tests/` directory —
  # currently just `charts/freeradius/tests/`. Charts without a `tests/` dir
  # are silently skipped, so this job naturally expands as we add tests to
  # other charts. Runs in parallel with `lint` for faster PR feedback.
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: latest

      - name: Install helm-unittest plugin
        # `--verify=false` because helm-unittest releases aren't signed and
        # newer Helm refuses unverifiable plugin sources by default.
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest --version 1.1.0

      # Subchart .tgz files under `charts/<chart>/charts/` are gitignored, so
      # the deps must be materialized from Chart.lock before unittest can render
      # templates that call subchart helpers (e.g. `st-common.names.fullname`).
      - name: Run helm unit tests
        run: |
          shopt -s nullglob
          failed=0
          found=0
          for tests_dir in charts/*/tests/; do
            chart="${tests_dir%/tests/}"
            found=1
            echo "::group::helm unittest $chart"
            helm dependency build "$chart"
            helm unittest "$chart" || failed=1
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No charts/<chart>/tests/ directories found — nothing to run."
          fi
          exit $failed

  release:
    needs:
      - lint
      - unittest
    # Lint runs on every branch; only publish releases from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: latest

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: true

      - name: Login to GHCR
        if: steps.cr.outputs.changed_charts != ''
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push charts to GHCR (OCI)
        if: steps.cr.outputs.changed_charts != ''
        run: |
          shopt -s nullglob
          for tgz in .cr-release-packages/*.tgz; do
            helm push "$tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
          done
