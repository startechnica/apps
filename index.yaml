        - kind: added
          description: "st-common.capabilities.envoyproxy* — Envoy Gateway (gateway.envoyproxy.io/v1alpha1) helpers: core API + Backend, BackendTrafficPolicy, ClientTrafficPolicy, EnvoyExtensionPolicy, EnvoyPatchPolicy, EnvoyProxy, HTTPRouteFilter, SecurityPolicy."
